  'work-music': b => { S.profile.workMusic = b.dataset.v; if(b.dataset.v !== 'off') S.profile.lastWorkMusic = b.dataset.v; persist(); b.parentNode.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b))); if(b.dataset.v !== 'off') previewSound(b.dataset.v); else Mix.stop(0.5); },
  'sound-start': b => { const k = b.dataset.k || previewK || S.profile.calmSound || 'rain'; startSound(k === 'off' ? 'rain' : k, +b.dataset.m); },
  'own-del': b => { MediaDB.del('f', b.dataset.id).then(loadOwn).then(() => { ['calmSound','focusSound','sleepSound','workMusic'].forEach(k => { if(S.profile[k] === 'own:' + b.dataset.id) S.profile[k] = 'off'; }); persist(); renderAll(); toast('Đã xóa file nhạc.'); }); },
  'voice-test': () => { if(!speakQueue('Hít vào thật chậm. Thở ra thật dài. Mình đang ở đây, với hơi thở này.')) toast(S.profile.voice ? 'Máy chưa có giọng tiếng Việt.' : 'Bật “Đọc hướng dẫn” trước nhé.'); },
  'voice-rate': b => { S.profile.voiceRate = +b.dataset.v; persist(); b.parentNode.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b))); speakQueue('Tốc độ đọc như thế này.'); },
  'cm-snd-toggle': () => { const p = $('#cmSnd'); if(p) p.hidden = !p.hidden; },
  'cm-snd': b => { const k = b.dataset.v; if(CM.meta.kind === 'sound' || CM.meta.sleep) CM.meta.sound = k; else { S.profile.calmSound = k; persist(); } b.closest('.cm-snd').querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b))); ambStart(k); if(CM.paused) ambPause(true); }
});
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target && e.target.id === 'tdQuick'){ e.preventDefault(); ACT['td-quick'](); } });
document.addEventListener('input', e => { const id = e.target && e.target.id; if(id === 'calmVol' || id === 'cmVol'){ const v = +e.target.value; S.profile.calmVol = v; Mix.setVol(v); } });
document.addEventListener('change', e => {
  const t = e.target, id = t && t.id; if(!id || !S.profile) return;
  if(id === 'calmVol' || id === 'cmVol') persist();
  else if(id === 'voiceSel'){ S.profile.voiceName = t.value; persist(); speakQueue('Xin chào, mình sẽ đọc hướng dẫn bằng giọng này.'); }
  else if(id === 'voiceOn' || id === 'cmVoice'){ S.profile.voice = t.checked; persist(); if(!t.checked){ try{ speechSynthesis.cancel(); }catch(err){} Mix.duck(false); } }
  else if(id === 'breathVoice'){ S.profile.breathVoice = t.checked; persist(); }
  else if(id === 'ownFile' && t.files && t.files.length){
    const fs = Array.from(t.files).filter(f => f.size <= 60 * 1024 * 1024);
    if(fs.length < t.files.length) toast('Bỏ qua file trên 60 MB.');
    Promise.all(fs.map(f => MediaDB.put('f', uid(), {blob:f, name:f.name.replace(/\.[^.]+$/, '')}))).then(loadOwn).then(() => { renderAll(); toast('Đã thêm ' + fs.length + ' file nhạc.'); }).catch(() => toast('Máy không cho lưu file lâu dài.'));
  }
});

/* ================= HLV offline: trả lời ngay trên máy ================= */
const A = (l, act, o) => Object.assign({l, act}, o || {});
function todayBrief(){
  const t = todayStr(), sc = weekSchedule(mondayOf(t)), day = sc.days[miOf(t)];
  const parts = day.items.map(it => it.kind === 'run' ? it.run.title + ' ' + num(it.run.km) + ' km' + (isDone(it) ? ' (xong)' : '') : it.kind === 'rest' ? 'nghỉ' : it.title + (isDone(it) ? ' (xong)' : ''));
  return 'Hôm nay theo lịch: ' + parts.join(', ') + '.';
}
const TUTOR = [
  {k:['chao','xin chao','hello','hi','alo','hey'], a:() => 'Chào bạn! Mình là HLV của Nhịp 21. Hỏi mình về buổi tập hôm nay, chạy bộ, đau mỏi, ăn uống hay cách giảm mỡ bụng. ' + todayBrief(), act:[A('Xem hôm nay','go',{v:'hom-nay'})]},
  {k:['hom nay tap gi','tap gi','nen tap gi','lich hom nay','tap bai nao','hom nay lam gi'], a:() => todayBrief() + ' Nếu không làm đúng được thì chọn số phút bạn có ở trang Hôm nay, app sẽ xếp bài vừa sức.', act:[A('Mở trang Hôm nay','go',{v:'hom-nay'})]},
  {k:['met','met moi','ue oai','khong co suc','duoi suc','kiet suc','buon ngu','luoi','khong muon tap','rã rời','ra roi'], a:'Ngày mệt thì giảm chứ đừng bỏ. Chọn “Mệt” ở trang Hôm nay: app bỏ bài bật nhảy và cho nghỉ lâu hơn. Mệt rã rời thì chỉ 2 phút giữ nhịp hoặc 10 phút giãn cơ cũng được tính là một ngày vận động. Nếu mệt kéo dài nhiều ngày, ngủ kém, tim đập nhanh cả lúc nghỉ thì nghỉ hẳn 1–2 ngày.', act:[A('2 phút giữ nhịp','quick2'), A('Giãn cơ 10 phút','start-focus',{f:'phuc-hoi',m:10})]},
  {k:['it thoi gian','ban qua','khong co thoi gian','5 phut','10 phut','15 phut','tap nhanh'], a:'Ít thời gian thì ưu tiên bài đốt nhiều: 10 phút Đốt mỡ kiểu Tabata gần bằng 20 phút đi bộ nhanh. Chỉ có 5 phút thì làm một bài giữa giờ. Mỗi lần ngắn cộng lại vẫn có tác dụng.', act:[A('Đốt mỡ 10 phút','start-focus',{f:'dot-mo',m:10}), A('Bụng 10 phút','start-focus',{f:'bung',m:10})]},
  {k:['mo bung','giam bung','vong bung','bung mo','bung to','bung phe','giam eo','mo eo'], a:'Mỡ bụng không đốt tại chỗ được: gập bụng làm cơ bụng khỏe, còn lớp mỡ bên trên chỉ giảm khi cả người giảm mỡ. Công thức trong lịch của bạn: 3 buổi chạy, 2 buổi tạ giữ cơ, 1 buổi đốt mỡ và core, vận động giữa giờ, cộng với ăn hơi ít hơn nhu cầu, đủ đạm và ngủ 7 tiếng. Đo vòng bụng mỗi tuần, thường sau 3–4 tuần sẽ thấy giảm.', act:[A('Xem lịch tuần','go',{v:'van-dong',s:'lich'}), A('Ghi số đo','log-body')]},
  {k:['san chac','vong dang','than hinh','co bap','tang co','dang dep','body','dong ho cat','vai rong'], a:'Săn chắc là giảm mỡ và giữ hoặc tăng cơ cùng lúc. Vì vậy lịch luôn có 2 buổi tạ mỗi tuần, xoay vòng toàn thân, vai tay lưng, mông đùi và chân cho người chạy. Ăn mỗi bữa một phần đạm. Khi một bài thấy nhẹ thì tăng độ khó chứ đừng tập lâu hơn.', act:[A('Săn chắc toàn thân 25 phút','start-focus',{f:'san-chac',m:25})]},
  {k:['ta nhe','5kg','5 kg','ta 5','nang hon','tang ta','qua de','qua nhe','ta be'], a:'Tạ 5 kg vẫn tiến bộ được lâu: hạ tạ chậm 3 giây, dừng 2 giây ở điểm khó nhất, thêm lần, chuyển sang bài một chân (RDL một chân, Bulgarian split squat, bước lên ghế), hoặc chọn kiểu Siêu set để hai bài nối nhau. Bài vai và tay như dang tạ ngang thì 5 kg là vừa đẹp.', act:[A('Mông và đùi kiểu Siêu set','start-focus',{f:'mong-dui',m:20})]},
  {k:['hit xa','xa don','pull up','pullup','khong hit duoc','chin up'], a:'Lộ trình hít xà: 1) treo xà 3 lần 30 giây, 2) treo chủ động kéo vai xuống, 3) kéo vai 8 lần, 4) hạ chậm 3–5 giây, 5 lần. Tập nhóm “Lên trình xà đơn” 2 lần mỗi tuần, thường sau 4–8 tuần có cái hít xà đầu tiên. Giảm mỡ cũng giúp nhiều.', act:[A('Lên trình xà đơn 15 phút','start-focus',{f:'xa-don',m:15})]},
  {k:['nhay day','vap day','vuong day'], a:'Nhảy dây: dây dài tới nách khi giẫm giữa dây, nhảy thấp 2–3 cm bằng mũi chân, quay bằng cổ tay, khuỷu tay sát người. Vấp thì cứ bắt đầu lại, ai cũng vấp tuần đầu. Đau ống quyển thì nhảy trên sàn gỗ hoặc thảm, giảm thời gian.'},
  {k:['dau goi','goi dau','dau khop goi','moi goi'], a:'Đau gối khi chạy thường do tăng quãng chạy quá nhanh, bước quá dài hoặc mông và hông yếu. Tạm thời: giảm quãng chạy, bước ngắn và nhanh hơn, tránh xuống dốc. Tập cầu mông, sò mở, chùng chân sang ngang. Đau nhói, sưng, đau tăng dần hoặc kéo dài quá 1 tuần thì dừng chạy và đi khám.', act:[A('Mông và đùi 20 phút','start-focus',{f:'mong-dui',m:20})]},
  {k:['bap chan','chuot rut','cang chan','dau bap','vop be'], a:'Bắp chân căng là chuyện thường của người mới chạy. Sau buổi chạy giãn bắp chân 2 lần 30 giây mỗi bên, tập nhón gót một chân 3 lần 12 cái cách ngày. Chuột rút: uống đủ nước, thêm chút muối khi trời nóng, đừng tăng tốc đột ngột. Đau nhói một điểm hoặc sưng thì nghỉ và đi khám.', act:[A('Giãn cơ 10 phút','start-focus',{f:'phuc-hoi',m:10})]},
  {k:['ong quyen','ong chan','dau ong','shin'], a:'Đau dọc ống quyển thường do tăng quãng chạy nhanh hoặc chạy nhiều trên nền cứng. Giảm quãng chạy 1–2 tuần, thay bớt bằng cardio trong nhà, tập nâng mũi chân dựa tường và nhón gót. Đau một điểm nhói khi ấn vào xương thì cần đi khám.', act:[A('Cardio trong nhà 20 phút','start-focus',{f:'trong-nha',m:20})]},
  {k:['dau lung','moi lung','lung dau','gu lung','dau vai gay','moi vai'], a:'Ngồi lâu làm lưng trên gù, hông cứng, lưng dưới gánh thay. Mỗi 45 phút đứng dậy làm bài giữa giờ “Thẳng lưng, mở vai”, tuần tập thêm nhóm “Lưng thẳng, vai mở”. Đau lan xuống chân, tê, hoặc đau sau té ngã thì đi khám trước khi tập.', act:[A('Lưng thẳng, vai mở 15 phút','start-focus',{f:'lung-tu-the',m:15})]},
  {k:['dau nguc','tuc nguc','kho tho','chong mat','ngat','hoa mat','tim dap nhanh','hoi hop'], a:'Dừng tập ngay. Đau hoặc tức ngực, khó thở bất thường, chóng mặt, choáng khi tập là dấu hiệu cần được bác sĩ kiểm tra. Nếu kéo dài, nặng dần hoặc lan ra tay, hàm thì gọi cấp cứu 115. Đừng tập lại cho tới khi đã đi khám.'},
  {k:['an truoc','truoc khi chay','an gi truoc','doi khi chay','an truoc khi tap'], a:'Trước khi chạy tối 1–2 tiếng: ăn nhẹ dễ tiêu như một quả chuối, hộp sữa chua, lát bánh mì với mật ong. Ngay sau giờ làm mà đói lả thì nửa quả chuối 20 phút trước khi chạy. Tránh đồ nhiều dầu mỡ và nhiều chất xơ ngay trước giờ chạy.'},
  {k:['sau khi chay','an sau','sau tap','an gi sau','phuc hoi an'], a:'Trong 1–2 tiếng sau tập: một bữa có đạm và tinh bột, ví dụ cơm với cá hoặc thịt nạc và rau, phở, bún gà, sữa chua với chuối. Uống bù nước. Không cần đồ uống thể thao nếu tập dưới 1 tiếng.'},
  {k:['an kieng','an uong','giam can nhanh','nhin an','calo','bua toi','an toi','an vat','an gi'], a:'Nguyên tắc ăn để giảm mỡ mà vẫn có sức chạy: ăn đủ ba bữa, mỗi bữa nửa đĩa rau, một phần đạm bằng lòng bàn tay, một phần tinh bột vừa phải. Cắt nước ngọt, trà sữa, bia trước tiên. Đừng nhịn ăn hay ăn kiêng khắc nghiệt: sẽ mệt, bỏ tập và ăn bù. Giảm khoảng nửa ký mỗi tuần là tốc độ bền.'},
  {k:['uong nuoc','nuoc','mat nuoc','dien giai','khat'], a:'Uống đều trong ngày, nước tiểu vàng nhạt là đủ. Chạy dưới 1 tiếng chỉ cần uống trước và sau. Chạy dài từ 10 km trở lên, trời nóng: mang nước, uống vài ngụm mỗi 15–20 phút, thêm chút muối hoặc nước điện giải.'},
  {k:['ngu','thuc khuya','ngu it'], a:'Ngủ 7–8 tiếng giúp hồi phục cơ, đỡ thèm ăn và có sức tập. Trang Giấc ngủ theo dõi giấc ngủ bằng micro và cảm biến của iPhone, chấm điểm, có báo thức lúc ngủ nông, thiền ngủ, truyện ngủ và âm thanh ru ngủ. Chạy tối thì xong trước giờ ngủ ít nhất 1,5 tiếng.', act:[A('Mở Giấc ngủ','go',{v:'giac-ngu',s:'dem-qua'}), A('Quét cơ thể trước khi ngủ','med-start',{k:'scan'})]},
  {k:['troi mua','mua to','dang mua','mua roi','khong ra ngoai','trong nha','khong chay duoc'], a:'Trời mưa thì có nhóm “Cardio trong nhà”: nhảy dây, bước nhanh, đấm gió, leo cầu thang theo nhịp đều, thay được buổi chạy dễ hoặc chất lượng. Riêng buổi chạy dài thì dời sang hôm khác trong tuần bằng nút Đổi ngày.', act:[A('Cardio trong nhà 25 phút','start-focus',{f:'trong-nha',m:25})]},
  {k:['nong','troi nong','oi buc','troi nang','nang nong'], a:'Trời nóng ẩm: chạy tối hoặc sáng sớm, chậm hơn 10–20 giây mỗi km là bình thường. Mặc đồ sáng màu, mang nước. Thấy chóng mặt, nổi da gà giữa trời nóng, ngừng đổ mồ hôi thì dừng ngay, vào chỗ mát.'},
  {k:['pace','toc do','chay nhanh','chay cham','nhip chay'], a:() => { const p = S.profile; if(!p.fiveK) return 'Chưa có thời gian 5 km nên app hướng dẫn theo cảm giác: chạy dễ là vẫn nói trọn câu, tempo là chỉ nói được vài từ. Chạy thử 5 km hết sức rồi nhập ở Vận động › Chạy (gõ số liền, ví dụ 3230 là 32:30), app sẽ tính pace cho từng buổi.'; const pc = paces(p.fiveK); return 'Theo thời gian 5 km của bạn: chạy dễ ' + fmtPace(pc.easy[0]) + '–' + fmtPace(pc.easy[1]) + ' mỗi km, tempo ' + fmtPace(pc.tempo) + ', pace half marathon ' + fmtPace(pc.hm) + ', dự đoán về đích khoảng ' + fmtHM(pc.hmTotal) + '. Phần lớn các buổi chạy nên ở mức dễ.'; }, act:[A('Xem lộ trình 21K','go',{v:'van-dong',s:'chay'})]},
  {k:['lo buoi','bo lo','bo tap','nghi may ngay','quen tap','lo lich','tre lich','bo buoi','nghi lau'], a:'Lỡ buổi không sao. Quy tắc duy nhất: không bỏ lỡ hai ngày liền. Buổi chưa làm hiện ở mục “Làm bù trong tuần” trên trang Hôm nay, làm ngày nào cũng tính. Bỏ cả tuần chạy cũng không sao: lịch tuần sau tự hạ quãng chạy dài cho vừa sức. Nghỉ trên 2 tuần thì quay lại với quãng chạy ngắn hơn một nửa.', act:[A('2 phút giữ nhịp','quick2')]},
  {k:['bao lau','khi nao','may tuan','bao gio thay','ket qua','bao lau thi'], a:'Thường thấy: sau 2 tuần ngủ ngon hơn, đỡ mệt khi leo cầu thang; sau 4 tuần chạy nhẹ nhàng hơn rõ, vòng bụng bắt đầu giảm; sau 8–12 tuần quần áo rộng ra, thấy đường nét vai và bắp chân. Điều quyết định là đều đặn, không phải tập thật nặng.'},
  {k:['giay','giay chay','mua giay'], a:'Giày chạy đúng size, mũi giày dư khoảng một đốt ngón tay, đi thử vào buổi chiều khi chân hơi nở. Không cần giày đắt, cần giày êm và vừa. Thay giày sau khoảng 600–800 km hoặc khi đế hết êm.'},
  {k:['tho','hut hoi','tho doc','tho khi chay','kho tho khi chay'], a:'Hụt hơi khi chạy thường là do chạy nhanh quá. Chạy chậm tới mức nói được trọn câu, thở bằng cả mũi và miệng, thở ra dài. Có thể đếm nhịp: hít vào 3 bước, thở ra 2–3 bước. Khó thở bất thường kèm đau ngực hoặc chóng mặt thì dừng và đi khám.'},
  {k:['khoi dong'], a:'Mọi buổi tập từ 10 phút trở lên trong app đã có 2 phút khởi động. Trước khi chạy: đi bộ nhanh 3 phút, xoay hông, đá lăng chân, rồi chạy thật chậm 5 phút đầu. Buổi chạy nhanh thì khởi động 1,5 km chạy dễ như ghi trong buổi tập.'},
  {k:['chay sang','chay buoi sang','buoi sang','chay toi','buoi toi','sau gio lam'], a:'Không cần dậy sớm. Chạy tối sau giờ làm có hiệu quả như chạy sáng, có khi còn khỏe hơn vì cơ thể đã ấm. Lịch của bạn để hai buổi chạy vào tối trong tuần, buổi chạy dài vào cuối tuần, sáng hoặc chiều mát như bạn quen.'},
  {k:['21 km','21km','half marathon','ngay dua','giai chay','ve dich','dang ky giai'], a:() => 'Ngày đua dự kiến ' + fullDate(raceDay()) + '. Tuần đua chỉ chạy nhẹ, không thử giày, đồ ăn hay quần áo mới. Ngày đua: xuất phát chậm ở 3 km đầu, uống nước ở trạm, đi bộ một chút khi mệt cũng được. Mục tiêu đầu tiên là về đích khỏe.', act:[A('Xem lộ trình 21K','go',{v:'van-dong',s:'chay'})]},
  {k:['gian co','cang co','deo dai','cung nguoi'], a:'Giãn cơ sau buổi chạy hoặc vào ngày phục hồi: hông, đùi trước, đùi sau, bắp chân, mông. Giữ mỗi tư thế 30–45 giây, thở chậm, không nhún. Lịch đã có một buổi giãn cơ 15 phút sau ngày chạy dài.', act:[A('Giãn cơ 15 phút','start-focus',{f:'phuc-hoi',m:15})]},
  {k:['sao luu','chuyen may','ipad','iphone','may khac','dong bo','may ca nhan','chuyen du lieu'], a:'Cài đặt (nút bánh răng góc trên), mục “Sao lưu và chuyển máy”. Máy cũ: Chép mã sao lưu, gửi qua Teams, email hay Ghi chú. Máy mới: dán mã, bấm Nhập tiến độ. Dữ liệu hai máy được gộp lại.', act:[A('Mở phần sao lưu','go-backup')]},
  {k:['kiem tra the luc','kiem tra','do suc','test'], a:'Mỗi đầu tháng lịch có một buổi kiểm tra: chống đẩy liền một lượt, squat 1 phút, plank lâu nhất, treo xà lâu nhất, hít xà, nhảy dây 1 phút. So với tháng trước để thấy mình tiến bộ, kể cả khi cân nặng chưa đổi.', act:[A('Làm bài kiểm tra','open-test',{key:''})]},
  {k:['khong giam can','dung can','can khong giam','tang can','can dung yen'], a:'Mới tập, cân có thể đứng yên vì cơ giữ thêm nước và glycogen, trong khi mỡ vẫn giảm. Nhìn vòng bụng và quần áo. Nếu 3–4 tuần cả cân và vòng bụng đều không đổi, xem lại đồ uống ngọt, bữa tối và đồ ăn vặt trước khi tập nhiều hơn.', act:[A('Ghi số đo','log-body')]},
  {k:['dau co','moi co','nhuc','dau nguoi','dau dui','dau mong','moi nguoi'], a:'Mỏi cơ 1–3 ngày sau buổi tập mới là bình thường, nhất là tuần đầu. Vận động nhẹ, giãn cơ, đi bộ giúp đỡ nhanh hơn nằm im. Khác với đau nhói, đau khớp hoặc sưng: những cái đó cần nghỉ.', act:[A('Giãn cơ 10 phút','start-focus',{f:'phuc-hoi',m:10})]},
  {k:['doi ngay','doi lich','ban ngay','lich tuan','lich thang','lich tap'], a:'Trang Vận động › Lịch: đầu tuần chọn những ngày bạn rảnh, app tự xếp lại. Chạm vào một ngày để dời từng buổi sang ngày khác hoặc ghi buổi chạy thêm. Chạy ít hay nhiều hơn kế hoạch thì lịch tuần sau tự điều chỉnh.', act:[A('Mở lịch tuần','go',{v:'van-dong',s:'lich',mode:'week'}), A('Mở lịch tháng','go',{v:'van-dong',s:'lich',mode:'month'})]},
  {k:['ngoi lau','van phong','giua gio','ngoi nhieu','ngoi may tinh'], a:'Trang Tập trung, mục Giữa giờ có 8 bài 2–3 phút làm ngay cạnh bàn, có ảnh động. Chọn kiểu phiên “45 + đứng dậy 3” để app nhắc. Mục tiêu 5 lần mỗi ngày.', act:[A('Mở Giữa giờ','go',{v:'tap-trung',s:'giua-gio'})]},
  {k:['co bung','6 mui','sau mui','bung phang','co bung lo'], a:'Cơ bụng lộ rõ khi mỡ cơ thể đủ thấp, nên chìa khóa vẫn là giảm mỡ toàn thân. Tập core 2–3 lần mỗi tuần để bụng phẳng và chắc: nhóm Bụng và eo có 4 bộ bài xoay vòng.', act:[A('Bụng và eo 15 phút','start-focus',{f:'bung',m:15})]},
  {k:['bap tay','tay to','mo tay','bap chuoi','tay sau','vai tron','vai to','tay gon'], a:'Tay gọn và chắc cần cả giảm mỡ toàn thân lẫn tập tay sau, vai: duỗi tay sau qua đầu, đá tạ ra sau, chống đẩy hẹp tay, dang tạ ngang. Có trong nhóm “Vai, tay và lưng”.', act:[A('Vai, tay và lưng 20 phút','start-focus',{f:'than-tren',m:20})]},
  {k:['mong','vong 3','dui to','dui'], a:'Mông săn và đùi gọn: tập nhóm “Mông và đùi” với đẩy hông cầm tạ, squat sumo, chùng chân chéo, bước lên ghế. Mông khỏe còn giúp chạy đỡ đau gối.', act:[A('Mông và đùi 20 phút','start-focus',{f:'mong-dui',m:20})]},
  {k:['stress','cang thang','ap luc','qua tai','met moi tinh than','burnout','kiet suc tinh than','cang dau','nang dau'], a:'Nghe như dạo này bạn đang gánh nhiều thật. Căng thẳng vì công việc và tiền bạc là phản ứng bình thường, không phải bạn yếu. Ba việc nhỏ làm được ngay: 1) Thở dài sinh lý 2 phút để hạ nhịp. 2) Viết hết lo lắng ra trong mục Xả lo âu, tách việc làm được khỏi việc ngoài tầm tay. 3) Đi bộ hoặc chạy nhẹ 10–20 phút hôm nay, vận động là cách giảm stress có bằng chứng mạnh nhất. Ngủ đủ 7 tiếng cũng quan trọng không kém. Nếu căng thẳng kéo dài nhiều tuần, ảnh hưởng tới giấc ngủ và công việc, nói chuyện với chuyên gia tâm lý sẽ giúp nhiều.', act:[A('Thở dài sinh lý 2 phút','breath-start',{k:'sigh',m:2}), A('Xả lo âu','journal-open',{k:'worry'}), A('Mở Tâm trí','go',{v:'tam-tri',s:'thien'})]},
  {k:['buon','chan nan','that vong','tuyet vong','trong rong','khong vui','buon ba','tram cam','mat hung thu','u uat'], a:'Cảm ơn bạn đã nói ra. Buồn và chán nản khi mọi việc không suôn sẻ là chuyện con người, và nó sẽ qua. Lúc buồn, đợi có hứng mới làm thì thường không đến; làm một việc nhỏ trước thì tâm trạng hay nhích lên sau: đi bộ 10 phút ngoài trời, nhắn cho một người bạn, nấu một bữa đơn giản. Tối nay thử ghi 3 điều tốt, dù nhỏ. Nếu buồn kéo dài hơn hai tuần, mất hứng thú với gần như mọi thứ, hoặc có lúc nghĩ tới việc làm hại bản thân, hãy gặp bác sĩ hoặc chuyên gia tâm lý. ' + HOTLINE, act:[A('Tử tế với chính mình','med-start',{k:'kind'}), A('3 điều tốt hôm nay','journal-open',{k:'good3'})]},
  {k:['lo lang','lo au','bat an','hoang loan','hoang so','so hai','lo so','hoi hop lo','con hoang'], a:'Khi lo lắng dâng lên: thở ra dài hơn hít vào là cách nhanh nhất báo cho cơ thể rằng mình an toàn. Thử Thở dài sinh lý 1–2 phút, hoặc Thở hộp nếu sắp vào cuộc họp. Rồi viết điều đang lo ra giấy và hỏi: việc gì trong đó mình làm được ngay hôm nay? Cơn hoảng thường lên đỉnh trong khoảng 10 phút rồi dịu xuống. Nếu kèm đau ngực, khó thở nặng hoặc lần đầu bị như vậy, hãy đi khám để loại trừ vấn đề tim mạch.', act:[A('Thở dài sinh lý 2 phút','breath-start',{k:'sigh',m:2}), A('Thở hộp 3 phút','breath-start',{k:'box',m:3}), A('Xả lo âu','journal-open',{k:'worry'})]},
  {k:['dau tu','chung khoan','co phieu','crypto','tien ao','thua lo','lo tien','mat tien','tien bac','no nan','lo von','cat lo','danh muc','thi truong'], a:'Mình không tư vấn mua bán, nhưng giúp được phần đầu óc. Những cách nhiều nhà đầu tư dùng để không bị giá kéo theo: xem danh mục vào một giờ cố định mỗi ngày (hoặc mỗi tuần), tắt thông báo giá trong giờ làm; không ra quyết định lớn khi đang hoảng, mất ngủ hay vừa đọc tin xấu, đợi ít nhất 24 giờ; viết ra kế hoạch và lý do trước mỗi quyết định; tách giá trị bản thân khỏi kết quả một khoản đầu tư. Nếu áp lực tiền bạc hay nợ nần quá lớn, nói chuyện với người tin cậy và tìm tư vấn tài chính có chuyên môn.', act:[A('Xả lo âu','journal-open',{k:'worry'}), A('Nhìn lại suy nghĩ','journal-open',{k:'reframe'}), A('Tử tế với chính mình','med-start',{k:'kind'})]},
  {k:['mat ngu','kho ngu','trang troc','thuc giac giua dem','ngu khong ngon','khong ngu duoc','suy nghi nhieu'], a:'Đầu óc chạy vòng lúc nằm là rất hay gặp khi đang căng thẳng. Trước khi lên giường 1 tiếng: viết hết việc đang lo vào Xả lo âu để não không phải giữ nó. Tắt màn hình 30 phút trước khi ngủ. Trên giường: 4 nhịp thở 4-7-8 rồi nghe bài Quét cơ thể. Nằm 20 phút chưa ngủ được thì dậy ngồi chỗ khác, đèn mờ, quay lại khi buồn ngủ. Giữ giờ thức dậy cố định cả cuối tuần. Mất ngủ kéo dài vài tuần thì nên đi khám.', act:[A('Thở 4-7-8','breath-start',{k:'b478',m:4}), A('Quét cơ thể trước khi ngủ','med-start',{k:'scan'}), A('Xả lo âu','journal-open',{k:'worry'})]},
  {k:['tap trung','xao nhang','mat tap trung','tri hoan','luoi lam','khong tap trung','pomodoro','sao lang','phan tam','lam viec hieu qua'], a:'Để giữ tập trung: 1) Mỗi sáng ghi 3 việc quan trọng, làm việc khó nhất trước. 2) Bật phiên Pomodoro hoặc Deep Work ở trang Tập trung, ghi tên việc trước khi bấm. 3) Điện thoại ra khỏi tầm tay, tắt thông báo giá và mạng xã hội. 4) Ý khác nảy ra thì thả vào Bãi đỗ ý nghĩ, xử lý vào giờ nghỉ. 5) Giờ nghỉ đứng dậy vận động hoặc thở, đừng lướt mạng. Ngại bắt đầu thì chỉ hứa làm 2 phút.', act:[A('Mở Tập trung','go',{v:'tap-trung',s:'phien'}), A('Thở hộp 1 phút','breath-start',{k:'box',m:1})]},
  {k:['thien','thien dinh','chanh niem','mindfulness','ngoi thien'], a:'Mới tập thì ngắn mà đều quan trọng hơn dài: bắt đầu với bài 3 phút cho người bận mỗi ngày, rồi tăng lên Chú tâm vào hơi thở 5 phút. Ngồi không yên thì thử Thiền đi bộ. Tối thì nghe Quét cơ thể. Tâm trí lang thang là bình thường: mỗi lần nhận ra và quay về hơi thở chính là một lần tập.', act:[A('3 phút cho người bận','med-start',{k:'m3'}), A('Thiền đi bộ','med-start',{k:'walk'})]},
  {k:['hit tho','tho sau','hit tho sau','tho bung','cach tho'], a:'Bốn bài thở trong app: Thở dài sinh lý (hạ căng nhanh nhất), Thở hộp 4-4-4-4 (trước cuộc họp, quyết định khó), Thở 4-7-8 (trước khi ngủ), Thở đều 5,5 giây (mỗi ngày, khi lo lắng kéo dài). Điểm chung: thở ra dài hơn hít vào. Chóng mặt thì dừng lại, thở bình thường.', act:[A('Thở dài sinh lý 2 phút','breath-start',{k:'sigh',m:2}), A('Thở đều 5 phút','breath-start',{k:'reso',m:5})]},
  {k:['doanh nhan','nguoi thanh cong','ceo','lanh dao','thoi quen tot','nguoi giau'], a:'Những thói quen hay gặp ở người làm việc áp lực cao: vận động gần như mỗi ngày; vài phút thiền hoặc thở (Ray Dalio kể ông thiền đều đặn hàng chục năm); chừa khoảng trống không họp trong lịch để suy nghĩ; viết ra để nghĩ rõ; ngủ đủ và giờ giấc cố định; có người để nói chuyện như huấn luyện viên, chuyên gia tâm lý hay bạn tin cậy; và có lúc ngắt hẳn khỏi màn hình. Chi tiết ở trang Tâm trí.', act:[A('Mở Tâm trí','go',{v:'tam-tri',s:'thien'})]},
  {k:['buc boi','kho chiu','cau gat','nong nay','tuc gian','buc minh','gat gong','de noi nong'], a:'Bực bội, khó chịu thường là dấu hiệu cơ thể đang quá tải: thiếu ngủ, đói, căng thẳng dồn lâu. Khi cơn bực lên: dừng lại, thở dài sinh lý vài hơi, đợi 10 phút trước khi trả lời tin nhắn hay email. Đi bộ hoặc vận động giúp xả nhanh. Rồi hỏi mình: mình có đang đói, mệt hay thiếu ngủ không?', act:[A('Thở dài sinh lý 1 phút','breath-start',{k:'sigh',m:1}), A('Đốt mỡ 10 phút','start-focus',{f:'dot-mo',m:10})]},
  {k:['met moi keo dai','luc nao cung met','hay met','met moi','uể oải keo dai','thieu nang luong','het nang luong'], a:'Mệt kéo dài thường đến từ vài thứ cộng lại: ngủ ít hoặc ngủ không sâu, căng thẳng kéo dài, ngồi nhiều ít vận động, ăn uống thất thường, uống ít nước. Thử trong hai tuần: giờ thức dậy cố định, ra ngoài trời 10 phút buổi sáng, vận động nhẹ mỗi ngày, cà phê trước 14 giờ, bữa nào cũng có đạm và rau. Nếu vẫn mệt nhiều sau vài tuần, nên đi khám tổng quát vì thiếu máu hay tuyến giáp cũng gây mệt.', act:[A('Nghỉ sâu 9 phút','med-start',{k:'nsdr'}), A('2 phút giữ nhịp','quick2')]},
  {k:['co don','mot minh','khong ai hieu','khong co ai'], a:'Cảm giác một mình khi đang khó khăn rất nặng nề. Thử một bước nhỏ hôm nay: nhắn cho một người bạn cũ một câu hỏi thăm, hẹn ai đó đi chạy hoặc đi bộ cùng, tham gia một nhóm chạy bộ cuối tuần. Không cần kể hết chuyện, chỉ cần có người ở cạnh.', act:[A('Tử tế với chính mình','med-start',{k:'kind'})]},
  {k:['tu trach','ngu ngoc','do ket','vo dung','minh kem','that bai','hoi han','tiec nuoi','sai lam'], a:'Tự trách sau một quyết định sai, nhất là chuyện tiền bạc, là phản ứng rất người. Nhưng tự trách nặng không giúp mình quyết định tốt hơn lần sau; nhìn lại một cách tử tế thì có. Thử bài Tử tế với chính mình 4 phút, rồi viết vào Nhìn lại suy nghĩ: mình đã biết gì lúc đó, học được gì cho lần sau.', act:[A('Tử tế với chính mình','med-start',{k:'kind'}), A('Nhìn lại suy nghĩ','journal-open',{k:'reframe'})]},
  {k:['day som','day som khong met','thoi quen day som','dau day','khong day duoc','ngu nuong','tat bao thuc','bao thuc','ngai day','buon ngu buoi sang'], a:'Dậy sớm mà không mệt: 1) Dời giờ dậy từ từ, mỗi 3 ngày sớm 15 phút, và đi ngủ sớm lên tương ứng để vẫn ngủ đủ 7–8 tiếng. 2) Bật theo dõi giấc ngủ: báo thức kêu lúc bạn ngủ nông, muốn tắt phải đi 20 bước. 3) Sau khi dậy uống nước, ra chỗ sáng, vận động 3 phút. 4) Hai tuần đầu chưa cần chạy sáng, cứ để buổi chạy vào tối.', act:[A('Chương trình Dậy sớm','go',{v:'giac-ngu',s:'day-som'})]},
  {k:['chu ky ngu','chu ki','chu ky','ngu sau','ngu nong','rem','giai doan ngu'], a:'Mỗi chu kỳ ngủ khoảng 90 phút (70–120 tùy người). Dậy giữa lúc ngủ sâu thì lờ đờ, cuối chu kỳ dễ dậy hơn. Nhưng quan trọng nhất là ngủ đủ, khoảng 5 chu kỳ ≈ 7,5 tiếng, và giờ dậy cố định. Trang Giấc ngủ › Dậy sớm có máy tính giờ ngủ theo chu kỳ.', act:[A('Tính giờ ngủ','go',{v:'giac-ngu',s:'day-som'})]},
  {k:['ngay to','ngu ngay','tieng ngay'], a:'Ngáy nhẹ thỉnh thoảng là thường gặp. Giảm bằng cách nằm nghiêng, kê gối cao hơn, tránh rượu bia buổi tối, giảm cân nếu thừa. Nếu ngáy to kèm ngưng thở, ngủ dậy vẫn mệt, ngủ gật ban ngày thì nên đi khám để kiểm tra ngưng thở khi ngủ.', act:[A('Xem đêm qua','go',{v:'giac-ngu',s:'dem-qua'})]},
  {k:['binh nuoc','da dep','kho da','uong du nuoc'], a:'Mục tiêu nước tính theo cân nặng và buổi tập, hiện bằng bình 750 ml ở trang Hôm nay. Mỗi lần rót đầy bình chạm một ô. Mốc dễ nhớ: sáng 1 bình trước 11h, thêm 1 bình trước 15h, 1 bình nữa trước 19h. Uống đủ giúp da bớt khô, nhưng uống thừa không làm da đẹp hơn thêm.', act:[A('Mở Hôm nay','go',{v:'hom-nay'})]},
  {k:['dam','protein','an bao nhieu','calo moi ngay','dinh duong'], a:'Với mục tiêu cơ thể cân đối: đạm khoảng 1,6–1,8 g mỗi kg cân nặng mỗi ngày, chia đều các bữa; nửa đĩa rau; tinh bột vừa phải, nhiều hơn vào ngày chạy dài. Trang Vận động › Ăn uống có sẵn món Việt quen thuộc để ghi nhanh.', act:[A('Mở Ăn uống','go',{v:'van-dong',s:'an-uong'})]},
  {k:['doc sach','luoi doc','doc nhieu','hoc tap','hoc bai','nho lau'], a:'Đọc 20 phút mỗi ngày vào giờ cố định (ví dụ trước khi ngủ thay cho lướt điện thoại) là khoảng 15–20 cuốn mỗi năm. Học nhớ lâu: tự kiểm tra thay vì đọc lại, ôn giãn cách 1–3–7 ngày, và giải thích lại bằng lời đơn giản. Trang Tập trung › Đọc & học theo dõi phút đọc, số trang và chuỗi ngày.', act:[A('Mở Đọc & học','go',{v:'tap-trung',s:'doc'})]},
  {k:['viec can lam','to do','todo','danh sach viec','quen viec'], a:'Trang Tập trung › Việc cần làm: thêm việc, chọn hạn, gắn sao tối đa 3 việc quan trọng mỗi ngày, đặt việc lặp lại. Bấm ▶ cạnh một việc để mở phiên tập trung cho đúng việc đó.', act:[A('Mở Việc cần làm','go',{v:'tap-trung',s:'viec'})]},

const Tutor = {
  answer(q){
    const n = norm(q);
    if(n.trim().length < 2) return {a:'Bạn gõ câu hỏi nhé, ví dụ “tối nay mệt tập gì”.'};
    if(riskText(q)) return {a:'Cảm ơn bạn đã nói ra điều này. Nghe như bạn đang chịu đựng rất nhiều, và bạn không phải gánh một mình.\n- Nếu bạn đang nghĩ tới việc làm hại bản thân, hãy gọi hoặc nhắn ngay cho một người thân, bạn bè ở gần. Có thể nhắn đơn giản: “Mình đang thấy rất tệ, bạn gọi cho mình được không?”\n- Đường dây hỗ trợ tâm lý Ngày Mai: 096 306 1414.\n- Nếu đang gặp nguy hiểm ngay lúc này, gọi cấp cứu 115 hoặc đến bệnh viện gần nhất.\nỞ cạnh một người khác lúc này sẽ an toàn hơn ở một mình.', act:[A('Thở đều 3 phút','breath-start',{k:'reso',m:3})], risk:true};
    let best = null, score = 0;
    for(const r of TUTOR){ let s = 0; for(const k of r.k){ const kk = norm(k).trim(); if(kk && n.includes(' ' + kk + ' ')) s += kk.split(' ').length * 2 + 1; } if(s > score){ score = s; best = r; } }
    if(!best) return {a:'Mình chưa hiểu câu này. Thử hỏi kiểu: “tối nay mệt tập gì”, “đau gối khi chạy”, “ăn gì trước khi chạy”, “làm sao giảm mỡ bụng”, “tạ 5 kg nhẹ quá”.', act:[A('Hôm nay tập gì?','coach-quick',{q:'Hôm nay tập gì?'})]};
    return {a: typeof best.a === 'function' ? best.a(n) : best.a, act: best.act || []};
  }
};

function kmChart(){
  const weeks = [], m = mondayOf(todayStr());
  for(let i = 7; i >= 0; i--){ const s = addDays(m, -7*i); weeks.push([s, kmIn(weekRange(s))]); }
  const max = Math.max(5, ...weeks.map(w => w[1])), W = 340, H = 150, bw = 26, gap = (W - 20 - bw*8) / 7;
  let bars = '';
  weeks.forEach(([s, km], i) => {
    const x = 10 + i*(bw + gap), bh = Math.round((H - 44) * km / max), y = H - 22 - bh;
    bars += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + Math.max(bh, 2) + '" rx="3" fill="' + (i === 7 ? 'var(--cobalt)' : 'var(--cobalt-soft)') + '"/>';
    if(km > 0) bars += '<text class="val" x="' + (x + bw/2) + '" y="' + (y - 5) + '" text-anchor="middle">' + num(Math.round(km*10)/10) + '</text>';
    bars += '<text x="' + (x + bw/2) + '" y="' + (H - 6) + '" text-anchor="middle">' + viDate(s) + '</text>';
  });
  if(weeks.every(x => !x[1])) bars += '<text x="' + W/2 + '" y="' + (H/2 - 6) + '" text-anchor="middle">Ghi buổi chạy đầu tiên để thấy biểu đồ</text>';
  return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Số km chạy 8 tuần gần nhất">' + bars + '</svg></div>';
}

function parseHealth(text){
  const t = String(text || ''); if(!/NHIP21-SK/i.test(t)) return null;
  const get = k => { const m = new RegExp(k + '\\s*[=:]\\s*([0-9][0-9.,\\s]*)', 'i').exec(t); return m ? m[1].trim() : null; };
  const toNum = (s, intg) => { if(s == null) return null; s = s.replace(/\s/g, ''); if(intg){ if(/^\d{1,3}([.,]\d{3})+([.,]\d+)?$/.test(s)) s = s.replace(/[.,](?=\d{3}(\D|$))/g, ''); return Math.round(parseFloat(s.replace(',', '.'))); } return parseFloat(s.replace(',', '.')); };
  const dm = /d\s*=\s*(\d{4}-\d{2}-\d{2})/.exec(t);
  const r = {steps:toNum(get('steps'), true), km:toNum(get('km')), kcal:toNum(get('kcal'), true), d:dm ? dm[1] : null};
  if(r.km != null && r.km > 200) r.km = r.km / 1000;
  if(r.steps == null && r.km == null) return null;
  return r;
}
function saveHealth(r, yesterday){
  const d = r.d || (yesterday ? addDays(todayStr(), -1) : todayStr());
  S.health[d] = Object.assign(S.health[d] || {}, {steps:r.steps || 0, km:r.km || 0, kcal:r.kcal || 0, t:Date.now()});
  S.profile.lastHealth = Date.now();
  const ks = Object.keys(S.health).sort(); ks.slice(0, Math.max(0, ks.length - 400)).forEach(k => delete S.health[k]);
  persist(); renderAll(); toast('Đã nhập ' + int(r.steps || 0) + ' bước' + (r.km ? ', ' + num(r1(r.km)) + ' km' : '') + ' cho ' + (d === todayStr() ? 'hôm nay' : viDate(d)) + '.');
}

    if(o.five.trim() && !five){ showErr('obErr', 'Thời gian 5 km cần trong khoảng 15–60 phút. Gõ số liền: 3300 là 33:00.'); return; }
    if(o.race && diffDays(todayStr(), o.race) < 28){ showErr('obErr', 'Ngày đua nên cách hôm nay ít nhất 4 tuần.'); return; }
    const p = newProfile({level:o.level, fiveK:five, raceDate:o.race || null, longDay:o.longDay, runDays:o.runDays.slice().sort((a, b) => a - b), age:parseInt(o.age, 10) || null, height:parseInt(o.h, 10) || null});
    placeStart(p); S.profile = p;
    const w = parseNum(o.w), waist = parseNum(o.waist);
    if(w || waist) S.body.push(Object.assign({d:todayStr()}, w ? {w} : {}, waist ? {waist} : {}));
    S = normalize(S); persist();
    go('hom-nay'); window.scrollTo(0, 0);
    toast('Xong! Lịch ' + getPlan().N + ' tuần đã sẵn sàng.');
  }
});

/* ================= khởi động ================= */
(function boot(){
  const local = loadLocal();
  if(local && local.profile) S = normalize(local);
  route();
  loadOwn().then(() => { if(S.profile && (UI.view === 'tam-tri' || UI.view === 'giac-ngu')) renderAll(); });
  clipsCleanup();
  if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  setInterval(() => {
    if(!S.profile || !$('#player').hidden || !$('#sheet').hidden || !$('#runner').hidden || !$('#track').hidden || !$('#calm').hidden || UI.view !== 'hom-nay') return;
    const ae = document.activeElement; if(ae && /input|textarea|select/i.test(ae.tagName)) return;
    rerender();
  }, 5 * 60000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden && S.profile && UI.view === 'hom-nay' && $('#sheet').hidden && $('#player').hidden) rerender(); });
})();

</script>
</body>
</html>
