<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nhịp 21</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nhịp 21">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1430" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F6; --surface:#FFFFFF; --surface-2:#E2E7F0; --ink:#13204A; --ink-2:#56617F; --line:#D5DBE6;
  --cobalt:#2448D8; --on-cobalt:#FFFFFF; --cobalt-soft:#DDE4FB; --cobalt-deep:#1B37A8;
  --gold:#F2B135; --on-gold:#2B1F00; --gold-soft:#FBEFD2; --gold-deep:#7A5300;
  --pine:#23805E; --pine-soft:#D6EDE3; --warn:#B23E26; --warn-soft:#F8E1DA;
  --shadow:0 14px 30px -22px rgba(19,32,74,.55);
  --rest-bg:#FBEFD2; --rest-fill:rgba(242,177,53,.42);
  --font-d:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --font-b:"Be Vietnam Pro",-apple-system,"SF Pro Text","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1430; --surface:#162045; --surface-2:#1F2B57; --ink:#E9EDF7; --ink-2:#A5B0CE; --line:#2A3664;
    --cobalt:#7B93FF; --on-cobalt:#0D1430; --cobalt-soft:#22306A; --cobalt-deep:#BFCBFF;
    --gold:#F5C04F; --on-gold:#2A1E00; --gold-soft:#3A3115; --gold-deep:#F5D58C;
    --pine:#57C49A; --pine-soft:#173A33; --warn:#F08B70; --warn-soft:#3E2220;
    --shadow:0 14px 30px -20px rgba(0,0,0,.8); --rest-bg:#1C2754; --rest-fill:rgba(245,192,79,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1430; --surface:#162045; --surface-2:#1F2B57; --ink:#E9EDF7; --ink-2:#A5B0CE; --line:#2A3664;
  --cobalt:#7B93FF; --on-cobalt:#0D1430; --cobalt-soft:#22306A; --cobalt-deep:#BFCBFF;
  --gold:#F5C04F; --on-gold:#2A1E00; --gold-soft:#3A3115; --gold-deep:#F5D58C;
  --pine:#57C49A; --pine-soft:#173A33; --warn:#F08B70; --warn-soft:#3E2220;
  --shadow:0 14px 30px -20px rgba(0,0,0,.8); --rest-bg:#1C2754; --rest-fill:rgba(245,192,79,.2);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
img,svg{max-width:100%}
button{font:inherit;color:inherit;touch-action:manipulation}
.app{max-width:640px;margin:0 auto;padding:10px max(18px, env(safe-area-inset-left,0px)) calc(104px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-right,0px))}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 14px}
.brand{font-family:var(--font-d);font-weight:800;font-size:2rem;line-height:1;display:flex;align-items:baseline;gap:6px}
.brand b{color:var(--cobalt);font-weight:800}
.coach-btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px 7px 10px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:.9rem;cursor:pointer;min-height:42px}
.coach-btn svg{color:var(--cobalt)}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{appearance:none;border:0;background:none;color:var(--ink-2);font:500 .72rem/1.2 var(--font-b);padding:9px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative;text-decoration:none;min-height:56px}
.tab[aria-current="page"]{color:var(--cobalt);font-weight:600}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:24%;right:24%;height:3px;background:var(--cobalt);border-radius:0 0 3px 3px}
.tab .dot{position:absolute;top:7px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--surface)}

.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2{font-size:1.06rem;font-weight:600;line-height:1.3}
.aside{font-size:.85rem;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.big{font-family:var(--font-d);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.note{background:var(--surface);border-left:4px solid var(--cobalt);border-radius:4px 12px 12px 4px;padding:12px 14px;font-size:.94rem}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.gold{border-left-color:var(--gold)}
.stack{display:grid;gap:10px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn-col{display:grid;gap:10px;margin-top:20px;max-width:360px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:500 .9rem/1.3 var(--font-b);cursor:pointer;min-height:40px;text-align:left}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{appearance:none;border:0;border-radius:12px;font:600 1rem/1.2 var(--font-b);padding:12px 18px;min-height:48px;cursor:pointer;background:var(--surface-2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--cobalt);color:var(--on-cobalt)}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:var(--warn);color:#fff}
.btn.small{min-height:40px;padding:7px 13px;font-size:.9rem;border-radius:10px}
.btn.block{width:100%}
.linkish{appearance:none;border:0;background:none;padding:4px 0;color:var(--cobalt);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.linkish:focus-visible,.coach-btn:focus-visible,.icon-btn:focus-visible,summary:focus-visible,.pl-ctrl button:focus-visible,.pl-x:focus-visible,.x:focus-visible,.cell:focus-visible,.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.icon-btn{appearance:none;border:0;background:var(--surface-2);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}

.greet{display:flex;justify-content:space-between;gap:10px;font-weight:600;margin-bottom:12px;flex-wrap:wrap}
.greet .muted{font-weight:400}
.bib{position:relative;background:var(--surface);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.bib-band{background:var(--cobalt);color:var(--on-cobalt);padding:11px 44px;display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:.84rem;flex-wrap:wrap}
.bib-body{padding:16px 44px 14px;display:flex;align-items:flex-end;gap:18px}
.bib-num{font-family:var(--font-d);font-weight:800;font-size:clamp(4.6rem,24vw,7.6rem);line-height:.8;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.bib-side{padding-bottom:4px}
.bib-label{font-weight:600;line-height:1.3}
.bib-week{color:var(--ink-2);font-size:.88rem;margin-top:4px}
.pin{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--paper);box-shadow:inset 0 1px 2px rgba(0,0,0,.28);z-index:1}
.pin.tl{top:10px;left:15px}.pin.tr{top:10px;right:15px}.pin.bl{bottom:12px;left:15px}.pin.br{bottom:12px;right:15px}
.lanes{display:grid;gap:8px;padding:0 44px 18px}
.lane{font-size:.76rem;color:var(--ink-2)}
.lane i{display:block;height:7px;border-radius:4px;background:var(--surface-2);margin-bottom:5px}
.lane.done i{background:var(--pine)}
.lane.done{color:var(--ink)}
@media (max-width:380px){.bib-band,.bib-body,.lanes{padding-left:34px;padding-right:34px}.pin.tl,.pin.bl{left:11px}.pin.tr,.pin.br{right:11px}}

.run{background:var(--surface);border-radius:14px;padding:15px 16px}
.run.is-done{opacity:.75}
.run-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.run h3{font-size:1.02rem;font-weight:600;margin-top:8px}
.run p{margin-top:5px}
.run-km{font-size:1.9rem}
.run-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.tag{display:inline-block;font:600 .75rem/1.3 var(--font-b);padding:3px 9px;border-radius:6px;background:var(--cobalt-soft);color:var(--cobalt-deep)}
.tag.t-long{background:var(--gold-soft);color:var(--gold-deep)}
.tag.t-quality{background:var(--surface-2);color:var(--ink)}
.tag.t-str{background:var(--gold-soft);color:var(--gold-deep)}
.tag.t-burn{background:var(--pine-soft);color:var(--pine)}
.tag.t-rec{background:var(--surface-2);color:var(--ink-2)}
.tag.t-test{background:var(--warn-soft);color:var(--warn)}
.ok{display:inline-flex;align-items:center;gap:6px;color:var(--pine);font-weight:600;font-size:.92rem;flex:none}

.pick-row{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:start;margin-top:10px}
.pick-k{font-size:.88rem;color:var(--ink-2);padding-top:9px}
@media (max-width:430px){.pick-row{grid-template-columns:1fr;gap:6px}.pick-k{padding-top:0}}
.pick-row .chips.scroll{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;margin-right:-18px;padding-right:18px}
.pick-row .chips.scroll::-webkit-scrollbar{display:none}
.pick-row .chips.scroll .chip{flex:none;white-space:nowrap}
@media (min-width:820px){.pick-row .chips.scroll{flex-wrap:wrap;overflow:visible;margin-right:0;padding-right:0}}
.preview{margin-top:16px;background:var(--surface);border-radius:14px;padding:16px;border-top:5px solid var(--cobalt)}
.pv-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.pv-head h3{font-size:1.08rem;font-weight:600}
.pv-time{font-size:2.6rem;text-align:right}
.pv-time span{display:block;font-family:var(--font-b);font-size:.75rem;font-weight:500;color:var(--ink-2)}
.fmt-line{margin-top:10px;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.preview .ex-list{margin:10px 0 14px;font-size:.92rem}
.pv-act{display:grid;grid-template-columns:1fr auto;gap:8px}

.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:440px){.meters{grid-template-columns:repeat(2,1fr)}}
.meter .v{font-family:var(--font-d);font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.meter .v small{font-size:1.1rem;color:var(--ink-2);font-weight:600}
.bar{height:6px;background:var(--surface-2);border-radius:3px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cobalt);border-radius:3px}
.meter.full .bar i{background:var(--pine)}
.meter .k{font-size:.8rem;color:var(--ink-2);margin-top:5px;line-height:1.3}

/* plan */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;max-width:520px}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:9px;padding:9px 6px;font:600 .9rem var(--font-b);color:var(--ink-2);cursor:pointer;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 10px}
.wnav h2{font-size:1.06rem;font-weight:600;text-align:center;flex:1;line-height:1.3}
.days{display:grid;gap:8px}
.day{background:var(--surface);border-radius:14px;padding:12px 14px 8px;display:grid;grid-template-columns:44px 1fr;gap:12px;border:2px solid transparent}
.day.today{border-color:var(--cobalt)}
.day-d{font-family:var(--font-d);line-height:1;padding-top:2px}
.day-d span{display:block;font-size:.95rem;color:var(--ink-2);font-weight:600}
.day-d b{display:block;font-size:1.9rem;font-weight:700;margin-top:2px}
.day.past .day-d{opacity:.6}
.slot{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0;padding-top:2px}
.slot .sl-t{flex:1;min-width:0}
.slot h3{font-size:.95rem;font-weight:600;line-height:1.3}
.slot p{font-size:.82rem;color:var(--ink-2);line-height:1.35}
.slot.done h3{color:var(--ink-2)}
.slot .btn{flex:none}
.list.pad{padding:6px 14px}
.kd{width:10px;height:10px;border-radius:3px;flex:none;background:var(--ink-2);display:inline-block}
.kd.c-run{background:var(--cobalt)}.kd.c-str{background:var(--gold)}.kd.c-burn{background:var(--pine)}.kd.c-rec{background:var(--ink-2);opacity:.45}.kd.c-test{background:var(--warn)}.kd.c-rest{background:transparent;border:1.5px solid var(--line)}
.day-x{display:flex;justify-content:flex-end}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.8rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:.74rem;color:var(--ink-2);text-align:center;padding:2px 0 4px}
.cell{appearance:none;background:var(--surface);border-radius:10px;min-height:68px;padding:6px 5px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--ink);font:inherit;border:2px solid transparent;overflow:hidden}
.cell.out{opacity:.35}
.cell.today{border-color:var(--cobalt)}
.cell .dn{font-family:var(--font-d);font-weight:700;font-size:1.1rem;line-height:1}
.cell.done .dn{color:var(--pine)}
.cell.miss{background:color-mix(in srgb, var(--surface) 80%, var(--warn) 6%)}
.cell .km{font-size:.7rem;font-weight:600;color:var(--cobalt-deep);background:var(--cobalt-soft);border-radius:4px;padding:1px 4px;align-self:flex-start;white-space:nowrap;line-height:1.3}
.cell .km.dn{background:var(--pine-soft);color:var(--pine)}
.mk-row{display:flex;gap:3px;flex-wrap:wrap}
.mk-row .kd{width:8px;height:8px;border-radius:50%}
.mk-row .kd.dn{box-shadow:0 0 0 2px var(--pine)}
@media (max-width:380px){.cell{min-height:60px;padding:5px 3px}.cell .km{font-size:.64rem;padding:1px 2px}}

.desk-clock{background:var(--surface);border-radius:16px;padding:20px 18px 18px;text-align:center}
.desk-clock .t{font-family:var(--font-d);font-weight:800;font-size:clamp(4.4rem,22vw,6.6rem);line-height:.9;font-variant-numeric:tabular-nums}
.desk-clock.due{background:var(--gold);color:var(--on-gold)}
.desk-clock .s{margin-top:8px;font-weight:500}
.desk-clock .btn-row{justify-content:center;margin-top:14px}
.due-btn{background:var(--on-gold);color:var(--gold)}
.due-ghost{border-color:rgba(43,31,0,.35)!important;color:var(--on-gold)}
.dots{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--cobalt)}
.dots i.on{background:var(--cobalt)}
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.item{padding:14px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
.item:first-child{border-top:0}
.item h3{font-size:.98rem;font-weight:600}
.item p{font-size:.86rem;color:var(--ink-2);margin-top:2px}
.item .btn{flex:none}
.item.lib{display:block}
.item.lib .btn-row{margin-top:10px}
.lib-meta{color:var(--cobalt-deep)!important;font-weight:500}

.run-h1{font-size:3.6rem;margin:4px 0 6px}
.run-h1 span{color:var(--ink-2);font-size:2rem}
.zones{margin:0;background:var(--surface);border-radius:14px;overflow:hidden}
.zones div{display:flex;justify-content:space-between;gap:14px;padding:12px 16px;border-top:1px solid var(--line)}
.zones div:first-child{border-top:0}
.zones dt{font-weight:600;font-size:.94rem}
.zones dd{margin:0;text-align:right;font-size:.9rem;color:var(--ink-2)}
.zones dd b{font-family:var(--font-d);font-size:1.3rem;color:var(--ink);font-weight:700}
.inline-form{display:flex;gap:8px;margin:10px 0 14px}
.inline-form input{flex:1;min-width:0}
.inline-form input#fiveIn{max-width:160px;flex:none}
details.plan{background:var(--surface);border-radius:14px}
details.plan summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
details.plan summary::-webkit-details-marker{display:none}
details.plan summary h2{font-size:1.02rem;font-weight:600}
details.plan summary h2::after{content:" +";color:var(--ink-2)}
details.plan[open] summary h2::after{content:" −"}
.bk{padding:0 16px 16px}
.bk textarea{font-size:.8rem;margin-top:10px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 6px 10px}
.card-tbl{background:var(--surface);border-radius:14px;padding:6px}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:470px}
.card-tbl table{min-width:0}
th,td{padding:8px 10px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
.card-tbl td:first-child{white-space:normal}
thead th{border-top:0;color:var(--ink-2);font-weight:500;font-size:.8rem}
tbody th{font-family:var(--font-d);font-size:1.1rem}
tr.cur{background:var(--cobalt-soft)}
tr.past{color:var(--ink-2)}
td.done-m{letter-spacing:2px;color:var(--pine)}
td.up{color:var(--pine);font-weight:600}
.tips{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.tips li{background:var(--surface);border-radius:12px;padding:12px 14px;font-size:.92rem}
.tips li b{display:block;font-weight:600;margin-bottom:2px}

.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week7 .d{background:var(--surface);border-radius:10px;padding:8px 2px 10px;text-align:center;border:2px solid transparent}
.week7 .d.today{border-color:var(--cobalt)}
.week7 .dn{display:block;font-size:.78rem;color:var(--ink-2)}
.week7 .mk{display:block;width:18px;height:18px;margin:6px auto 4px;border-radius:50%;background:var(--surface-2)}
.week7 .d.on .mk{background:var(--pine)}
.week7 .dm{display:block;font-family:var(--font-d);font-size:1.05rem;font-weight:600;min-height:1.2em}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
@media (max-width:440px){.nums{grid-template-columns:repeat(2,1fr)}}
.nums .v{font-family:var(--font-d);font-size:2.1rem;font-weight:700;line-height:1}
.nums .v small{font-size:1.1rem}
.nums .k{font-size:.8rem;color:var(--ink-2);margin-top:3px}
.chart{background:var(--surface);border-radius:14px;padding:12px 10px 6px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--ink-2);font-family:var(--font-b);font-size:11px}
.chart .val{fill:var(--ink);font-family:var(--font-d);font-size:13px;font-weight:600}

.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,13,34,.5)}

.coach{display:flex;flex-direction:column;height:min(88dvh,760px)}

.msg{max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;font-size:.94rem;line-height:1.55}
.msg.q{align-self:flex-end;background:var(--cobalt);color:var(--on-cobalt);border-bottom-right-radius:4px}

.due{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:30;background:var(--gold);color:var(--on-gold);border-radius:14px;padding:12px 12px 12px 16px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);width:min(600px,calc(100% - 24px));flex-wrap:wrap}
.due p{flex:1;font-weight:600;font-size:.94rem;line-height:1.35;min-width:150px}
.due .btn{background:var(--on-gold);color:var(--gold)}
.due .btn.ghost{background:transparent;color:var(--on-gold);border-color:rgba(43,31,0,.35)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:60;background:var(--ink);color:var(--paper);padding:11px 14px 11px 16px;border-radius:12px;font-size:.92rem;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 24px);box-shadow:var(--shadow)}
.toast button{appearance:none;border:0;background:none;color:var(--gold);font-weight:700;cursor:pointer;padding:4px}

.player{--pl-bg:var(--paper);--pl-fg:var(--ink);--fill:rgba(36,72,216,.10);position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--pl-bg);color:var(--pl-fg);padding:calc(env(safe-area-inset-top,0px) + 14px) max(20px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(20px, env(safe-area-inset-left,0px));overflow:hidden;transition:background-color .3s}
.player[data-phase="work"]{--pl-bg:var(--cobalt);--pl-fg:var(--on-cobalt);--fill:rgba(0,0,0,.16)}
.player[data-phase="rest"]{--pl-bg:var(--rest-bg);--pl-fg:var(--ink);--fill:var(--rest-fill)}
.player[data-phase="done"]{--pl-bg:var(--paper);--pl-fg:var(--ink)}
.pl-fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--fill);pointer-events:none;transition:height .25s linear}
.pl-top,.pl-main,.pl-ctrl{position:relative;width:100%;max-width:760px;margin-left:auto;margin-right:auto}
.pl-top{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.pl-seg{display:flex;gap:2px;height:6px;grid-column:1 / -1}
.pl-seg i{background:currentColor;opacity:.2;border-radius:2px;min-width:2px}
.pl-seg i.done{opacity:.8}
.pl-seg i.now{opacity:.5}
.pl-meta{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;font-weight:500;opacity:.9}
.pl-x{appearance:none;border:0;width:44px;height:44px;border-radius:50%;background:rgba(127,127,127,.18);color:inherit;display:grid;place-items:center;cursor:pointer}
.pl-main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 0;min-height:0}
.pl-kind{font-weight:600;font-size:.98rem;opacity:.85}
.pl-name{font-family:var(--font-d);font-weight:700;font-size:clamp(2.3rem,9.5vw,4rem);line-height:.98;margin-top:6px}
.pl-side{font-family:var(--font-b);font-size:1.05rem;font-weight:600;opacity:.9;display:block;margin-top:8px}
.pl-time{font-family:var(--font-d);font-weight:800;font-size:clamp(7rem,42vw,14rem);line-height:.84;font-variant-numeric:tabular-nums;margin:18px 0 12px;letter-spacing:-.02em}
.pl-time small{font-size:.22em;font-weight:600;letter-spacing:0;margin-left:8px}
.pl-cue{font-size:1.04rem;max-width:34em;opacity:.95}
.pl-next{margin-top:14px;font-size:.92rem;opacity:.8}
.pl-ctrl{display:flex;justify-content:center;gap:22px;align-items:center}
.pl-ctrl button{appearance:none;border:0;border-radius:50%;width:60px;height:60px;background:rgba(127,127,127,.2);color:inherit;display:grid;place-items:center;cursor:pointer}
.pl-ctrl button.main{width:82px;height:82px;background:var(--pl-fg);color:var(--pl-bg)}
.pl-done .pl-time{font-size:clamp(6rem,34vw,10rem)}
.pl-done p{margin-top:6px}
.pl-btn{appearance:none;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:12px;padding:12px 18px;min-height:50px;font-weight:600;cursor:pointer}
.pl-btn.fill{background:var(--pl-fg);color:var(--pl-bg);border-color:var(--pl-fg)}
@media (orientation:landscape) and (max-height:560px), (min-width:900px) and (orientation:landscape){
  .pl-main:not(.plain){display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"kind time" "name time" "cue time" "next time";align-content:center;column-gap:36px}
  .pl-main:not(.plain) .pl-kind{grid-area:kind}.pl-main:not(.plain) .pl-name{grid-area:name}.pl-main:not(.plain) .pl-cue{grid-area:cue;margin-top:12px}.pl-main:not(.plain) .pl-next{grid-area:next}

}

}

.calm{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;background:#10183A;color:#E9EDF7;padding:calc(env(safe-area-inset-top,0px) + 14px) max(20px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(20px, env(safe-area-inset-left,0px))}

.fig .eq{fill:var(--ink-2)}

.ex-row{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.ex-row:first-child{border-top:0}
.ex-row .fig{width:76px;height:64px}
.ex-row h3{font-size:.95rem;font-weight:600;line-height:1.3}

.ex-detail .fig{max-width:340px;margin:0 auto}
.steps{margin:12px 0 0;padding-left:0;list-style:none;counter-reset:st;display:grid;gap:8px}
.steps li{counter-increment:st;display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:.93rem;line-height:1.45}
.steps li::before{content:counter(st);width:24px;height:24px;border-radius:50%;background:var(--cobalt-soft);color:var(--cobalt-deep);font:700 .8rem/24px var(--font-b);text-align:center}
.mis{margin-top:10px;font-size:.88rem;background:var(--warn-soft);border-radius:10px;padding:9px 11px}
.mus{margin-top:8px;font-size:.84rem;color:var(--ink-2)}
.eq-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
/* player figure */
.pl-fig{width:min(62vw,36vh,300px);aspect-ratio:1.2;margin:4px 0 2px;color:inherit}
.pl-fig svg{width:100%;height:100%}
.pl-fig .gr{stroke:currentColor;opacity:.25}
.pl-fig .eq{fill:currentColor;opacity:.7}
.pl-fig .eqs{stroke:currentColor;opacity:.7}
.player .pl-time{font-size:clamp(4.6rem,24vw,9rem);margin:6px 0 8px}
.player .pl-name{font-size:clamp(1.9rem,7.5vw,3.2rem)}
@media (orientation:landscape) and (max-height:560px){.pl-fig{display:none}}
/* run detail */
.segs{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:0;background:var(--surface);border-radius:12px;overflow:hidden}
.segs li{display:grid;grid-template-columns:8px 1fr auto;gap:10px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.segs li:first-child{border-top:0}
.segs i{width:8px;align-self:stretch;border-radius:4px;background:var(--cobalt-soft)}
.segs li.k-warm i,.segs li.k-cool i{background:var(--pine)}

.segs li.k-int i,.segs li.k-tempo i,.segs li.k-hm i{background:var(--warn)}
.segs li.k-rec i,.segs li.k-walk i{background:var(--gold)}

.segs span{font-size:.8rem;color:var(--ink-2)}

.zone-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:8px}
.zone-bar i{flex:1}
/* runner overlay */
.runner{position:fixed;inset:0;z-index:52;display:flex;flex-direction:column;background:var(--night1);color:#EEF0FF;padding:calc(env(safe-area-inset-top,0px) + 12px) max(18px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px, env(safe-area-inset-left,0px));overflow:auto}
.runner[data-k="int"],.runner[data-k="tempo"],.runner[data-k="hm"],.runner[data-k="stride"]{background:#5A1F2E}

.rn-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.9rem;opacity:.9}
.rn-seg{margin-top:10px;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px}
.rn-seg .k{font-size:.8rem;opacity:.8;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.rn-seg h2{font-family:var(--font-d);font-size:clamp(1.8rem,8vw,2.6rem);line-height:1;margin-top:4px}

.rn-seg .left{font-family:var(--font-d);font-size:1.4rem;font-weight:700;margin-top:6px}

.rn-big .u{font-size:.9rem;opacity:.8}
.rn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.rn-grid b{display:block;font-family:var(--font-d);font-size:1.7rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.rn-grid span{font-size:.75rem;opacity:.75}
.rn-gps{font-size:.8rem;opacity:.75;text-align:center;margin-top:8px}
.rn-ctrl{display:flex;justify-content:center;gap:18px;margin-top:auto;padding-top:14px}
.rn-ctrl button{appearance:none;border:0;border-radius:50%;width:62px;height:62px;background:rgba(255,255,255,.14);color:inherit;display:grid;place-items:center;cursor:pointer;font:600 .75rem var(--font-b)}
.rn-ctrl button.main{width:84px;height:84px;background:#EEF0FF;color:var(--night1)}
.runner .pl-btn{color:#EEF0FF}.runner .pl-btn.fill{background:#EEF0FF;color:var(--night1);border-color:#EEF0FF}
.runner .chip{background:transparent;color:#EEF0FF;border-color:rgba(238,240,255,.35)}
.runner .chip[aria-pressed="true"]{background:#EEF0FF;color:var(--night1)}
.runner select,.runner input{background:rgba(255,255,255,.1);color:#EEF0FF;border-color:rgba(238,240,255,.3)}
.splits{width:100%;font-size:.88rem;min-width:0;margin-top:8px}
.splits td,.splits th{border-color:rgba(238,240,255,.15);padding:6px 8px}
.route{background:rgba(255,255,255,.06);border-radius:12px;margin-top:10px}
.route svg{display:block;width:100%;height:auto}
/* time inputs */
.tin{display:grid;grid-template-columns:1fr;gap:4px}
input[data-time]{font-family:var(--font-d);font-size:1.25rem;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.pace-out{font-size:.84rem;color:var(--ink-2);margin-top:5px}
/* topics */
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.topic{appearance:none;border:0;border-radius:16px;padding:14px 14px 12px;text-align:left;cursor:pointer;color:#fff;font:inherit;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.topic b{font-size:1.02rem;font-weight:700;line-height:1.25}
.topic span{font-size:.78rem;opacity:.92;line-height:1.3}
.topic .prog{height:4px;border-radius:2px;background:rgba(255,255,255,.3);margin-top:8px;overflow:hidden}
.topic .prog i{display:block;height:100%;background:#fff}
.topic[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:2px}
.tp-stress{background:linear-gradient(135deg,#E0784F,#C44E6B)}
.tp-anxiety{background:linear-gradient(135deg,#4F8DE0,#5B5BC8)}
.tp-focus{background:linear-gradient(135deg,#1F9A86,#1D6E8C)}
.tp-productivity{background:linear-gradient(135deg,#D79A1E,#C0602A)}
.tp-esteem{background:linear-gradient(135deg,#C2559B,#7E4BC4)}
.tp-relation{background:linear-gradient(135deg,#E05A73,#E08A4F)}
.tp-basics{background:linear-gradient(135deg,#5865C9,#3B3F9E)}
.tp-sleep{background:linear-gradient(135deg,#2A2F7A,#141B45)}
.sess{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.sess:first-child{border-top:0}
.sess .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--mind-soft);color:var(--mind);font:700 .85rem var(--font-b)}
.sess.done .n{background:var(--pine);color:#fff}
.sess h3{font-size:.95rem;font-weight:600;line-height:1.3}
.sess p{font-size:.8rem;color:var(--ink-2)}
.len{display:flex;gap:6px}
/* meditation orb pulse */
.med-orb{width:min(46vw,30vh,220px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 40%,#C9C1FF 0%,#7A68DA 60%,#4A3BA8 100%);animation:medpulse 10s ease-in-out infinite;box-shadow:0 0 70px rgba(169,155,255,.35);margin-bottom:22px}
@keyframes medpulse{0%,100%{transform:scale(.82)}50%{transform:scale(1)}}
/* sleep */
.sleep-hero{background:linear-gradient(160deg,var(--night2),var(--night1));color:var(--on-night);border-radius:18px;padding:18px 18px 16px;position:relative;overflow:hidden}
.sleep-hero .stars{position:absolute;inset:0;opacity:.5;pointer-events:none}
.sleep-hero .muted,.sleep-hero .aside{color:rgba(238,240,255,.75)}

.sleep-hero .btn.primary{background:#EEF0FF;color:var(--night1)}
.sc-wrap{display:flex;gap:16px;align-items:center;position:relative}
.sc-ring{width:120px;height:120px;flex:none}
.sc-ring text{fill:var(--on-night);font-family:var(--font-d);font-weight:800}
.sc-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:.84rem;flex:1}
.sc-meta b{display:block;font-family:var(--font-d);font-size:1.35rem;font-weight:700;line-height:1.05}
.comp{display:grid;gap:7px;margin-top:4px}
.comp div{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:.84rem}
.comp .bar{margin:0}
.comp .bar i{background:var(--sleep)}
.hyp{background:var(--surface);border-radius:14px;padding:10px 8px 6px}
.hyp svg{display:block;width:100%;height:auto}
.hyp text{fill:var(--ink-2);font-size:10px;font-family:var(--font-b)}
.stg{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:8px}
.stg i{display:block;height:100%}
.st-awake{background:#E8A33D}.st-rem{background:#57B9E8}.st-light{background:#7D8BF0}.st-deep{background:#3B3F9E}
.st-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--ink-2);margin-top:6px}
.st-leg span{display:inline-flex;gap:5px;align-items:center}
.st-leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ev{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:.88rem}
.ev:first-child{border-top:0}
.ev .t{color:var(--ink-2);font-variant-numeric:tabular-nums}
.track{position:fixed;inset:0;z-index:58;background:#000;color:#9AA0C8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 20px);text-align:center;user-select:none;-webkit-user-select:none}
.track .clk{font-family:var(--font-d);font-weight:700;font-size:clamp(4rem,22vw,7rem);line-height:1;color:#5D6390;font-variant-numeric:tabular-nums}
.track .lvl{width:120px;height:4px;border-radius:2px;background:#16182A;margin:16px auto 0;overflow:hidden}
.track .lvl i{display:block;height:100%;background:#3A3F6A;width:0}
.track p{margin-top:10px;font-size:.9rem;max-width:28em}
.track .t-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.track button{appearance:none;border:1.5px solid #2B2F4A;background:transparent;color:#9AA0C8;border-radius:12px;padding:12px 18px;font:600 .95rem var(--font-b);cursor:pointer;min-height:48px}
.track.dim .clk,.track.dim p,.track.dim .t-btns,.track.dim .lvl{opacity:.12;transition:opacity 2s}
.track.ring{background:#1B1440;color:#EEF0FF}
.track.ring .clk{color:#EEF0FF}
.track.ring button{border-color:rgba(238,240,255,.4);color:#EEF0FF}
.track.ring button.fill{background:#EEF0FF;color:#1B1440}
.walk-meter{width:min(70vw,280px);height:14px;border-radius:7px;background:rgba(255,255,255,.12);overflow:hidden;margin:16px auto 0}
.walk-meter i{display:block;height:100%;background:#F5C04F;width:0;transition:width .3s}
/* mixer */
.mix{display:grid;gap:8px}
.mx{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:8px 12px}
.mx input[type=range]{min-height:0;padding:0;border:0;background:transparent;accent-color:var(--sleep)}
.mx .chip{min-width:118px}
/* todo */
.td{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.td:first-child{border-top:0}
.td h3{font-size:.96rem;font-weight:500;line-height:1.35;word-break:break-word}
.td.done h3{text-decoration:line-through;color:var(--ink-2)}
.td .meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:.76rem;color:var(--ink-2);margin-top:3px}
.td .meta .late{color:var(--warn);font-weight:600}
.td-act{display:flex;gap:2px;align-items:center}
.star{appearance:none;border:0;background:none;width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--ink-2);display:grid;place-items:center}
.star[aria-pressed="true"]{color:var(--gold)}
.qadd{display:flex;gap:8px}
.qadd input{flex:1;min-width:0}
.qopts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* focus */
.focus-card .sub{font-size:.85rem;opacity:.85;margin-top:4px}
.pomo{display:flex;gap:6px;justify-content:center;margin-top:8px}
.pomo i{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;opacity:.6}
.pomo i.on{background:currentColor;opacity:1}
.bars7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px;background:var(--surface);border-radius:14px;padding:10px 10px 6px}
.bars7 div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:.7rem;color:var(--ink-2)}
.bars7 i{display:block;width:70%;max-width:26px;border-radius:4px 4px 2px 2px;background:var(--cobalt-soft);min-height:2px}
.bars7 div.today i{background:var(--cobalt)}
.bars7 b{font-family:var(--font-d);font-size:.85rem;color:var(--ink);font-weight:600}
.book{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.book:first-child{border-top:0}
.book h3{font-size:.95rem;font-weight:600}
.book .bar{margin-top:6px}
.book .bar i{background:var(--focus)}

.fbar{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;font-size:.86rem;margin-top:8px}

.fbar.v .bar i{background:var(--pine)}
.fbar b{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}

.meal-h{display:flex;justify-content:space-between;align-items:center;padding:8px 14px 2px}
.meal-h h3{font-size:.98rem;font-weight:600}

.fi .k{color:var(--ink-2);font-size:.8rem;white-space:nowrap}
.food-pick{display:grid;gap:6px;max-height:46vh;overflow:auto;margin-top:10px}

.fp span{font-size:.78rem;color:var(--ink-2)}
.water{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.water button{appearance:none;width:30px;height:38px;border-radius:6px 6px 10px 10px;border:2px solid #3FA7D6;background:transparent;cursor:pointer;padding:0}
.water button.on{background:#3FA7D6}
.plate{width:120px;height:120px;flex:none}
/* health */
.hk-steps{font-family:var(--font-d);font-size:2.4rem;font-weight:700;line-height:1}
.code{font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-all}
ol.how{margin:8px 0 0;padding-left:20px;font-size:.9rem}
ol.how li{margin:6px 0}
/* wake plan */
.wk-line{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.wk-line b{display:block;font-family:var(--font-d);font-size:1.6rem;line-height:1.05}
.wk-line span{font-size:.76rem;color:var(--ink-2)}
.sleep-hero .wk-line span{color:rgba(238,240,255,.75)}
details.plan .bk .field:first-child{margin-top:4px}
.sheet-panel .sec-h h2{font-size:1rem}
@media (min-width:1024px){.rings{grid-template-columns:repeat(4,1fr)}}
:root{--fig:#13204A;--fig-far:#8E9CC4;--fig-ghost:#C9D2E6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fig:#E9EDF7;--fig-far:#6D7BAA;--fig-ghost:#33406E}}
:root[data-theme="dark"]{--fig:#E9EDF7;--fig-far:#6D7BAA;--fig-ghost:#33406E}
.fig .figc,.ex-detail .figc{color:var(--fig)}
.fig .farc,.ex-detail .farc{color:var(--fig-far)}
.fig .ghost,.ex-detail .ghost{color:var(--fig-ghost)}

.pl-fig .ghost{opacity:.18}
.fig2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fig2 .fig{position:relative}
.fig2 .fig span{position:absolute;left:8px;top:6px;font-size:.74rem;font-weight:600;color:var(--ink-2)}
.pl-top .row{gap:8px}
.pl-x[aria-pressed="true"]{background:rgba(127,127,127,.42)}
.pl-how{appearance:none;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:6px 14px;font:600 .85rem var(--font-b);margin-top:10px;cursor:pointer;opacity:.85;align-self:flex-start}
.pl-steps{margin:10px 0 0;padding-left:22px;font-size:1rem;line-height:1.45;max-width:36em}
.pl-steps li{margin:4px 0}
.pl-main{overflow:auto}
.stack{grid-template-columns:minmax(0,1fr)}
.stack > *, .col > *{min-width:0}
.seg button{flex:1 0 auto;padding:9px 12px}
.snd-g{margin-top:8px}.snd-g:first-child{margin-top:0}
.snd-gn{font-size:.78rem;color:var(--ink-2);font-weight:600;margin-bottom:5px}
.cm-snd .snd-gn{color:#B9C0E6}
.cm-snd{max-height:42vh;overflow:auto}
.ring:focus-visible,.topic:focus-visible,.fp:focus-visible,.star:focus-visible,.tick:focus-visible,.pl-how:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.toast{pointer-events:none}.toast button{pointer-events:auto}

/* ================= UI + routing ================= */
const VIEWS = ['hom-nay','van-dong','tam-tri','giac-ngu','tap-trung'];
const SEGS = {
  'van-dong':[['lich','Lịch'],['chay','Chạy'],['bai-tap','Bài tập'],['an-uong','Ăn uống'],['co-the','Cơ thể']],
  'tam-tri':[['thien','Thiền'],['tho','Hít thở'],['nhat-ky','Nhật ký']],
  'giac-ngu':[['dem-qua','Đêm qua'],['ru-ngu','Ru ngủ'],['day-som','Dậy sớm'],['xu-huong','Xu hướng']],
  'tap-trung':[['viec','Việc cần làm'],['phien','Tập trung'],['doc','Đọc & học'],['giua-gio','Giữa giờ']]
};
const UI = {view:'hom-nay', seg:{'van-dong':'lich','tam-tri':'thien','giac-ngu':'dem-qua','tap-trung':'viec'}, pick:{min:20, energy:'ok', focus:'auto', place:'home', format:'auto'}, variant:0,
  planMode:'week', weekOff:0, monthOff:0, planOpen:false, ck:null, ckEdit:false, jw:null, deskPlace:'office', topic:null, todoF:'today', exG:'all', foodD:null, sleepId:null,
  ob:{level:'3-5', five:'', race:'', w:'', waist:'', longDay:5, runDays:[1,3], age:'', h:'', sex:'m'}};
const RENDER = {};
const LEGACY = {'lich-tap':['van-dong','lich'], 'lam-viec':['tap-trung','phien'], 'tien-do':['van-dong','co-the'], 'van-phong':['tap-trung','giua-gio'], 'bai-tap':['van-dong','bai-tap']};
function route(){
  let h = decodeURIComponent((location.hash || '').slice(1)), seg = null;
  if(LEGACY[h]){ seg = LEGACY[h][1]; h = LEGACY[h][0]; }
  const i = h.indexOf('/'); if(i > 0){ seg = h.slice(i + 1); h = h.slice(0, i); }
  UI.view = VIEWS.includes(h) ? h : 'hom-nay';
  if(seg && SEGS[UI.view] && SEGS[UI.view].some(x => x[0] === seg)) UI.seg[UI.view] = seg;
  renderAll();
}
function go(view, seg){ if(seg) UI.seg[view] = seg; const h = '#' + view + (seg ? '/' + seg : ''); if(location.hash !== h) location.hash = h; else route(); }
function segHtml(view){
  const cur = UI.seg[view];
  return '<div class="seg" role="tablist">' + SEGS[view].map(([k, l]) => '<button role="tab" data-act="seg" data-view="' + view + '" data-v="' + k + '" aria-pressed="' + (cur === k) + '">' + l + '</button>').join('') + '</div>';
}
function renderAll(){
  const has = !!S.profile;
  $('#tabs').hidden = !has;
  if(!has){ VIEWS.forEach(v => { $('#v-' + v).hidden = true; }); $('#v-onboard').hidden = false; renderOnboarding(); return; }
  $('#v-onboard').hidden = true;
  VIEWS.forEach(v => { $('#v-' + v).hidden = v !== UI.view; });
  try{ RENDER[UI.view](); }catch(e){ console.error(e); $('#v-' + UI.view).innerHTML = '<p class="empty">Có lỗi khi hiển thị trang này: ' + esc(e.message) + '</p>'; }
  $$('.tab').forEach(a => { if(a.dataset.v === UI.view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if(typeof updateDots === 'function') updateDots();
  if(typeof Anim !== 'undefined') Anim.scan();
}
function rerender(){ const y = window.scrollY; renderAll(); window.scrollTo(0, y); }
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });

/* ================= sheets, toast, copy ================= */
function openSheet(title, body, cls){
  const sh = $('#sheet');
  sh.innerHTML = '<div class="sheet-panel' + (cls ? ' ' + cls : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="sheet-h"><h2>' + esc(title) + '</h2><button class="icon-btn" data-act="sheet-close" aria-label="Đóng">' + ICON.x + '</button></div>' + body + '</div>';
  sh.hidden = false;
  if(typeof Anim !== 'undefined') Anim.scan();
}
function closeSheet(){ const sh = $('#sheet'); if(sh.hidden) return; sh.hidden = true; sh.innerHTML = ''; if(typeof Anim !== 'undefined') Anim.scan(); }
let toastT = null;
function toast(msg, actLabel, fn){
  const t = $('#toast'); if(!t) return;
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (actLabel ? '<button type="button" id="toastAct">' + esc(actLabel) + '</button>' : '');
  t.hidden = false;
  if(actLabel) $('#toastAct').onclick = () => { t.hidden = true; fn(); };
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, actLabel ? 6000 : 3400);
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){ const a = document.createElement('textarea'); a.value = t; a.setAttribute('readonly', ''); a.style.position = 'fixed'; a.style.top = '0'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); try{ a.setSelectionRange(0, t.length); }catch(e2){} let ok = false; try{ ok = document.execCommand('copy'); }catch(e3){} a.remove(); return ok; }
}
function showErr(id, msg){ const e = $('#' + id); if(e){ e.textContent = msg; e.hidden = false; } }
function dl(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function chip(k, v, label, cur, act){ return '<button class="chip" data-act="' + (act || 'pick') + '" data-k="' + k + '" data-v="' + v + '" aria-pressed="' + (String(cur) === String(v)) + '">' + label + '</button>'; }
function cols(a, b){ return '<div class="cols"><div class="col">' + a + '</div><div class="col">' + b + '</div></div>'; }
function ringSvg(frac, color, size, w){
  size = size || 64; w = w || 7; const r = (size - w) / 2, c = 2 * Math.PI * r, f = clamp(frac || 0, 0, 1);
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true"><circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="' + w + '"/>' +
    '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + w + '" stroke-linecap="round" stroke-dasharray="' + (c*f).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 ' + size/2 + ' ' + size/2 + ')"/></svg>';
}
function barsHtml(vals, labels, fmt, todayIdx){
  const mx = Math.max(1, ...vals);
  return '<div class="bars7">' + vals.map((v, i) => '<div class="' + (i === todayIdx ? 'today' : '') + '"><b>' + (v ? (fmt ? fmt(v) : v) : '') + '</b><i style="height:' + Math.round(70 * v / mx) + '%"></i><span>' + labels[i] + '</span></div>').join('') + '</div>';
}
/* actions: every button carries data-act, handlers live in ACT */
const ACT = {
  'sheet-close': () => closeSheet(),
  'seg': b => { const v = b.dataset.view; UI.seg[v] = b.dataset.v; go(v, b.dataset.v); },
  'go': b => { closeSheet(); if(b.dataset.mode) UI.planMode = b.dataset.mode; go(b.dataset.v, b.dataset.s || null); },
  'toggle-chip': b => b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'))
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const fn = ACT[b.dataset.act]; if(!fn) return;
  e.preventDefault();
  try{ fn(b, e); }catch(err){ console.error(err); toast('Lỗi: ' + err.message); }
});
document.addEventListener('input', e => {
  const t = e.target; if(!t || !t.matches) return;
  if(t.matches('input[data-time]')){ const v = maskTime(t.value); if(v !== t.value) t.value = v; if(t.dataset.paceFor) updatePaceOut(t); }
  if(t.matches('input[data-km]')){ const tt = document.getElementById(t.dataset.km); if(tt) updatePaceOut(tt); }
});
function updatePaceOut(t){
  const out = document.getElementById(t.dataset.paceFor), km = parseNum((document.getElementById(t.dataset.kmFrom) || {}).value), sec = parseDur(t.value);
  if(out) out.textContent = km && sec ? 'Pace trung bình: ' + fmtPace(sec / km) + ' /km' : '';
}
$('#sheet').addEventListener('click', e => { if(e.target.id === 'sheet') closeSheet(); });

const CFG = {tired:{w:30,r:25}, ok:{w:40,r:20}, strong:{w:45,r:15}};

}

const MediaDB = {
  open(){ return new Promise((res, rej) => { if(!window.indexedDB) return rej(new Error('no idb')); const r = indexedDB.open('nhip21-media', 2); r.onupgradeneeded = () => { const db = r.result; if(!db.objectStoreNames.contains('f')) db.createObjectStore('f'); if(!db.objectStoreNames.contains('clips')) db.createObjectStore('clips'); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async put(store, key, v){ const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).put(v, key); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
  async del(store, key){ const db = await this.open(); return new Promise(res => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete = () => res(); tx.onerror = () => res(); }); },
  async all(store){ const db = await this.open(); return new Promise((res, rej) => { const out = [], tx = db.transaction(store), r = tx.objectStore(store).openCursor(); r.onsuccess = () => { const c = r.result; if(c){ out.push([c.key, c.value]); c.continue(); } else res(out); }; r.onerror = () => rej(r.error); }); }

function viVoices(){ try{ return (window.speechSynthesis && speechSynthesis.getVoices() || []).filter(v => /^vi/i.test(v.lang)); }catch(e){ return []; } }
function bestVi(){
  const vs = viVoices(); if(!vs.length) return null;
  const p = S.profile; if(p && p.voiceName){ const v = vs.find(x => x.name === p.voiceName); if(v) return v; }
  const sc = v => (/natural|neural|premium|enhanced|nâng cao/i.test(v.name) ? 4 : 0) + (/online/i.test(v.name) ? 2 : 0) + (/hoaimy|linh|google/i.test(v.name) ? 1 : 0);
  return vs.slice().sort((a, b) => sc(b) - sc(a))[0];
}
function speakQueue(text, rate){
  if(!S.profile || !S.profile.voice || !text) return false;
  const v = bestVi(); if(!v) return false;
  try{
    speechSynthesis.cancel();
    const parts = (String(text).match(/[^.!?…;:]+[.!?…;:]*/g) || [String(text)]).map(x => x.trim()).filter(Boolean);
    parts.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p); u.voice = v; u.lang = v.lang; u.rate = rate || S.profile.voiceRate || 0.95;
      if(i === 0) u.onstart = () => Mix.duck(true);
      if(i === parts.length - 1){ u.onend = () => Mix.duck(false); u.onerror = () => Mix.duck(false); }
      speechSynthesis.speak(u);
    });
    return true;
  }catch(e){ return false; }
}
function say(text){ speakQueue(text, Math.max(1, (S.profile && S.profile.voiceRate) || 1)); }
function viVoice(){ return bestVi(); }

    [50,'Cảm nhận nhiệt độ trên da, mặt đất dưới chân, mùi của không khí.'],
    [55,'Ở nơi này, bạn không phải làm gì, không phải chứng minh gì. Chỉ nghỉ.'],
    [45,'Biết rằng nơi này luôn ở đó. Lúc nào lo lắng, bạn có thể nhắm mắt và quay lại.'],
    [20,'Thở sâu, mang theo cảm giác bình yên, từ từ mở mắt.']]},
  fc1:{n:'Đếm hơi thở 1 đến 10', when:'Mỗi sáng, luyện chú ý cơ bản', steps:[
    [20,'Ngồi thẳng, nhắm mắt hoặc nhìn xuống một điểm trước mặt.'],
    [40,'Đếm thầm từng hơi thở ra: thở ra, một. Thở ra, hai. Tới mười thì quay về một.'],
    [60,'Nếu quên mất đang đếm tới đâu, hoặc đếm quá mười, chỉ cần nhẹ nhàng bắt đầu lại từ một. Đó không phải thất bại, đó chính là bài tập.'],
    [60,'Mỗi lần nhận ra tâm trí đi lang thang rồi đưa nó về, chú ý của bạn mạnh thêm một chút. Như một lần nâng tạ.'],
    [60,'Tiếp tục đếm. Một đến mười.'],
    [60,'Để ý cảm giác hơi thở ở đầu mũi: mát khi vào, ấm khi ra.'],
    [20,'Dừng đếm. Thở tự nhiên vài hơi rồi mở mắt.']]},
  fc2:{n:'Một điểm nhìn', when:'Trước khi học hoặc làm việc khó, mở mắt', steps:[
    [25,'Chọn một vật nhỏ trước mặt: cây bút, cốc nước, một chiếc lá. Ngồi thoải mái, mắt nhìn vào nó.'],
    [50,'Nhìn như thể lần đầu thấy vật này. Hình dạng. Đường viền. Chỗ sáng, chỗ tối.'],
    [50,'Màu sắc không phải chỉ một màu. Có những sắc độ khác nhau. Để ý chúng.'],
    [55,'Khi mắt hoặc tâm trí muốn rời đi, nhẹ nhàng đưa về vật đó.'],
    [55,'Không cần nghĩ về vật, không cần gọi tên. Chỉ nhìn.'],
    [45,'Giờ nhắm mắt lại. Hình ảnh của vật còn lưu lại không? Giữ nó trong vài hơi thở.'],
    [20,'Mở mắt. Mang sự chú ý trọn vẹn này vào việc đầu tiên bạn sắp làm.']]},
  fc3:{n:'Lắng nghe âm thanh', when:'Khi ở nơi ồn ào, khó tập trung', steps:[
    [20,'Nhắm mắt. Thay vì chặn tiếng ồn, bài này dùng chính âm thanh làm điểm neo.'],
    [50,'Lắng nghe âm thanh gần nhất. Có thể là tiếng quạt, tiếng gõ phím, tiếng xe. Chỉ nghe, không đặt tên tốt hay xấu.'],
    [50,'Rồi mở rộng ra âm thanh xa hơn. Ngoài cửa sổ. Ngoài đường.'],
    [55,'Để ý âm thanh xuất hiện rồi biến mất. Chúng đến và đi, bạn chỉ là người nghe.'],
    [55,'Nếu bị cuốn vào suy nghĩ, quay về âm thanh gần nhất.'],
    [45,'Nghe cả khoảng lặng giữa các âm thanh.'],
    [20,'Mở mắt. Tiếng ồn vẫn còn, nhưng bạn đã luyện được cách không bị nó kéo đi.']]},
  fc4:{n:'Trước phiên làm việc sâu', when:'Ngay trước khi bật đồng hồ tập trung', steps:[
    [20,'Ngồi vào bàn, điện thoại úp mặt hoặc để xa. Thở ra dài.'],
    [40,'Hỏi mình: trong phiên này, mình sẽ làm đúng một việc gì? Gọi tên nó thật cụ thể, ví dụ “viết xong phần mở đầu báo cáo”.'],
    [45,'Hình dung lúc kết thúc phiên: việc đó đã xong. Cảm giác thế nào?'],
    [45,'Nghĩ trước: điều gì có thể làm mình xao nhãng? Khi nó xuất hiện, mình sẽ ghi vào Bãi đỗ ý nghĩ rồi quay lại.'],
    [45,'Ba hơi thở: hít vào, “mình ở đây”; thở ra, “một việc”.'],
    [20,'Mở mắt, bấm bắt đầu. Bắt đầu từ bước nhỏ nhất.']]},
  pd1:{n:'Khởi động ngày mới', when:'Buổi sáng, trước khi mở email', steps:[
    [20,'Ngồi thẳng, nhắm mắt. Ba hơi thở chậm để chào ngày mới.'],
    [45,'Cảm nhận cơ thể sáng nay. Đã ngủ đủ chưa? Có chỗ nào mỏi? Chỉ ghi nhận.'],
    [50,'Hỏi mình: hôm nay, nếu chỉ làm xong ba việc thì ngày vẫn đáng giá, đó là ba việc nào?'],
    [50,'Chọn việc quan trọng nhất trong ba. Hình dung mình bắt đầu nó vào giờ tỉnh táo nhất.'],
    [45,'Nghĩ về một điều nhỏ sẽ làm cho bản thân hôm nay: một buổi chạy, bữa trưa tử tế, ngủ sớm.'],
    [40,'Đặt một ý định cho cả ngày bằng một từ: bình tĩnh, tập trung, tử tế, kiên nhẫn.'],
    [20,'Mở mắt, ghi ba việc vào danh sách Việc cần làm của app.']]},
  pd2:{n:'Nghỉ giữa giờ 5 phút', when:'Sau một phiên tập trung, trước khi lướt mạng', steps:[
    [25,'Rời mắt khỏi màn hình. Nhìn ra xa, ra cửa sổ nếu có, trong vài hơi thở.'],
    [45,'Duỗi người: vươn hai tay lên cao, nghiêng sang trái, sang phải. Xoay vai ra sau vài vòng.'],
    [45,'Ngồi lại, nhắm mắt. Thở ra dài vài lần, để đầu óc nguội đi.'],
    [50,'Để ý cảm giác trong đầu: căng, nặng hay rối? Không cần sửa, chỉ ghi nhận.'],
    [50,'Thở đều. Mỗi hơi thở ra, thả những gì vừa làm xuống.'],
    [40,'Uống một ngụm nước. Cảm nhận nó mát thế nào.'],
    [20,'Mở mắt. Sẵn sàng cho phiên tiếp theo.']]},
  pd3:{n:'Vượt qua trì hoãn', when:'Khi biết phải làm mà cứ ngại bắt đầu', steps:[
    [20,'Ngồi yên, nghĩ về việc bạn đang né.'],
    [45,'Để ý cảm giác trong cơ thể khi nghĩ về nó: nặng, chán, sợ làm không tốt? Gọi tên cảm giác đó.'],
    [50,'Trì hoãn thường không phải do lười, mà do muốn tránh cảm giác khó chịu này. Nói với mình: “Khó chịu một chút cũng không sao.”'],
    [50,'Chia việc đó thành bước nhỏ nhất có thể, nhỏ tới mức buồn cười. Ví dụ: mở file ra. Viết một câu.'],
    [45,'Hứa với mình chỉ làm bước đó trong 2 phút. Sau 2 phút được phép dừng.'],
    [40,'Hít một hơi, thở ra. Hình dung tay bạn đang làm bước nhỏ đó.'],
    [15,'Mở mắt và làm ngay bước đầu tiên.']]},
  pd4:{n:'Khép lại ngày làm việc', when:'Cuối giờ làm, để tối thật sự nghỉ', steps:[
    [20,'Ngồi yên, thở ra dài. Ngày làm việc sắp xong.'],
    [45,'Nhìn lại: hôm nay mình đã làm được gì? Kể cả việc nhỏ. Ghi nhận chúng.'],
    [45,'Việc nào còn dang dở? Hình dung bạn ghi chúng ra giấy, kèm bước tiếp theo cho ngày mai.'],
    [45,'Nói thầm: “Ngày làm việc đã xong. Phần còn lại để mai.”'],
    [50,'Thả vai, thả hàm. Cảm nhận ranh giới giữa công việc và buổi tối của bạn.'],
    [40,'Nghĩ về một điều bạn mong chờ tối nay: buổi chạy, bữa cơm, cuốn sách.'],
    [20,'Mở mắt, đóng máy tính.']]},
  es2:{n:'Nhìn lại điều mình làm tốt', when:'Khi thấy mình kém cỏi, tụt tự tin', steps:[
    [20,'Ngồi thoải mái, thở vài hơi.'],
    [50,'Nhớ lại một lần bạn đã vượt qua khó khăn. Có thể là việc nhỏ: lần đầu chạy được 3 km, một dự án khó đã xong, một lần giúp ai đó.'],
    [50,'Lúc đó bạn đã dùng phẩm chất gì? Kiên trì, cẩn thận, tử tế, dũng cảm?'],
    [50,'Nhớ thêm một lần nữa, ở chuyện khác. Phẩm chất đó có xuất hiện lại không?'],
    [50,'Những phẩm chất này vẫn ở trong bạn, kể cả hôm nay khi mọi thứ không suôn sẻ.'],
    [45,'Nói thầm: “Mình đã từng làm được. Mình có thể học cách làm được lần này.”'],
    [20,'Mở mắt. Ghi một phẩm chất vào sổ nếu muốn nhớ.']]},
  es3:{n:'Giọng nói bên trong', when:'Khi tự trách, tự chê quá nhiều', steps:[
    [20,'Ngồi yên, thở chậm.'],
    [45,'Nhớ lại một câu bạn hay tự nói với mình khi mắc lỗi. Ví dụ: “Mình thật ngu”, “Lúc nào cũng hỏng”.'],
    [45,'Để ý giọng điệu của câu đó. Nó có giống giọng ai không? Nó có công bằng không?'],
    [50,'Giờ tưởng tượng người bạn thân mắc đúng lỗi đó. Bạn sẽ nói gì với họ?'],
    [50,'Thử nói câu đó với chính mình, chậm rãi, bằng giọng ấm áp.'],
    [45,'Phê bình gay gắt không làm mình giỏi hơn. Nhìn lại tử tế mới giúp mình rút kinh nghiệm.'],
    [20,'Thở sâu. Mở mắt. Lần sau giọng chê bai xuất hiện, bạn đã có câu trả lời.']]},
  es4:{n:'Tư thế vững vàng', when:'Trước buổi thuyết trình, cuộc gặp quan trọng', steps:[
    [20,'Đứng dậy nếu được. Hai chân rộng bằng vai, cảm nhận cả bàn chân bám sàn.'],
    [40,'Kéo vai về sau và xuống, mở ngực. Đỉnh đầu như được kéo nhẹ lên trần.'],
    [45,'Thở bằng bụng, chậm và sâu. Hơi thở chậm giúp giọng nói vững hơn.'],
    [45,'Nhớ lại mình đã chuẩn bị thế nào cho việc sắp tới. Bạn biết nhiều hơn bạn nghĩ.'],
    [40,'Hồi hộp là năng lượng. Nói với mình: “Mình đang hào hứng.”'],
    [35,'Ba hơi thở cuối: hít vào, đứng vững; thở ra, thả lỏng.'],
    [15,'Mỉm cười nhẹ. Bước vào.']]},
  rl1:{n:'Gửi lời chúc an lành', when:'Khi thấy xa cách, khó chịu với người khác', steps:[
    [20,'Ngồi yên, đặt tay lên ngực. Thở vài hơi chậm.'],
    [45,'Bắt đầu với chính mình. Nói thầm: “Mong mình được bình an. Mong mình được khỏe. Mong mình sống nhẹ nhàng.”'],
    [45,'Nghĩ về một người bạn thương. Hình dung khuôn mặt họ. Gửi tới họ: “Mong bạn bình an. Mong bạn khỏe. Mong bạn hạnh phúc.”'],
    [45,'Nghĩ về một người bạn chỉ quen sơ: người bán cà phê, đồng nghiệp ít nói chuyện. Gửi lời chúc tương tự.'],
    [50,'Nghĩ về một người đang làm bạn khó chịu, ở mức vừa phải. Thử gửi lời chúc, dù chỉ một chút: “Mong bạn cũng bớt khổ.”'],
    [45,'Mở rộng ra tất cả mọi người: những ai đang lo, đang buồn, đang mệt như bạn. Mong tất cả được bình an.'],
    [20,'Thở sâu. Mở mắt.']]},
  rl2:{n:'Lắng nghe trọn vẹn', when:'Trước cuộc nói chuyện quan trọng với người thân', steps:[
    [20,'Ngồi yên, thở ra dài vài lần.'],
    [45,'Nghĩ về người bạn sắp nói chuyện. Họ đang gánh điều gì? Họ cần được nghe điều gì?'],
    [45,'Đặt ý định: lần này mình nghe để hiểu, không phải nghe để đáp lại.'],
    [50,'Hình dung lúc họ nói. Bạn nhìn họ, không nhìn điện thoại. Khi muốn ngắt lời, bạn thở một hơi rồi chờ.'],
    [45,'Bạn hỏi lại: “Ý bạn là… phải không?” Họ thấy được hiểu.'],
    [40,'Để ý cơ thể khi nghĩ tới cuộc nói chuyện. Thả lỏng vai, hàm, bàn tay.'],
    [20,'Mở mắt. Mang sự kiên nhẫn này vào cuộc gặp.']]},
  rl3:{n:'Buông bớt cơn giận', when:'Sau va chạm, trước khi nhắn tin trả lời', steps:[
    [20,'Dừng lại. Đừng trả lời ngay. Ngồi xuống và thở ra thật dài.'],
    [45,'Cảm nhận cơn giận trong cơ thể: mặt nóng, tim đập nhanh, tay siết lại. Gọi tên: “Đây là giận.”'],
    [50,'Giận thường che một cảm xúc khác bên dưới: bị tổn thương, bị coi thường, sợ hãi. Bên dưới cơn giận này là gì?'],
    [50,'Thở vào chỗ cơ thể đang nóng nhất. Thở ra, để nhiệt hạ xuống một chút.'],
    [50,'Hỏi: mười ngày nữa, chuyện này còn quan trọng như bây giờ không? Mình muốn mối quan hệ này ra sao?'],
    [45,'Nếu cần nói, mình sẽ nói về cảm giác của mình, không phải về lỗi của họ: “Mình thấy buồn khi…”'],
    [20,'Thở sâu. Đợi thêm ít phút rồi hãy trả lời.']]},
  rl4:{n:'Biết ơn một người', when:'Cuối tuần, hoặc khi thấy cô đơn', steps:[
    [20,'Ngồi yên, thở chậm.'],
    [50,'Nghĩ về một người đã giúp bạn, dù lớn hay nhỏ: cha mẹ, thầy cô, người bạn, một người lạ.'],
    [50,'Nhớ lại cụ thể họ đã làm gì. Lúc đó bạn cảm thấy thế nào?'],
    [50,'Điều họ làm đã thay đổi gì trong cuộc sống của bạn?'],
    [50,'Nói thầm lời cảm ơn với họ, như thể họ đang ngồi trước mặt.'],
    [40,'Nếu được, hôm nay nhắn cho họ một tin ngắn để cảm ơn.'],
    [20,'Mở mắt, mang theo sự ấm áp này.']]},
  /* thiền cho giấc ngủ */
  sl1:{n:'Đếm ngược để chìm vào giấc ngủ', when:'Nằm mãi chưa ngủ được', sleep:1, steps:[
    [30,'Nằm ngửa hoặc nằm nghiêng tùy thích. Tắt đèn. Để điện thoại xa một chút.'],
    [40,'Thở ra dài ba lần. Mỗi lần thở ra, cơ thể lún sâu thêm xuống nệm.'],
    [60,'Bây giờ đếm ngược thật chậm từ năm mươi, mỗi hơi thở ra một số. Năm mươi… bốn mươi chín… Nếu quên số, cứ bắt đầu lại ở bất kỳ số nào.'],
    [90,'Mỗi con số là một bậc thang đi xuống, sâu hơn, chậm hơn, mềm hơn.'],
    [90,'Không cần cố ngủ. Chỉ cần đếm và thở.'],
    [120,'Cứ đếm tiếp. Nếu thấy mình chìm đi, cứ để giấc ngủ đến.'],
    [120,'…']]},
  sl2:{n:'Thả suy nghĩ trôi theo dòng suối', when:'Đầu óc chạy vòng, nghĩ chuyện ngày mai', sleep:1, steps:[
    [30,'Nằm thoải mái, nhắm mắt. Thở chậm.'],
    [50,'Hình dung bạn nằm bên một dòng suối nhỏ. Nước chảy chậm. Trên mặt nước có những chiếc lá trôi qua.'],
    [60,'Mỗi khi một suy nghĩ xuất hiện, đặt nó lên một chiếc lá. Nhìn chiếc lá trôi đi theo dòng nước.'],
    [60,'Suy nghĩ về công việc, đặt lên lá. Suy nghĩ về tiền bạc, đặt lên lá. Không cần giải quyết, chỉ để chúng trôi.'],
    [90,'Nếu dòng suối chảy chậm lại hay nhanh lên, không sao. Nếu bạn bị cuốn theo một chiếc lá, chỉ cần quay lại bờ.'],
    [90,'Tiếng nước chảy đều. Hơi thở chậm. Cơ thể nặng dần.'],
    [120,'Cứ nằm bên dòng suối. Để giấc ngủ đến khi nó muốn.']]},
  sl3:{n:'Biết ơn cuối ngày', when:'Trước khi ngủ, ngày không suôn sẻ', sleep:1, steps:[
    [30,'Nằm xuống, kéo chăn. Thở ra dài vài lần.'],
    [50,'Nhớ lại một điều tốt nhỏ đã xảy ra hôm nay. Một bữa ăn ngon, một câu chào, một lúc yên tĩnh.'],
    [50,'Ở lại với ký ức đó. Cảm giác lúc đó thế nào?'],
    [50,'Nhớ thêm một điều nữa. Có thể là điều bạn đã làm cho người khác.'],
    [50,'Và một điều về chính cơ thể bạn: đôi chân đã đưa bạn đi, hơi thở vẫn đều đặn suốt ngày.'],

  c1:{n:'Hiên nhà Đà Lạt ngày mưa', bg:'rain', p:[
    'Chiều nay Đà Lạt mưa. Không phải cơn mưa ào ạt, mà là thứ mưa nhỏ, đều, rơi từ trưa và có vẻ sẽ rơi tới tận đêm.',

  c2:{n:'Chuyến tàu đêm xuyên Việt', bg:'brown', p:[
    'Đoàn tàu rời ga lúc tám giờ tối. Bạn nằm ở tầng dưới của một khoang giường nằm, rèm cửa sổ kéo một nửa.',
    'Bánh xe sắt lăn trên đường ray, đều đều một nhịp quen thuộc. Xình xịch. Xình xịch. Toa tàu đung đưa nhẹ như chiếc nôi.',
    'Ngoài cửa sổ, ánh đèn thành phố thưa dần. Những dãy nhà, những con đường, rồi cánh đồng tối mênh mông.',
    'Thỉnh thoảng một ngôi làng hiện ra, vài ngọn đèn vàng sau lũy tre, rồi lại chìm vào bóng tối.',
    'Trong khoang, ánh đèn ngủ màu cam nhạt. Chăn mỏng thơm mùi xà phòng. Gối hơi cứng nhưng vừa đủ.',
    'Bạn không phải lái tàu, không phải nhớ đường. Đoàn tàu biết đường đi. Bạn chỉ cần nằm đây.',
    'Tàu chạy qua một cây cầu, tiếng bánh xe đổi giọng, vang và trầm hơn. Bên dưới là dòng sông lấp lánh ánh trăng.',
    'Rồi lại nhịp cũ. Xình xịch. Xình xịch. Mỗi nhịp đưa bạn xa thêm khỏi những lo toan của ngày.',
    'Ở một ga nhỏ, tàu dừng vài phút. Tiếng người bán hàng rao khe khẽ, tiếng còi xa, rồi tàu lại lăn bánh.',
    'Hơi thở của bạn hòa vào nhịp tàu. Chậm. Đều. Sâu.',
    'Đêm còn dài, đường còn xa. Sáng mai khi bạn mở mắt, đoàn tàu sẽ đã đi qua biết bao nhiêu cây số.',
    'Còn bây giờ, chỉ cần nhắm mắt, và để đoàn tàu đưa bạn vào giấc ngủ.']},
  c3:{n:'Bến sông Hội An lúc khuya', bg:'stream', p:[
    'Đã gần nửa đêm. Phố cổ Hội An vãn khách. Những chiếc đèn lồng vẫn còn sáng, đỏ, vàng, tím, phản chiếu xuống mặt sông Hoài.',
    'Bạn ngồi trên bậc đá sát bến, chân đung đưa phía trên mặt nước. Đá còn giữ chút hơi ấm của ban ngày.',
    'Một chiếc thuyền nhỏ neo gần bờ, khẽ nghiêng theo sóng. Dây neo cọ vào cọc gỗ, kẽo kẹt rất nhẹ.',
    'Nước sông vỗ vào chân bậc đá, từng nhịp nhỏ. Không vội vàng. Như hơi thở của một người đang ngủ.',
    'Bên kia sông, một bà cụ đang dọn hàng, xếp từng chiếc ghế nhựa chồng lên nhau. Tiếng ghế chạm nhau khẽ khàng.',
    'Gió từ sông thổi lên, mát và có mùi nước, mùi rêu, mùi hương trầm từ một ngôi nhà cổ.',
    'Một chiếc đèn hoa đăng ai thả từ tối vẫn còn trôi, ngọn nến nhỏ chập chờn, chậm rãi đi về phía cửa biển.',
    'Bạn nhìn theo ánh nến cho tới khi nó chỉ còn là một chấm sáng mờ.',
    'Những ngọn đèn lồng lần lượt tắt. Phố cổ chìm vào màu vàng nhạt của đèn đường.',
    'Tiếng nước vẫn vỗ. Tiếng côn trùng từ bãi cỏ bên kia. Cả thị trấn đang ngủ.',
    'Bạn đứng dậy, đi chậm về căn phòng nhỏ có cửa sổ gỗ nhìn ra sông. Chiếc giường trắng mát đang đợi.',
    'Nằm xuống, bạn vẫn nghe tiếng nước. Nó sẽ ru bạn suốt đêm.']},
  c4:{n:'Khu vườn của bà', bg:'night', p:[
    'Đây là một buổi tối mùa hè ở quê. Bạn nằm trên chiếc chõng tre ngoài sân nhà bà, trên đầu là bầu trời đầy sao.',
    'Hơi nóng ban ngày đã lui. Gió đồng thổi qua hàng cau, lá cau xào xạc khe khẽ.',
    'Trong vườn, dế bắt đầu kêu. Con này gọi, con kia đáp. Tiếng ếch nhái từ ao bên cạnh hòa vào thành một bản nhạc chậm.',
    'Bà ngồi bên cạnh, tay phe phẩy chiếc quạt nan. Mỗi lần quạt, một làn gió mát mùi trầu cau lướt qua mặt bạn.',
    'Bà kể chuyện ngày xưa, giọng đều đều, chậm rãi. Bạn không cần nghe rõ từng chữ. Chỉ giọng nói ấy thôi cũng đủ thấy yên.',
    'Mùi hoa cau, mùi rơm khô, mùi khói bếp còn vương lại từ bữa tối.',
    'Bạn nhìn lên trời. Dải ngân hà mờ mờ vắt ngang. Một ngôi sao băng lướt qua rồi biến mất.',
    'Chõng tre mát lưng. Mỗi lần trở mình, tre kêu lách cách quen thuộc.',
    'Đom đóm bay lập lòe bên rặng chuối, những đốm sáng xanh nhỏ xíu bật lên rồi tắt.',
    'Tiếng quạt của bà chậm dần. Tiếng kể chuyện thưa dần. Chỉ còn tiếng dế, tiếng gió.',
    'Ở đây không có gì phải lo. Không có hạn chót, không có bảng giá. Chỉ có đêm hè và khu vườn.',
    'Mi mắt bạn khép lại. Tiếng dế vẫn kêu, như canh giữ giấc ngủ của bạn đến sáng.']},
  c5:{n:'Ngọn hải đăng trên đảo', bg:'ocean', p:[
    'Bạn đang ở trên một hòn đảo nhỏ ngoài khơi. Đêm nay bạn là người canh ngọn hải đăng.',
    'Căn phòng tròn trên đỉnh tháp ấm áp, tường trắng, có một chiếc giường nhỏ, một ngọn đèn bàn và ô cửa sổ nhìn ra biển.',
    'Phía trên, ngọn đèn lớn quay chậm, đều đặn. Mỗi vòng, một vệt sáng dài quét qua mặt biển đen rồi đi tiếp.',
    'Bạn đã kiểm tra mọi thứ. Đèn đang chạy tốt. Tàu thuyền ngoài kia sẽ nhìn thấy và tìm được đường. Công việc của bạn lúc này chỉ là nghỉ ngơi.',
    'Dưới chân tháp, sóng vỗ vào ghềnh đá. Ầm… rồi rút xa. Ầm… rồi rút xa. Không bao giờ vội.',
    'Bạn pha một cốc sữa ấm, ngồi bên cửa sổ. Ngoài xa có ánh đèn của một con tàu cá, nhỏ như một vì sao thấp.',
    'Gió biển mang theo mùi muối. Kính cửa sổ hơi mờ hơi nước. Bạn vẽ một đường nhỏ trên đó bằng ngón tay.',
    'Mỗi vòng quay của ngọn đèn như một nhịp thở. Sáng lên, tối đi. Hít vào, thở ra.',
    'Bạn nằm xuống chiếc giường nhỏ, kéo chăn tới cằm. Ánh đèn quét qua trần nhà rồi đi mất.',
    'Ngọn hải đăng vẫn canh giữ biển suốt đêm. Bạn không cần thức. Mọi thứ đã được lo liệu.',
    'Sóng vẫn vỗ. Đèn vẫn quay. Bạn chìm dần vào giấc ngủ sâu như lòng biển.']},
  c6:{n:'Thư viện cũ chiều đông', bg:'fire', p:[
    'Bên ngoài trời đã tối và lạnh. Bên trong thư viện cũ, lò sưởi đang cháy, củi nổ lách tách.',
    'Bạn ngồi trong một chiếc ghế bành bọc vải dày, chân gác lên ghế đẩu, đắp tấm chăn len màu nâu.',
    'Những giá sách gỗ cao tới trần, xếp đầy những cuốn sách bìa da đã ngả màu. Mùi giấy cũ, mùi gỗ, mùi khói củi.',
    'Ngọn đèn bàn chao xanh tỏa một vòng sáng vàng nhỏ. Ngoài vòng sáng ấy, căn phòng chìm trong bóng tối ấm áp.',
    'Trên đùi bạn là một cuốn sách đang mở. Bạn đọc vài dòng, rồi để mắt nghỉ trên ngọn lửa.',
    'Lửa nhảy múa, đỏ, cam, vàng. Một khúc củi sụp xuống, tóe lên mấy đốm lửa nhỏ rồi yên.',
    'Ở góc phòng, chiếc đồng hồ quả lắc đung đưa. Tích. Tắc. Tích. Tắc.',
    'Không ai đến làm phiền. Thủ thư đã về từ lâu, để lại cho bạn chìa khóa và lời dặn: cứ ở lại bao lâu tùy thích.',
    'Bạn gấp cuốn sách lại, đặt lên bàn bên cạnh. Ngả đầu vào lưng ghế.',
    'Hơi ấm từ lò sưởi phủ lên mặt, lên tay. Cơ thể nặng dần, mềm dần.',
    'Tiếng củi nổ, tiếng đồng hồ, hơi thở chậm của chính bạn. Tất cả hòa thành một bản nhạc ru.',
    'Cứ ngủ đi. Lửa sẽ cháy nhỏ dần, và căn phòng sẽ giữ hơi ấm cho bạn tới sáng.']}

    n.lat = Math.round(sg.on / 2); n.on = start + sg.on * 30000; n.off = start + (sg.off + 1) * 30000;
    n.st = {W:m('W'), L:m('L'), D:m('D'), R:m('R')}; n.tst = n.st.L + n.st.D + n.st.R; n.waso = Math.max(0, n.st.W - n.lat - Math.round((sg.st.length - 1 - sg.off) / 2));
    let wakes = 0; for(let i = sg.on + 1; i <= sg.off; i++) if(sg.st[i] === 'W' && sg.st[i - 1] !== 'W') wakes++;
    n.wakes = wakes; n.eff = Math.round(n.tst / Math.max(1, n.tib) * 100);
    n.hyp = ''; for(let i = 0; i < sg.st.length; i += 10){ const seg = sg.st.slice(i, i + 10), cc = {}; seg.forEach(x => { cc[x] = (cc[x] || 0) + 1; }); n.hyp += Object.keys(cc).sort((a, b) => cc[b] - cc[a])[0]; }
    n.ep = ep.join('');
  } else { n.tst = Math.max(0, n.tib - 15); n.lat = 15; n.eff = Math.round(n.tst / Math.max(1, n.tib) * 100); n.wakes = 0; n.waso = 0; }
  n.ev = evs.filter(x => x.type !== 'move').slice(-80).map(x => [Math.round((x.t - start) / 60000), x.type, x.dur, x.db]);
  const recent = S.sleep.filter(x => x.end > end - 8 * DAY);
  Object.assign(n, nightScore(n, recent));
  if(SL.opt.alarm) n.alarm = SL.opt.alarm;
  if(SL.ringT) n.rang = SL.ringT;
  S.sleep.push(n); S.sleep.sort((a, b) => a.end - b.end);
  if(S.wake && S.wake.on){ S.wake.log = S.wake.log || {}; S.wake.log[n.d] = hhmm(SL.ringT && SL.ringT < end ? SL.ringT : end); }

}

function wakePlan(){
  const w = S.wake; if(!w || !w.on) return null;
  const cur = tmin(w.cur), tg = tmin(w.target), step = w.step || 15, every = w.every || 3;
  /* lùi bước khi 2 ngày gần nhất dậy trễ: giữ nguyên mức hiện tại */
  const days = Math.max(0, diffDays(w.start, todayStr())), hold = w.hold || 0;
  const steps = Math.max(0, Math.floor(days / every) - hold);
  const today = Math.max(tg, cur - steps * step), sleepMin = Math.round((S.profile.sleepGoal || 7.5) * 60);
  const bed = today - sleepMin - 15, wind = bed - 45;
  const left = Math.ceil((today - tg) / step) * every;
  return {wake:today, bed, wind, target:tg, cur, step, every, done: today <= tg, daysLeft: today <= tg ? 0 : left};
}
function wakeStreak(){
  const w = S.wake; if(!w || !w.log) return 0;
  let n = 0, d = todayStr(); if(!w.log[d]) d = addDays(d, -1);
  while(w.log[d] && n < 1000){ const p = wakePlanFor(d); if(p != null && tmin(w.log[d]) > p + 10) break; n++; d = addDays(d, -1); }
  return n;
}
function wakePlanFor(d){ const w = S.wake; if(!w) return null; const cur = tmin(w.cur), tg = tmin(w.target), days = Math.max(0, diffDays(w.start, d)); return Math.max(tg, cur - Math.max(0, Math.floor(days / (w.every || 3)) - (w.hold || 0)) * (w.step || 15)); }
function cyclesFor(wakeMin){ return [6, 5, 4].map(c => ({c, bed:wakeMin - c * 90 - 15, h:c * 1.5})); }

function trendHtml(){

    '<section class="sec"><div class="sec-h"><h2>Số giờ ngủ</h2></div>' + barsHtml(hrs, days.map(d => viDate(d).split('/')[0]), v => num(v), 13) + '</section>';

    '<div class="stat3" style="margin-top:10px"><div><b>' + fmtHm(debt) + '</b><span>nợ ngủ 7 ngày</span></div><div><b>±' + Math.round(sd(bm)) + ' ph</b><span>độ lệch giờ ngủ</span></div><div><b>' + (last7.length ? Math.round(sum(last7, x => x.score || 0) / last7.length) : '–') + '</b><span>điểm trung bình</span></div></div></section>';

const LISTS = {work:'Công việc', personal:'Cá nhân', study:'Học tập', health:'Sức khỏe', home:'Nhà cửa'};
function addTodo(t, o){ const x = Object.assign({id:uid(), t:String(t).slice(0, 200), done:false, doneAt:0, due:todayStr(), star:false, list:'work', note:'', rep:null, created:Date.now(), u:Date.now()}, o || {}); S.todos.push(x); persist(); return x; }
function todoDueLabel(d){ if(!d) return ''; const t = todayStr(), k = diffDays(t, d); return k === 0 ? 'Hôm nay' : k === 1 ? 'Ngày mai' : k === -1 ? 'Hôm qua' : k < 0 ? 'Trễ ' + (-k) + ' ngày' : (k < 7 ? WD[parse(d).getDay()] : viDate(d)); }
function todosFor(f){
  const t = todayStr(), L = S.todos;
  if(f === 'today') return L.filter(x => (!x.done && ((x.due && x.due <= t) || x.star)) || (x.done && x.doneAt && ymd(new Date(x.doneAt)) === t));
  if(f === 'next') return L.filter(x => !x.done && x.due && x.due > t).sort((a, b) => a.due < b.due ? -1 : 1);
  if(f === 'all') return L.filter(x => !x.done);

}
function todoSort(a, b){ return (a.done - b.done) || (b.star - a.star) || ((a.due || '9') < (b.due || '9') ? -1 : (a.due || '9') > (b.due || '9') ? 1 : 0) || a.created - b.created; }

function readStats(){
  const t = todayStr(), wk = weekRange(t), byD = d => sum(S.readLog.filter(r => r.d === d), r => r.min) + sum(S.focusLog.filter(f => f.d === d && f.cat === 'read' && !S.readLog.some(r => r.fid === f.id)), f => f.min);
  let streak = 0, d = byD(t) ? t : addDays(t, -1); while(byD(d) > 0 && streak < 3000){ streak++; d = addDays(d, -1); }
  const days = []; for(let i = 6; i >= 0; i--) days.push(addDays(t, -i));
  return {today:byD(t), streak, week:sum(days.map(byD)), days, mins:days.map(byD), pagesWeek:sum(S.readLog.filter(r => r.d >= wk[0]), r => r.pages || 0), done:S.books.filter(b => b.done).length};
}
