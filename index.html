<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nhịp 21 – HLV cá nhân của bạn</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nhịp 21">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1430" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F6; --surface:#FFFFFF; --surface-2:#E2E7F0; --ink:#13204A; --ink-2:#56617F; --line:#D5DBE6;
  --cobalt:#2448D8; --on-cobalt:#FFFFFF; --cobalt-soft:#DDE4FB; --cobalt-deep:#1B37A8;
  --gold:#F2B135; --on-gold:#2B1F00; --gold-soft:#FBEFD2; --gold-deep:#7A5300;
  --pine:#23805E; --pine-soft:#D6EDE3; --warn:#B23E26; --warn-soft:#F8E1DA;
  --shadow:0 14px 30px -22px rgba(19,32,74,.55);
  --rest-bg:#FBEFD2; --rest-fill:rgba(242,177,53,.42);
  --font-d:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --font-b:"Be Vietnam Pro",-apple-system,"SF Pro Text","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1430; --surface:#162045; --surface-2:#1F2B57; --ink:#E9EDF7; --ink-2:#A5B0CE; --line:#2A3664;
    --cobalt:#7B93FF; --on-cobalt:#0D1430; --cobalt-soft:#22306A; --cobalt-deep:#BFCBFF;
    --gold:#F5C04F; --on-gold:#2A1E00; --gold-soft:#3A3115; --gold-deep:#F5D58C;
    --pine:#57C49A; --pine-soft:#173A33; --warn:#F08B70; --warn-soft:#3E2220;
    --shadow:0 14px 30px -20px rgba(0,0,0,.8); --rest-bg:#1C2754; --rest-fill:rgba(245,192,79,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1430; --surface:#162045; --surface-2:#1F2B57; --ink:#E9EDF7; --ink-2:#A5B0CE; --line:#2A3664;
  --cobalt:#7B93FF; --on-cobalt:#0D1430; --cobalt-soft:#22306A; --cobalt-deep:#BFCBFF;
  --gold:#F5C04F; --on-gold:#2A1E00; --gold-soft:#3A3115; --gold-deep:#F5D58C;
  --pine:#57C49A; --pine-soft:#173A33; --warn:#F08B70; --warn-soft:#3E2220;
  --shadow:0 14px 30px -20px rgba(0,0,0,.8); --rest-bg:#1C2754; --rest-fill:rgba(245,192,79,.2);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
img,svg{max-width:100%}
button{font:inherit;color:inherit;touch-action:manipulation}
.app{max-width:640px;margin:0 auto;padding:10px max(18px, env(safe-area-inset-left,0px)) calc(104px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-right,0px))}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 14px}
.brand{font-family:var(--font-d);font-weight:800;font-size:2rem;line-height:1;display:flex;align-items:baseline;gap:6px}
.brand b{color:var(--cobalt);font-weight:800}
.coach-btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px 7px 10px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:.9rem;cursor:pointer;min-height:42px}
.coach-btn svg{color:var(--cobalt)}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{appearance:none;border:0;background:none;color:var(--ink-2);font:500 .72rem/1.2 var(--font-b);padding:9px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative;text-decoration:none;min-height:56px}
.tab[aria-current="page"]{color:var(--cobalt);font-weight:600}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:24%;right:24%;height:3px;background:var(--cobalt);border-radius:0 0 3px 3px}
.tab .dot{position:absolute;top:7px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--surface)}

.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2{font-size:1.06rem;font-weight:600;line-height:1.3}
.aside{font-size:.85rem;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.big{font-family:var(--font-d);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.note{background:var(--surface);border-left:4px solid var(--cobalt);border-radius:4px 12px 12px 4px;padding:12px 14px;font-size:.94rem}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.gold{border-left-color:var(--gold)}
.stack{display:grid;gap:10px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn-col{display:grid;gap:10px;margin-top:20px;max-width:360px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:500 .9rem/1.3 var(--font-b);cursor:pointer;min-height:40px;text-align:left}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{appearance:none;border:0;border-radius:12px;font:600 1rem/1.2 var(--font-b);padding:12px 18px;min-height:48px;cursor:pointer;background:var(--surface-2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--cobalt);color:var(--on-cobalt)}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:var(--warn);color:#fff}
.btn.small{min-height:40px;padding:7px 13px;font-size:.9rem;border-radius:10px}
.btn.block{width:100%}
.linkish{appearance:none;border:0;background:none;padding:4px 0;color:var(--cobalt);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.linkish:focus-visible,.coach-btn:focus-visible,.icon-btn:focus-visible,summary:focus-visible,.pl-ctrl button:focus-visible,.pl-x:focus-visible,.x:focus-visible,.cell:focus-visible,.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.icon-btn{appearance:none;border:0;background:var(--surface-2);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}

.greet{display:flex;justify-content:space-between;gap:10px;font-weight:600;margin-bottom:12px;flex-wrap:wrap}
.greet .muted{font-weight:400}
.bib{position:relative;background:var(--surface);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.bib-band{background:var(--cobalt);color:var(--on-cobalt);padding:11px 44px;display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:.84rem;flex-wrap:wrap}
.bib-body{padding:16px 44px 14px;display:flex;align-items:flex-end;gap:18px}
.bib-num{font-family:var(--font-d);font-weight:800;font-size:clamp(4.6rem,24vw,7.6rem);line-height:.8;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.bib-side{padding-bottom:4px}
.bib-label{font-weight:600;line-height:1.3}
.bib-week{color:var(--ink-2);font-size:.88rem;margin-top:4px}
.pin{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--paper);box-shadow:inset 0 1px 2px rgba(0,0,0,.28);z-index:1}
.pin.tl{top:10px;left:15px}.pin.tr{top:10px;right:15px}.pin.bl{bottom:12px;left:15px}.pin.br{bottom:12px;right:15px}
.lanes{display:grid;gap:8px;padding:0 44px 18px}
.lane{font-size:.76rem;color:var(--ink-2)}
.lane i{display:block;height:7px;border-radius:4px;background:var(--surface-2);margin-bottom:5px}
.lane.done i{background:var(--pine)}
.lane.done{color:var(--ink)}
@media (max-width:380px){.bib-band,.bib-body,.lanes{padding-left:34px;padding-right:34px}.pin.tl,.pin.bl{left:11px}.pin.tr,.pin.br{right:11px}}

.run{background:var(--surface);border-radius:14px;padding:15px 16px}
.run.is-done{opacity:.75}
.run-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.run h3{font-size:1.02rem;font-weight:600;margin-top:8px}
.run p{margin-top:5px}
.run-km{font-size:1.9rem}
.run-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.tag{display:inline-block;font:600 .75rem/1.3 var(--font-b);padding:3px 9px;border-radius:6px;background:var(--cobalt-soft);color:var(--cobalt-deep)}
.tag.t-long{background:var(--gold-soft);color:var(--gold-deep)}
.tag.t-quality{background:var(--surface-2);color:var(--ink)}
.tag.t-str{background:var(--gold-soft);color:var(--gold-deep)}
.tag.t-burn{background:var(--pine-soft);color:var(--pine)}
.tag.t-rec{background:var(--surface-2);color:var(--ink-2)}
.tag.t-test{background:var(--warn-soft);color:var(--warn)}
.ok{display:inline-flex;align-items:center;gap:6px;color:var(--pine);font-weight:600;font-size:.92rem;flex:none}

.pick-row{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:start;margin-top:10px}
.pick-k{font-size:.88rem;color:var(--ink-2);padding-top:9px}
@media (max-width:430px){.pick-row{grid-template-columns:1fr;gap:6px}.pick-k{padding-top:0}}
.pick-row .chips.scroll{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;margin-right:-18px;padding-right:18px}
.pick-row .chips.scroll::-webkit-scrollbar{display:none}
.pick-row .chips.scroll .chip{flex:none;white-space:nowrap}
@media (min-width:820px){.pick-row .chips.scroll{flex-wrap:wrap;overflow:visible;margin-right:0;padding-right:0}}
.preview{margin-top:16px;background:var(--surface);border-radius:14px;padding:16px;border-top:5px solid var(--cobalt)}
.pv-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.pv-head h3{font-size:1.08rem;font-weight:600}
.pv-time{font-size:2.6rem;text-align:right}
.pv-time span{display:block;font-family:var(--font-b);font-size:.75rem;font-weight:500;color:var(--ink-2)}
.fmt-line{margin-top:10px;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.preview .ex-list{margin:10px 0 14px;font-size:.92rem}
.pv-act{display:grid;grid-template-columns:1fr auto;gap:8px}

.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:440px){.meters{grid-template-columns:repeat(2,1fr)}}
.meter .v{font-family:var(--font-d);font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.meter .v small{font-size:1.1rem;color:var(--ink-2);font-weight:600}
.bar{height:6px;background:var(--surface-2);border-radius:3px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cobalt);border-radius:3px}
.meter.full .bar i{background:var(--pine)}
.meter .k{font-size:.8rem;color:var(--ink-2);margin-top:5px;line-height:1.3}

/* plan */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;max-width:520px}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:9px;padding:9px 6px;font:600 .9rem var(--font-b);color:var(--ink-2);cursor:pointer;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 10px}
.wnav h2{font-size:1.06rem;font-weight:600;text-align:center;flex:1;line-height:1.3}
.days{display:grid;gap:8px}
.day{background:var(--surface);border-radius:14px;padding:12px 14px 8px;display:grid;grid-template-columns:44px 1fr;gap:12px;border:2px solid transparent}
.day.today{border-color:var(--cobalt)}
.day-d{font-family:var(--font-d);line-height:1;padding-top:2px}
.day-d span{display:block;font-size:.95rem;color:var(--ink-2);font-weight:600}
.day-d b{display:block;font-size:1.9rem;font-weight:700;margin-top:2px}
.day.past .day-d{opacity:.6}
.slot{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0;padding-top:2px}
.slot .sl-t{flex:1;min-width:0}
.slot h3{font-size:.95rem;font-weight:600;line-height:1.3}
.slot p{font-size:.82rem;color:var(--ink-2);line-height:1.35}
.slot.done h3{color:var(--ink-2)}
.slot .btn{flex:none}
.list.pad{padding:6px 14px}
.kd{width:10px;height:10px;border-radius:3px;flex:none;background:var(--ink-2);display:inline-block}
.kd.c-run{background:var(--cobalt)}.kd.c-str{background:var(--gold)}.kd.c-burn{background:var(--pine)}.kd.c-rec{background:var(--ink-2);opacity:.45}.kd.c-test{background:var(--warn)}.kd.c-rest{background:transparent;border:1.5px solid var(--line)}
.day-x{display:flex;justify-content:flex-end}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.8rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:.74rem;color:var(--ink-2);text-align:center;padding:2px 0 4px}
.cell{appearance:none;background:var(--surface);border-radius:10px;min-height:68px;padding:6px 5px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--ink);font:inherit;border:2px solid transparent;overflow:hidden}
.cell.out{opacity:.35}
.cell.today{border-color:var(--cobalt)}
.cell .dn{font-family:var(--font-d);font-weight:700;font-size:1.1rem;line-height:1}
.cell.done .dn{color:var(--pine)}
.cell.miss{background:color-mix(in srgb, var(--surface) 80%, var(--warn) 6%)}
.cell .km{font-size:.7rem;font-weight:600;color:var(--cobalt-deep);background:var(--cobalt-soft);border-radius:4px;padding:1px 4px;align-self:flex-start;white-space:nowrap;line-height:1.3}
.cell .km.dn{background:var(--pine-soft);color:var(--pine)}
.mk-row{display:flex;gap:3px;flex-wrap:wrap}
.mk-row .kd{width:8px;height:8px;border-radius:50%}
.mk-row .kd.dn{box-shadow:0 0 0 2px var(--pine)}
@media (max-width:380px){.cell{min-height:60px;padding:5px 3px}.cell .km{font-size:.64rem;padding:1px 2px}}

.desk-clock{background:var(--surface);border-radius:16px;padding:20px 18px 18px;text-align:center}
.desk-clock .t{font-family:var(--font-d);font-weight:800;font-size:clamp(4.4rem,22vw,6.6rem);line-height:.9;font-variant-numeric:tabular-nums}
.desk-clock.due{background:var(--gold);color:var(--on-gold)}
.desk-clock .s{margin-top:8px;font-weight:500}
.desk-clock .btn-row{justify-content:center;margin-top:14px}
.due-btn{background:var(--on-gold);color:var(--gold)}
.due-ghost{border-color:rgba(43,31,0,.35)!important;color:var(--on-gold)}
.dots{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--cobalt)}
.dots i.on{background:var(--cobalt)}
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.item{padding:14px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
.item:first-child{border-top:0}
.item h3{font-size:.98rem;font-weight:600}
.item p{font-size:.86rem;color:var(--ink-2);margin-top:2px}
.item .btn{flex:none}
.item.lib{display:block}
.item.lib .btn-row{margin-top:10px}
.lib-meta{color:var(--cobalt-deep)!important;font-weight:500}

.run-h1{font-size:3.6rem;margin:4px 0 6px}
.run-h1 span{color:var(--ink-2);font-size:2rem}
.zones{margin:0;background:var(--surface);border-radius:14px;overflow:hidden}
.zones div{display:flex;justify-content:space-between;gap:14px;padding:12px 16px;border-top:1px solid var(--line)}
.zones div:first-child{border-top:0}
.zones dt{font-weight:600;font-size:.94rem}
.zones dd{margin:0;text-align:right;font-size:.9rem;color:var(--ink-2)}
.zones dd b{font-family:var(--font-d);font-size:1.3rem;color:var(--ink);font-weight:700}
.inline-form{display:flex;gap:8px;margin:10px 0 14px}
.inline-form input{flex:1;min-width:0}
.inline-form input#fiveIn{max-width:160px;flex:none}
details.plan{background:var(--surface);border-radius:14px}
details.plan summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
details.plan summary::-webkit-details-marker{display:none}
details.plan summary h2{font-size:1.02rem;font-weight:600}
details.plan summary h2::after{content:" +";color:var(--ink-2)}
details.plan[open] summary h2::after{content:" −"}
.bk{padding:0 16px 16px}
.bk textarea{font-size:.8rem;margin-top:10px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 6px 10px}
.card-tbl{background:var(--surface);border-radius:14px;padding:6px}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:470px}
.card-tbl table{min-width:0}
th,td{padding:8px 10px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
.card-tbl td:first-child{white-space:normal}
thead th{border-top:0;color:var(--ink-2);font-weight:500;font-size:.8rem}
tbody th{font-family:var(--font-d);font-size:1.1rem}
tr.cur{background:var(--cobalt-soft)}
tr.past{color:var(--ink-2)}
td.done-m{letter-spacing:2px;color:var(--pine)}
td.up{color:var(--pine);font-weight:600}
.tips{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.tips li{background:var(--surface);border-radius:12px;padding:12px 14px;font-size:.92rem}
.tips li b{display:block;font-weight:600;margin-bottom:2px}

.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week7 .d{background:var(--surface);border-radius:10px;padding:8px 2px 10px;text-align:center;border:2px solid transparent}
.week7 .d.today{border-color:var(--cobalt)}
.week7 .dn{display:block;font-size:.78rem;color:var(--ink-2)}
.week7 .mk{display:block;width:18px;height:18px;margin:6px auto 4px;border-radius:50%;background:var(--surface-2)}
.week7 .d.on .mk{background:var(--pine)}
.week7 .dm{display:block;font-family:var(--font-d);font-size:1.05rem;font-weight:600;min-height:1.2em}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
@media (max-width:440px){.nums{grid-template-columns:repeat(2,1fr)}}
.nums .v{font-family:var(--font-d);font-size:2.1rem;font-weight:700;line-height:1}
.nums .v small{font-size:1.1rem}
.nums .k{font-size:.8rem;color:var(--ink-2);margin-top:3px}
.chart{background:var(--surface);border-radius:14px;padding:12px 10px 6px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--ink-2);font-family:var(--font-b);font-size:11px}

<script>
'use strict';
const OFFLINE = true;
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const r05 = x => Math.round(x * 2) / 2;
const num = x => Number(x).toLocaleString('vi-VN', {maximumFractionDigits: 1});
const sleep = ms => new Promise(r => setTimeout(r, ms));
const DAY = 86400000;
const WD = ['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const MI_SHORT = ['T2','T3','T4','T5','T6','T7','CN'];
const MI_LONG = ['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ nhật'];
const MONTHS = ['tháng 1','tháng 2','tháng 3','tháng 4','tháng 5','tháng 6','tháng 7','tháng 8','tháng 9','tháng 10','tháng 11','tháng 12'];
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function parse(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function todayStr(){ return ymd(new Date()); }
function addDays(s, n){ const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); }
function diffDays(a, b){ return Math.round((parse(b) - parse(a)) / DAY); }
function mondayOf(s){ const d = parse(s); d.setDate(d.getDate() - ((d.getDay()+6) % 7)); return ymd(d); }
function miOf(s){ return (parse(s).getDay() + 6) % 7; }
function viDate(s){ const d = parse(s); return d.getDate() + '/' + (d.getMonth()+1); }
function fullDate(s){ const d = parse(s); return WD[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear(); }
function shortYear(s){ const d = parse(s); return d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear(); }
function dayOfYear(){ const d = new Date(); return Math.floor((d - new Date(d.getFullYear(),0,0)) / DAY); }
function fmtPace(sec){ sec = Math.round(sec); return Math.floor(sec/60) + ':' + pad(sec%60); }
function fmtHM(sec){ const m = Math.round(sec/60); return Math.floor(m/60) + ' giờ ' + pad(m%60) + ' phút'; }
function fmtClock(s){ s = Math.max(0, s); return s >= 60 ? Math.floor(s/60) + ':' + pad(s%60) : String(s); }
function parseTime(str){ const m = String(str||'').trim().match(/^(\d{1,2})[:.,](\d{2})$/); if(!m) return null; const s = (+m[1])*60 + (+m[2]); return (s >= 900 && s <= 3600) ? s : null; }
function parseNum(str){ const v = parseFloat(String(str||'').replace(',', '.')); return isFinite(v) && v > 0 ? v : null; }
function monthKey(d){ return 'log-' + d.slice(0, 7); }
function norm(s){ return ' ' + String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim() + ' '; }
function hash(s){ let x = 2166136261; for(let i = 0; i < s.length; i++){ x ^= s.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0; } return ('0000000' + x.toString(16)).slice(-8); }

function paces(fiveK){
  const p = fiveK / 5, hmT = fiveK * Math.pow(21.0975/5, 1.06);
  return {easy:[p*1.22, p*1.32], tempo:p*1.07, inter:p*0.98, hm:hmT/21.0975, hmTotal:hmT};
}
function paceText(pc, k){ return k === 'easy' ? fmtPace(pc.easy[0]) + '–' + fmtPace(pc.easy[1]) + ' /km' : fmtPace(pc[k]) + ' /km'; }

function buildPlan(p){

    else if(i === N - 1){ long = Math.max(6, r05(peak * 0.6)); phase = 'taper'; }
    else {
      let x = B > 1 ? start + (peak - start) * (i-1) / (B-1) : start;
      if(i % 4 === 0 && i < B - 1){ x *= 0.75; cut = true; }
      long = r05(x);
      const f = i / B;
      phase = f <= 0.35 ? 'base' : f <= 0.7 ? 'build' : 'peak';
    }
    weeks.push({n:i, phase, cut, long, runs:weekRuns(i, phase, long, p, cut)});

let _sch = {};
function weekSchedule(m){
  const p = S.profile, ck = m + '|' + JSON.stringify(p.runDays) + p.longDay + '|' + JSON.stringify(S.swaps[m] || null);
  if(_sch[ck]) return _sch[ck];
  const wk = planWeekFor(m), L = p.longDay, R = p.runDays.slice().sort((a,b) => a - b);
  const items = Array.from({length:7}, () => []);
  const byType = {}; wk.runs.forEach(r => { byType[r.type] = r; });
  const runDay = {};
  if(byType.long) runDay[L] = byType.long;
  if(byType.easy) runDay[R[0]] = byType.easy;
  if(byType.quality) runDay[R[1]] = byType.quality;
  Object.keys(runDay).forEach(d => items[d].push({kind:'run', key:runDay[d].key, run:runDay[d]}));
  const used = new Set(Object.keys(runDay).map(Number));
  let rec = (L + 1) % 7;
  if(used.has(rec)) rec = [0,1,2,3,4,5,6].find(d => !used.has(d) && d !== L - 1) ?? [0,1,2,3,4,5,6].find(d => !used.has(d));

  const strMin = light ? 15 : (ph === 'peak' ? 20 : 25);
  const firstWeek = parse(m).getDate() <= 7;
  const slots = [
    {slot:'strA', focus: odd ? 'san-chac' : 'than-tren', min: strMin},
    {slot:'strB', focus: light ? 'phuc-hoi' : (odd ? 'chan-chay' : 'mong-dui'), min: light ? 15 : strMin},
    firstWeek && !light ? {slot:'test', test:true, min:15} : {slot:'burn', focus: light ? 'bung' : (odd ? 'dot-mo' : 'bung'), min: light ? 10 : 15}
  ];
  let order = free.slice();
  const assign = {};
  slots.forEach((s, k) => { if(order[k] !== undefined) assign[order[k]] = s; });
  const before = (L + 6) % 7;
  if(assign[before] && assign[before].slot === 'strB'){
    const other = Object.keys(assign).find(d => +d !== before && assign[d].slot !== 'strB');
    if(other !== undefined){ const t = assign[other]; assign[other] = assign[before]; assign[before] = t; }
  }
  Object.keys(assign).forEach(d => {
    const s = assign[d];
    if(s.test) items[d].push({kind:'test', key:m + ':test', title:'Kiểm tra thể lực tháng', min:15});
    else items[d].push({kind:'workout', key:m + ':' + s.slot, focus:s.focus, min:s.min, title:FOCUS[s.focus].n + ' ' + s.min + ' phút'});
  });
  free.slice(slots.length).forEach(d => items[d].push({kind:'rest', key:null, title:'Nghỉ hẳn', min:0}));
  items[rec].push({kind:'workout', key:m + ':rec', focus:'phuc-hoi', min:15, title:'Giãn cơ 15 phút', rec:true});
  if(byType.easy && !light && ph !== 'prep') items[R[0]].push({kind:'workout', key:m + ':core', focus:'bung', min:10, title:'Bụng và eo 10 phút', addon:true});
  let perm = S.swaps[m];
  const days = [0,1,2,3,4,5,6].map(i => ({d:addDays(m, i), mi:i, items: items[perm ? perm[i] : i]}));
  const res = {m, wk, days, swapped: !!perm};
  _sch[ck] = res;
  return res;
}
function itemCat(it){ if(it.kind === 'run') return 'run'; if(it.kind === 'test') return 'test'; if(it.kind === 'rest') return 'rest'; return FOCUS[it.focus] ? FOCUS[it.focus].cat : 'str'; }
function isDone(it){
  if(it.kind === 'rest') return true;

function findItem(key){

function normalize(s){

async function flush(){

    const uid = user ? await user.id() : null;
    if(!db || !uid){ sync.booting = false; renderAll(); return; }
    sync.db = db; sync.uid = uid; sync.status = 'connecting';
    sync.unsub = db.collection('data/users/' + uid).onSnapshot(onSnap, () => { goLocal(); sync.booting = false; renderAll(); });
  }catch(e){ goLocal(); sync.booting = false; renderAll(); }
}

/* ================= backup + transfer between devices ================= */
const Backup = {
  code(){ const b = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); return 'NHIP21-SAOLUU v1 h=' + hash(b) + '\n' + b.match(/.{1,76}/g).join('\n'); },
  parse(t){
    const m = /NHIP21-SAOLUU v1 h=([0-9a-f]{8})([\s\S]*)/.exec(t || '');
    if(!m) throw new Error('Không thấy mã sao lưu. Mã phải bắt đầu bằng NHIP21-SAOLUU.');
    const b = m[2].replace(/[^A-Za-z0-9+\/=]/g, '');
    if(hash(b) !== m[1]) throw new Error('Mã bị thiếu hoặc sai khi chép. Hãy chép lại toàn bộ mã.');
    return JSON.parse(decodeURIComponent(escape(atob(b))));
  },
  merge(raw){
    const o = normalize(raw), newer = (o.updatedAt || 0) > (S.updatedAt || 0);
    let nL = 0, nB = 0, nT = 0;
    if(o.profile && (!S.profile || newer)) S.profile = o.profile;
    const ids = new Set(S.logs.map(l => l.id));
    o.logs.forEach(l => { if(!ids.has(l.id)){ S.logs.push(l); ids.add(l.id); nL++; } });
    S.logs.sort((a,b) => (a.t||0) - (b.t||0));
    o.body.forEach(b => { const ex = S.body.find(x => x.d === b.d); if(!ex){ S.body.push(b); nB++; } else if(newer) Object.assign(ex, b); });
    S.body.sort((a,b) => a.d < b.d ? -1 : 1);
    o.tests.forEach(t => { if(!S.tests.some(x => x.d === t.d)){ S.tests.push(t); nT++; } });
    S.tests.sort((a,b) => a.d < b.d ? -1 : 1);
    Object.keys(o.swaps).forEach(k => { if(!S.swaps[k] || newer) S.swaps[k] = o.swaps[k]; });
    o.moods.forEach(m => { const ex = S.moods.find(x => x.d === m.d); if(!ex) S.moods.push(m); else if((m.t||0) > (ex.t||0)) Object.assign(ex, m); });
    ['journal','mindLog','focusLog'].forEach(k => { const ids = new Set(S[k].map(x => x.id)); o[k].forEach(x => { if(!ids.has(x.id)) S[k].push(x); }); });
    if(o.top3 && (!S.top3 || o.top3.d > S.top3.d || (o.top3.d === S.top3.d && newer))) S.top3 = o.top3;
    if(o.parked && (!S.parked || o.parked.d > S.parked.d || (o.parked.d === S.parked.d && newer))) S.parked = o.parked;
    S = normalize(S); persistAll();
    return 'Đã nhập: ' + nL + ' buổi tập, ' + nB + ' số đo, ' + nT + ' lần kiểm tra mới. Dữ liệu ở máy này vẫn được giữ.';
  }
};

function addLog(e){

  e.d = e.d || todayStr(); e.t = e.t || Date.now();
  S.logs.push(e); S.logs.sort((a,b) => a.t - b.t);
  persist([monthKey(e.d)]);
}
function weekRange(d){ const m = mondayOf(d || todayStr()); return [m, addDays(m, 6)]; }
function inR(l, r){ return l.d >= r[0] && l.d <= r[1]; }
function activeDays(r){ return new Set(S.logs.filter(l => inR(l, r)).map(l => l.d)).size; }
function strengthCount(r){ return S.logs.filter(l => inR(l, r) && l.kind === 'workout' && STRENGTH.includes(l.focus) && (l.min||0) >= 8).length; }
function kmIn(r){ return S.logs.filter(l => inR(l, r) && l.kind === 'run').reduce((s, l) => s + (+l.km || 0), 0); }
function minIn(r){ return S.logs.filter(l => inR(l, r)).reduce((s, l) => s + (+l.min || 0), 0); }
function snacksToday(){ const t = todayStr(); return S.logs.filter(l => l.d === t && l.kind === 'snack').length; }
function doneKeys(){ return new Set(S.logs.filter(l => l.planKey).map(l => l.planKey)); }
function weekStreak(){
  const goal = S.profile.activeGoal; let n = 0, m = mondayOf(todayStr());
  if(activeDays(weekRange(m)) >= goal) n++;
  m = addDays(m, -7);
  while(n < 600 && activeDays(weekRange(m)) >= goal){ n++; m = addDays(m, -7); }
  return n;
}
function autoSlot(focus){
  const sc = weekSchedule(mondayOf(todayStr()));
  for(const d of sc.days) for(const it of d.items) if(it.kind === 'workout' && it.focus === focus && !isDone(it)) return it.key;
  return null;
}

/* ================= session builders ================= */
const CFG = {tired:{w:30,r:25}, ok:{w:40,r:20}, strong:{w:45,r:15}};
function variant(id, energy){ return (energy === 'tired' && EX[id].easy) ? EX[id].easy : id; }
function pickFormat(focus, fmt){
  const fms = FOCUS[focus].fm;
  if(fmt && fmt !== 'auto' && fms.includes(fmt)) return fmt;
  return fms[dayOfYear() % fms.length];
}
function pack(title, focus, items, fmt){
  const sec = items.reduce((s, it) => s + it.sec, 0), names = [];
  items.forEach(it => { if(it.type === 'work' && it.stage === 'main' && it.id && !names.includes(EX[it.id].n)) names.push(EX[it.id].n); });
  return {title, focus, items, sec, names, fmt};
}
function buildWorkout(focus, min, energy, opt){
  opt = opt || {};
  const v = opt.variant || 0, items = [];
  const W = (id, sec, stage, side, extra) => items.push(Object.assign({type:'work', id, sec, stage, side: side || ''}, extra || {}));
  const Rr = (sec, label) => items.push({type:'rest', sec, label});
  const office = focus === 'van-phong';
  if(min <= 2){
    const pool = MINIS[office ? 'office' : 'home'], seq = pool[(dayOfYear() + v) % pool.length];
    seq.forEach(([id, s], k) => { W(variant(id, energy), s, 'main'); if(k < seq.length - 1) Rr(10, 'Nghỉ'); });
    return pack('2 phút giữ nhịp', office ? 'van-phong' : 'mini', items, 'circuit');
  }
  const F = FOCUS[focus], circ0 = F.circuits[(dayOfYear() + v) % F.circuits.length];
  const fmt = pickFormat(focus, opt.format);
  if(fmt === 'flow'){
    const total = min * 60; let t = 0, k = 0;
    while(k < 60){
      const id = circ0[k % circ0.length], block = EX[id].side ? 100 : 50;
      if(t + block > total) break;
      if(EX[id].side){ W(id, 45, 'main', 'bên trái'); Rr(5, 'Đổi bên'); W(id, 45, 'main', 'bên phải'); } else W(id, 45, 'main');
      Rr(5, 'Chuyển tư thế'); t += block; k++;
    }
    if(items.length && items[items.length-1].type === 'rest') items.pop();
    return pack('Giãn cơ ' + min + ' phút', focus, items, fmt);
  }
  const c = CFG[energy] || CFG.ok, circ = circ0.map(id => variant(id, energy));
  const warm = min >= 10 ? WARMUPS[(dayOfYear() + v) % WARMUPS.length] : [];
  warm.forEach(id => W(id, 30, 'warm'));
  const coolSec = min >= 20 ? 125 : (min >= 10 ? 65 : 0);
  const avail = min * 60 - warm.length * 30 - coolSec;
  const sideOf = sec => Math.max(20, Math.round(sec * 0.6 / 5) * 5);
  const blockOf = (id, sec) => EX[id].side ? sideOf(sec) * 2 + 5 : sec;
  const addEx = (id, sec, extra) => {
    if(EX[id].side){ const s = sideOf(sec); W(id, s, 'main', 'bên trái', extra); Rr(5, 'Đổi bên'); W(id, s, 'main', 'bên phải', extra); }
    else W(id, sec, 'main', '', extra);
  };
  const pairs = []; for(let k = 0; k + 1 < circ.length; k += 2) pairs.push([circ[k], circ[k+1]]);
  if(circ.length % 2) pairs.push([circ[circ.length-1], circ[0]]);
  let t = 0;
  if(fmt === 'circuit'){
    const n = circ.length; let k = 0;
    while(k < 300){
      const id = circ[k % n], b = blockOf(id, c.w);
      if(t + b > avail) break;
      addEx(id, c.w); t += b;
      const end = (k % n) === n - 1, rs = c.r + (end ? 20 : 0);
      if(t + rs + 20 > avail) break;
      Rr(rs, end ? 'Nghỉ hết vòng' : 'Nghỉ'); t += rs; k++;
    }
  } else if(fmt === 'superset'){
    const rest = energy === 'tired' ? 50 : energy === 'strong' ? 30 : 40; let stop = false;
    for(let pi = 0; pi < 40 && !stop; pi++){
      const [a, b] = pairs[pi % pairs.length];
      for(let round = 1; round <= 3; round++){
        const work = blockOf(a, 40) + 10 + blockOf(b, 40);
        if(t + work > avail){ stop = true; break; }
        addEx(a, 40, {set:round}); Rr(10, 'Sang bài thứ hai'); addEx(b, 40, {set:round}); t += work;
        if(t + rest + 30 > avail){ stop = true; break; }
        Rr(rest, round < 3 ? 'Nghỉ giữa hiệp' : 'Nghỉ, đổi cặp bài'); t += rest;
      }
    }
  } else if(fmt === 'emom'){
    const mins = Math.max(1, Math.floor(avail / 60)), sc = energy === 'tired' ? 0.7 : energy === 'strong' ? 1.25 : 1;
    for(let k = 0; k < mins; k++){
      const id = circ[k % circ.length], r = EX[id].r ? Math.max(3, Math.round(EX[id].r * sc)) : 0;
      W(id, 60, 'main', '', {fmt:'emom', reps:r, minute:k+1, mins});
    }
  } else if(fmt === 'tabata'){
    const nb = Math.max(1, Math.floor((avail + 60) / 290));
    for(let b = 0; b < nb; b++){
      const [x, y] = pairs[b % pairs.length];
      for(let k = 0; k < 8; k++){ const id = k % 2 ? y : x; W(id, 20, 'main', EX[id].side ? 'đổi bên mỗi lần' : '', {fmt:'tabata', round:k+1}); if(k < 7) Rr(10, 'Nghỉ'); }
      if(b < nb - 1) Rr(60, 'Nghỉ giữa hai khối');
    }
  } else if(fmt === 'steady'){
    const w = energy === 'tired' ? 75 : 90, r = energy === 'tired' ? 20 : 15; let k = 0;
    while(t + w <= avail){ W(circ[k % circ.length], w, 'main'); t += w; k++; if(t + r + 30 > avail) break; Rr(r, 'Thở đều, đổi bài'); t += r; }
  }
  if(coolSec){
    Rr(5, 'Chuyển sang giãn cơ');
    (coolSec >= 120 ? ['hip_flexor','calf_stretch'] : ['hip_flexor']).forEach(id => { W(id, 30, 'cool', 'bên trái'); W(id, 30, 'cool', 'bên phải'); });
  }
  return pack(F.n + ' ' + min + ' phút', focus, items, fmt);
}
function snackDesc(sn, b){ return sn.seq.length === 1 ? EX[sn.seq[0][0]].c : b.names.join(', ') + '.'; }
function buildSnack(sn){
  const items = [];

    if(EX[id].side){ items.push({type:'work', id, sec:s, stage:'main', side:'bên trái'}); items.push({type:'work', id, sec:s, stage:'main', side:'bên phải'}); }
    else items.push({type:'work', id, sec:s, stage:'main', side:''});
    if(k < sn.seq.length - 1) items.push({type:'rest', sec:8, label:'Chuẩn bị bài tiếp'});
  });
  return pack(sn.n, 'snack', items, 'circuit');
}

    const x = 10 + i*(bw + gap), bh = Math.round((H - 44) * km / max), y = H - 22 - bh;
    bars += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + Math.max(bh, 2) + '" rx="3" fill="' + (i === 7 ? 'var(--cobalt)' : 'var(--cobalt-soft)') + '"/>';

  });

}
function waistChart(){
  const pts = S.body.filter(b => b.waist); if(pts.length < 2) return '';
  const W = 340, H = 130, vals = pts.map(p => p.waist), mn = Math.min(...vals) - 1, mx = Math.max(...vals) + 1;
  const xs = i => 18 + i * (W - 36) / (pts.length - 1), ys = v => 14 + (H - 40) * (mx - v) / (mx - mn);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(p.waist).toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  let dots = pts.map((p, i) => '<circle cx="' + xs(i).toFixed(1) + '" cy="' + ys(p.waist).toFixed(1) + '" r="3.5" fill="var(--gold)" stroke="var(--surface)" stroke-width="1.5"/>').join('');
  dots += '<text x="' + xs(0) + '" y="' + (H - 6) + '" text-anchor="start">' + viDate(pts[0].d) + '</text><text x="' + xs(pts.length-1) + '" y="' + (H - 6) + '" text-anchor="end">' + viDate(last.d) + '</text><text class="val" x="' + xs(pts.length-1) + '" y="' + (ys(last.waist) - 9) + '" text-anchor="end">' + num(last.waist) + ' cm</text>';

    if(it.type === 'work') say(itemName(it) + (it.reps ? ', ' + it.reps + ' lần' : '') + (it.side && it.side.indexOf('bên ') === 0 ? ', ' + it.side : ''));

function paintInterval(){
  const it = PL.list[PL.i], pl = $('#player');
  pl.dataset.phase = it.type === 'work' ? 'work' : it.type === 'rest' ? 'rest' : 'prep';
  const mains = PL.list.filter(x => x.type === 'work' && x.stage === 'main');
  let kind = '', name = '', side = '', cue = '', next = '';
  if(it.type === 'work'){
    if(it.stage === 'warm') kind = 'Khởi động';
    else if(it.stage === 'cool') kind = 'Giãn cơ thả lỏng';
    else if(it.fmt === 'emom') kind = 'EMOM, phút ' + it.minute + ' trên ' + it.mins;
    else if(it.fmt === 'tabata') kind = 'Tabata, lần ' + it.round + ' trên 8';
    else if(it.set) kind = 'Siêu set, hiệp ' + it.set + ' trên 3';
    else { const idx = PL.list.slice(0, PL.i + 1).filter(x => x.type === 'work' && x.stage === 'main').length; kind = 'Bài ' + idx + ' trên ' + mains.length; }
    name = itemName(it); side = it.reps ? it.reps + ' lần' + (EX[it.id].side ? ' mỗi bên' : '') : it.side; cue = itemCue(it);
    const nx = nextWork(PL.i); next = nx ? 'Sau đó: ' + itemName(nx) + (nx.side && nx.side.indexOf('bên ') === 0 ? ' (' + nx.side + ')' : '') : 'Bài cuối cùng!';
  } else {
    const nx = nextWork(PL.i);
    kind = it.type === 'prep' ? 'Chuẩn bị, bài đầu là' : (it.label || 'Nghỉ') + ', tiếp theo là';
    name = nx ? itemName(nx) : 'Sắp xong';
    side = nx ? (nx.reps ? nx.reps + ' lần' : nx.side) : '';
    cue = nx ? itemCue(nx) : '';
    next = it.type === 'rest' ? 'Thở sâu, uống ngụm nước nếu cần.' : '';
  }
  $('#plKind').textContent = kind;
  $('#plName').innerHTML = esc(name) + (side ? '<span class="pl-side">' + esc(side) + '</span>' : '');
  $('#plCue').textContent = cue; $('#plNext').textContent = next;
  const segs = $('#plSeg').children;
  for(let k = 0; k < segs.length; k++) segs[k].className = k < PL.i ? 'done' : k === PL.i ? 'now' : '';
  plPaintTime();
}
function plPaintTime(){
  const it = PL.list[PL.i], rem = PL.paused ? PL.remain/1000 : (PL.endAt - Date.now())/1000, s = Math.max(0, Math.ceil(rem));
  const te = $('#plTime'); if(te) te.innerHTML = fmtClock(s) + (s < 60 ? '<small>giây</small>' : '');
  const f = $('#plFill'); if(f) f.style.height = (clamp(1 - rem/it.sec, 0, 1) * 100) + '%';
  let left = Math.max(0, rem); for(let k = PL.i + 1; k < PL.list.length; k++) left += PL.list[k].sec;
  const l = $('#plLeft'); if(l){ const L = Math.ceil(left); l.textContent = 'còn ' + Math.floor(L/60) + ':' + pad(L%60); }
}
function plTick(){
  const now = Date.now();
  if(!PL.paused && !PL.finished) PL.elapsed += now - PL.lastTs;
  PL.lastTs = now;
  if(PL.paused || PL.finished || PL.confirming) return;
  const rem = (PL.endAt - now) / 1000, s = Math.ceil(rem);
  if(s <= 3 && s >= 1 && PL.beeped !== s){ PL.beeped = s; beep(660, .1); }
  if(rem <= 0){ beep(990, .2); plNext(); return; }
  plPaintTime();
}
function plNext(){ PL.i++; if(PL.i >= PL.list.length) return plFinish(); enterInterval(); }
function plPrev(){ const it = PL.list[PL.i], spent = it.sec - (PL.endAt - Date.now())/1000; if(spent < 3 && PL.i > 0) PL.i--; PL.paused = false; setPauseIcon(); enterInterval(); }
function setPauseIcon(){ const b = $('#plPause'); if(b){ b.innerHTML = PL.paused ? ICON.play : ICON.pause; b.setAttribute('aria-label', PL.paused ? 'Tiếp tục' : 'Tạm dừng'); } }
function plTogglePause(){
  if(PL.paused){ PL.endAt = Date.now() + PL.remain; PL.paused = false; } else { PL.remain = Math.max(0, PL.endAt - Date.now()); PL.paused = true; }
  setPauseIcon(); plPaintTime();
}
function saveSession(full){
  const m = PL.meta; if(m.nolog) return 0;
  const min = Math.max(1, Math.round(PL.elapsed / 60000));
  const e = {kind: m.kind, title: m.title + (full ? '' : ' (dở)'), min, focus: m.focus || ''};
  if(m.kind === 'run'){ e.km = full ? m.km : Math.round(m.km * Math.min(1, PL.i / PL.list.length) * 10) / 10; if(full && m.planKey) e.planKey = m.planKey; }
  if(m.kind === 'workout'){ const slot = m.slot || (full || min >= 8 ? autoSlot(m.focus) : null); if(slot) e.slot = slot; if(full && m.planKey) e.planKey = m.planKey; }
  addLog(e);
  return min;
}
function plFinish(){
  PL.finished = true; clearInterval(PL.iv); PL.iv = null; wake(false);
  const min = saveSession(true);
  chime(); say(PL.meta.nolog ? 'Hết giờ' : 'Xong rồi. Làm tốt lắm!');
  plDone(min);
}
function plDone(min){
  const r = weekRange(), p = S.profile, main = $('#plMain');
  $('#player').dataset.phase = 'done'; $('#plFill').style.height = '0';
  const segs = $('#plSeg').children; for(let k = 0; k < segs.length; k++) segs[k].className = 'done';
  main.classList.add('plain');

    main.innerHTML = '<div class="pl-done"><p class="pl-kind">Hết giờ</p><h2 class="pl-name">Ghi số lần vào bài kiểm tra.</h2><div class="btn-col"><button class="pl-btn fill" data-act="pl-exit">Quay lại</button></div></div>';
  } else {
    const lines = PL.meta.kind === 'snack'
      ? 'Vận động giữa giờ hôm nay: ' + snacksToday() + ' trên ' + p.snackTarget + ' lần.' + (FT.state === 'break' ? ' Giờ nghỉ vẫn đang chạy, hết giờ app sẽ báo.' : '')
      : 'Tuần này: ' + activeDays(r) + ' trên ' + p.activeGoal + ' ngày vận động, ' + strengthCount(r) + ' buổi sức mạnh.';
    main.innerHTML = '<div class="pl-done"><p class="pl-kind">Xong rồi</p><div class="pl-time">' + min + '<small>phút</small></div><p class="pl-cue">' + esc(PL.meta.title) + ' đã được ghi vào nhật ký.</p><p class="pl-cue">' + lines + '</p>' +
      (weekStreak() ? '<p class="pl-cue">Chuỗi hiện tại: ' + weekStreak() + ' tuần đạt mục tiêu.</p>' : '') + '<div class="btn-col"><button class="pl-btn fill" data-act="pl-exit">Đóng</button></div></div>';
  }
  $('#plCtrl').hidden = true; $('#plLeft').textContent = '';
  if(!PL.meta.nolog) renderAll();
}
function plClose(){
  if(PL.finished || PL.elapsed < 60000 || PL.meta.nolog){ plExit(); return; }
  if(!PL.paused) plTogglePause();
  PL.confirming = true;
  const mins = Math.max(1, Math.round(PL.elapsed / 60000)), main = $('#plMain');
  main.classList.add('plain');
  main.innerHTML = '<div class="pl-done"><p class="pl-kind">Dừng giữa chừng</p><h2 class="pl-name">Lưu ' + mins + ' phút đã tập?</h2><p class="pl-cue" style="margin-top:12px">Tập dở vẫn được tính là một ngày vận động.</p>' +
    '<div class="btn-col"><button class="pl-btn fill" data-act="pl-save-exit">Lưu và thoát</button><button class="pl-btn" data-act="pl-resume">Tập tiếp</button><button class="pl-btn" data-act="pl-exit">Thoát, không lưu</button></div></div>';

}
function plResume(){ PL.confirming = false; plMainFrame(); paintInterval(); plTogglePause(); }
function plExit(){
  clearInterval(PL.iv); PL.iv = null; wake(false);

  $('#player').hidden = true; $('#player').innerHTML = ''; document.body.style.overflow = '';
  showBanner(FT.banner);
  renderAll();
}

  {k:['hit xa','xa don','pull up','pullup','khong hit duoc','chin up'], a:'Lộ trình hít xà: 1) treo xà 3 lần 30 giây, 2) treo chủ động kéo vai xuống, 3) kéo vai 8 lần, 4) hạ chậm 3–5 giây, 5 lần. Tập nhóm “Lên trình xà đơn” 2 lần mỗi tuần, thường sau 4–8 tuần có cái hít xà đầu tiên. Giảm mỡ cũng giúp nhiều.', act:[A('Lên trình xà đơn 15 phút','start-focus',{f:'xa-don',m:15})]},
  {k:['nhay day','vap day','vuong day'], a:'Nhảy dây: dây dài tới nách khi giẫm giữa dây, nhảy thấp 2–3 cm bằng mũi chân, quay bằng cổ tay, khuỷu tay sát người. Vấp thì cứ bắt đầu lại, ai cũng vấp tuần đầu. Đau ống quyển thì nhảy trên sàn gỗ hoặc thảm, giảm thời gian.'},
  {k:['dau goi','goi dau','dau khop goi','moi goi'], a:'Đau gối khi chạy thường do tăng quãng chạy quá nhanh, bước quá dài hoặc mông và hông yếu. Tạm thời: giảm quãng chạy, bước ngắn và nhanh hơn, tránh xuống dốc. Tập cầu mông, sò mở, chùng chân sang ngang. Đau nhói, sưng, đau tăng dần hoặc kéo dài quá 1 tuần thì dừng chạy và đi khám.', act:[A('Mông và đùi 20 phút','start-focus',{f:'mong-dui',m:20})]},
  {k:['bap chan','chuot rut','cang chan','dau bap','vop be'], a:'Bắp chân căng là chuyện thường của người mới chạy. Sau buổi chạy giãn bắp chân 2 lần 30 giây mỗi bên, tập nhón gót một chân 3 lần 12 cái cách ngày. Chuột rút: uống đủ nước, thêm chút muối khi trời nóng, đừng tăng tốc đột ngột. Đau nhói một điểm hoặc sưng thì nghỉ và đi khám.', act:[A('Giãn cơ 10 phút','start-focus',{f:'phuc-hoi',m:10})]},
  {k:['ong quyen','ong chan','dau ong','shin'], a:'Đau dọc ống quyển thường do tăng quãng chạy nhanh hoặc chạy nhiều trên nền cứng. Giảm quãng chạy 1–2 tuần, thay bớt bằng cardio trong nhà, tập nâng mũi chân dựa tường và nhón gót. Đau một điểm nhói khi ấn vào xương thì cần đi khám.', act:[A('Cardio trong nhà 20 phút','start-focus',{f:'trong-nha',m:20})]},
  {k:['dau lung','moi lung','lung dau','gu lung','dau vai gay','moi vai'], a:'Ngồi lâu làm lưng trên gù, hông cứng, lưng dưới gánh thay. Mỗi 45 phút đứng dậy làm bài giữa giờ “Thẳng lưng, mở vai”, tuần tập thêm nhóm “Lưng thẳng, vai mở”. Đau lan xuống chân, tê, hoặc đau sau té ngã thì đi khám trước khi tập.', act:[A('Lưng thẳng, vai mở 15 phút','start-focus',{f:'lung-tu-the',m:15})]},
  {k:['dau nguc','tuc nguc','kho tho','chong mat','ngat','hoa mat','tim dap nhanh','hoi hop'], a:'Dừng tập ngay. Đau hoặc tức ngực, khó thở bất thường, chóng mặt, choáng khi tập là dấu hiệu cần được bác sĩ kiểm tra. Nếu kéo dài, nặng dần hoặc lan ra tay, hàm thì gọi cấp cứu 115. Đừng tập lại cho tới khi đã đi khám.'},
  {k:['an truoc','truoc khi chay','an gi truoc','doi khi chay','an truoc khi tap'], a:'Trước khi chạy tối 1–2 tiếng: ăn nhẹ dễ tiêu như một quả chuối, hộp sữa chua, lát bánh mì với mật ong. Ngay sau giờ làm mà đói lả thì nửa quả chuối 20 phút trước khi chạy. Tránh đồ nhiều dầu mỡ và nhiều chất xơ ngay trước giờ chạy.'},
  {k:['sau khi chay','an sau','sau tap','an gi sau','phuc hoi an'], a:'Trong 1–2 tiếng sau tập: một bữa có đạm và tinh bột, ví dụ cơm với cá hoặc thịt nạc và rau, phở, bún gà, sữa chua với chuối. Uống bù nước. Không cần đồ uống thể thao nếu tập dưới 1 tiếng.'},
  {k:['an kieng','an uong','giam can nhanh','nhin an','calo','bua toi','an toi','an vat','an gi'], a:'Nguyên tắc ăn để giảm mỡ mà vẫn có sức chạy: ăn đủ ba bữa, mỗi bữa nửa đĩa rau, một phần đạm bằng lòng bàn tay, một phần tinh bột vừa phải. Cắt nước ngọt, trà sữa, bia trước tiên. Đừng nhịn ăn hay ăn kiêng khắc nghiệt: sẽ mệt, bỏ tập và ăn bù. Giảm khoảng nửa ký mỗi tuần là tốc độ bền.'},
  {k:['uong nuoc','nuoc','mat nuoc','dien giai','khat'], a:'Uống đều trong ngày, nước tiểu vàng nhạt là đủ. Chạy dưới 1 tiếng chỉ cần uống trước và sau. Chạy dài từ 10 km trở lên, trời nóng: mang nước, uống vài ngụm mỗi 15–20 phút, thêm chút muối hoặc nước điện giải.'},
  {k:['ngu','thuc khuya','ngu it'], a:'Ngủ 7 tiếng giúp hồi phục cơ, đỡ thèm ăn và có sức tập sau giờ làm. Chạy tối thì kết thúc trước giờ ngủ ít nhất 1,5 tiếng, tắm nước ấm, giãn cơ 10 phút hoặc nghe bài Quét cơ thể giúp dễ ngủ hơn.', act:[A('Quét cơ thể trước khi ngủ','med-start',{k:'scan'}), A('Giãn cơ 10 phút','start-focus',{f:'phuc-hoi',m:10})]},
  {k:['troi mua','mua to','dang mua','mua roi','khong ra ngoai','trong nha','khong chay duoc'], a:'Trời mưa thì có nhóm “Cardio trong nhà”: nhảy dây, bước nhanh, đấm gió, leo cầu thang theo nhịp đều, thay được buổi chạy dễ hoặc chất lượng. Riêng buổi chạy dài thì dời sang hôm khác trong tuần bằng nút Đổi ngày.', act:[A('Cardio trong nhà 25 phút','start-focus',{f:'trong-nha',m:25})]},
  {k:['nong','troi nong','oi buc','troi nang','nang nong'], a:'Trời nóng ẩm: chạy tối hoặc sáng sớm, chậm hơn 10–20 giây mỗi km là bình thường. Mặc đồ sáng màu, mang nước. Thấy chóng mặt, nổi da gà giữa trời nóng, ngừng đổ mồ hôi thì dừng ngay, vào chỗ mát.'},
  {k:['pace','toc do','chay nhanh','chay cham','nhip chay'], a:() => { const p = S.profile; if(!p.fiveK) return 'Chưa có thời gian 5 km nên app hướng dẫn theo cảm giác: chạy dễ là vẫn nói trọn câu, tempo là chỉ nói được vài từ. Chạy thử 5 km hết sức rồi nhập vào trang Lịch tập, mục Lộ trình 21K, app sẽ tính pace cho từng buổi.'; const pc = paces(p.fiveK); return 'Theo thời gian 5 km của bạn: chạy dễ ' + fmtPace(pc.easy[0]) + '–' + fmtPace(pc.easy[1]) + ' mỗi km, tempo ' + fmtPace(pc.tempo) + ', pace half marathon ' + fmtPace(pc.hm) + ', dự đoán về đích khoảng ' + fmtHM(pc.hmTotal) + '. Phần lớn các buổi chạy nên ở mức dễ.'; }, act:[A('Xem lộ trình 21K','go',{v:'lich-tap',mode:'21k'})]},
  {k:['lo buoi','bo lo','bo tap','nghi may ngay','quen tap','lo lich','tre lich','bo buoi','nghi lau'], a:'Lỡ buổi không sao. Quy tắc duy nhất: không bỏ lỡ hai ngày liền. Buổi chưa làm hiện ở mục “Làm bù trong tuần” trên trang Hôm nay, làm ngày nào cũng tính. Bỏ cả tuần chạy thì vào Lộ trình 21K bấm “Lùi lịch 1 tuần”. Nghỉ trên 2 tuần thì quay lại với quãng chạy ngắn hơn một nửa.', act:[A('2 phút giữ nhịp','quick2')]},
  {k:['bao lau','khi nao','may tuan','bao gio thay','ket qua','bao lau thi'], a:'Thường thấy: sau 2 tuần ngủ ngon hơn, đỡ mệt khi leo cầu thang; sau 4 tuần chạy nhẹ nhàng hơn rõ, vòng bụng bắt đầu giảm; sau 8–12 tuần quần áo rộng ra, thấy đường nét vai và bắp chân. Điều quyết định là đều đặn, không phải tập thật nặng.'},
  {k:['giay','giay chay','mua giay'], a:'Giày chạy đúng size, mũi giày dư khoảng một đốt ngón tay, đi thử vào buổi chiều khi chân hơi nở. Không cần giày đắt, cần giày êm và vừa. Thay giày sau khoảng 600–800 km hoặc khi đế hết êm.'},
  {k:['tho','hut hoi','tho doc','tho khi chay','kho tho khi chay'], a:'Hụt hơi khi chạy thường là do chạy nhanh quá. Chạy chậm tới mức nói được trọn câu, thở bằng cả mũi và miệng, thở ra dài. Có thể đếm nhịp: hít vào 3 bước, thở ra 2–3 bước. Khó thở bất thường kèm đau ngực hoặc chóng mặt thì dừng và đi khám.'},
  {k:['khoi dong'], a:'Mọi buổi tập từ 10 phút trở lên trong app đã có 2 phút khởi động. Trước khi chạy: đi bộ nhanh 3 phút, xoay hông, đá lăng chân, rồi chạy thật chậm 5 phút đầu. Buổi chạy nhanh thì khởi động 1,5 km chạy dễ như ghi trong buổi tập.'},
  {k:['chay sang','day som','buoi sang','chay toi','buoi toi','sau gio lam'], a:'Không cần dậy sớm. Chạy tối sau giờ làm có hiệu quả như chạy sáng, có khi còn khỏe hơn vì cơ thể đã ấm. Lịch của bạn để hai buổi chạy vào tối trong tuần, buổi chạy dài vào cuối tuần, sáng hoặc chiều mát như bạn quen.'},
  {k:['21 km','21km','half marathon','ngay dua','giai chay','ve dich','dang ky giai'], a:() => 'Ngày đua dự kiến ' + fullDate(raceDay()) + '. Tuần đua chỉ chạy nhẹ, không thử giày, đồ ăn hay quần áo mới. Ngày đua: xuất phát chậm ở 3 km đầu, uống nước ở trạm, đi bộ một chút khi mệt cũng được. Mục tiêu đầu tiên là về đích khỏe.', act:[A('Xem lộ trình 21K','go',{v:'lich-tap',mode:'21k'})]},
  {k:['gian co','cang co','deo dai','cung nguoi'], a:'Giãn cơ sau buổi chạy hoặc vào ngày phục hồi: hông, đùi trước, đùi sau, bắp chân, mông. Giữ mỗi tư thế 30–45 giây, thở chậm, không nhún. Lịch đã có một buổi giãn cơ 15 phút sau ngày chạy dài.', act:[A('Giãn cơ 15 phút','start-focus',{f:'phuc-hoi',m:15})]},
  {k:['sao luu','chuyen may','ipad','iphone','may khac','dong bo','may ca nhan','chuyen du lieu'], a:'Trang Tiến độ, mục “Sao lưu và chuyển sang máy khác”. Máy cũ: Chép mã sao lưu, gửi qua Teams, email hay Ghi chú. Máy mới: dán mã, bấm Nhập tiến độ. Dữ liệu hai máy được gộp lại.', act:[A('Mở phần sao lưu','go-backup')]},
  {k:['kiem tra the luc','kiem tra','do suc','test'], a:'Mỗi đầu tháng lịch có một buổi kiểm tra: chống đẩy liền một lượt, squat 1 phút, plank lâu nhất, treo xà lâu nhất, hít xà, nhảy dây 1 phút. So với tháng trước để thấy mình tiến bộ, kể cả khi cân nặng chưa đổi.', act:[A('Làm bài kiểm tra','open-test',{key:''})]},
  {k:['khong giam can','dung can','can khong giam','tang can','can dung yen'], a:'Mới tập, cân có thể đứng yên vì cơ giữ thêm nước và glycogen, trong khi mỡ vẫn giảm. Nhìn vòng bụng và quần áo. Nếu 3–4 tuần cả cân và vòng bụng đều không đổi, xem lại đồ uống ngọt, bữa tối và đồ ăn vặt trước khi tập nhiều hơn.', act:[A('Ghi số đo','log-body')]},
  {k:['dau co','moi co','nhuc','dau nguoi','dau dui','dau mong','moi nguoi'], a:'Mỏi cơ 1–3 ngày sau buổi tập mới là bình thường, nhất là tuần đầu. Vận động nhẹ, giãn cơ, đi bộ giúp đỡ nhanh hơn nằm im. Khác với đau nhói, đau khớp hoặc sưng: những cái đó cần nghỉ.', act:[A('Giãn cơ 10 phút','start-focus',{f:'phuc-hoi',m:10})]},
  {k:['doi ngay','doi lich','ban ngay','lich tuan','lich thang','lich tap'], a:'Trang Lịch tập có lịch tuần và lịch tháng. Bận ngày nào thì chạm vào ngày đó, chọn Đổi ngày để hoán đổi với ngày khác trong tuần. Muốn đổi hẳn ngày chạy cố định thì vào Cài đặt.', act:[A('Mở lịch tuần','go',{v:'lich-tap',mode:'week'}), A('Mở lịch tháng','go',{v:'lich-tap',mode:'month'})]},
  {k:['ngoi lau','van phong','giua gio','ngoi nhieu','ngoi may tinh'], a:'Trang Giữa giờ có đồng hồ nhắc mỗi 30, 45 hoặc 60 phút và 8 bài 2–3 phút làm ngay cạnh bàn. Mục tiêu 5 lần mỗi ngày làm việc.', act:[A('Mở trang Giữa giờ','go',{v:'van-phong'})]},
  {k:['co bung','6 mui','sau mui','bung phang','co bung lo'], a:'Cơ bụng lộ rõ khi mỡ cơ thể đủ thấp, nên chìa khóa vẫn là giảm mỡ toàn thân. Tập core 2–3 lần mỗi tuần để bụng phẳng và chắc: nhóm Bụng và eo có 4 bộ bài xoay vòng.', act:[A('Bụng và eo 15 phút','start-focus',{f:'bung',m:15})]},
  {k:['bap tay','tay to','mo tay','bap chuoi','tay sau','vai tron','vai to','tay gon'], a:'Tay gọn và chắc cần cả giảm mỡ toàn thân lẫn tập tay sau, vai: duỗi tay sau qua đầu, đá tạ ra sau, chống đẩy hẹp tay, dang tạ ngang. Có trong nhóm “Vai, tay và lưng”.', act:[A('Vai, tay và lưng 20 phút','start-focus',{f:'than-tren',m:20})]},
  {k:['mong','vong 3','dui to','dui'], a:'Mông săn và đùi gọn: tập nhóm “Mông và đùi” với đẩy hông cầm tạ, squat sumo, chùng chân chéo, bước lên ghế. Mông khỏe còn giúp chạy đỡ đau gối.', act:[A('Mông và đùi 20 phút','start-focus',{f:'mong-dui',m:20})]},
  {k:['stress','cang thang','ap luc','qua tai','met moi tinh than','burnout','kiet suc tinh than','cang dau','nang dau'], a:'Nghe như dạo này bạn đang gánh nhiều thật. Căng thẳng vì công việc và tiền bạc là phản ứng bình thường, không phải bạn yếu. Ba việc nhỏ làm được ngay: 1) Thở dài sinh lý 2 phút để hạ nhịp. 2) Viết hết lo lắng ra trong mục Xả lo âu, tách việc làm được khỏi việc ngoài tầm tay. 3) Đi bộ hoặc chạy nhẹ 10–20 phút hôm nay, vận động là cách giảm stress có bằng chứng mạnh nhất. Ngủ đủ 7 tiếng cũng quan trọng không kém. Nếu căng thẳng kéo dài nhiều tuần, ảnh hưởng tới giấc ngủ và công việc, nói chuyện với chuyên gia tâm lý sẽ giúp nhiều.', act:[A('Thở dài sinh lý 2 phút','breath-start',{k:'sigh',m:2}), A('Xả lo âu','journal-open',{k:'worry'}), A('Mở Tâm trí','go',{v:'tam-tri'})]},
  {k:['buon','chan nan','that vong','tuyet vong','trong rong','khong vui','buon ba','tram cam','mat hung thu','u uat'], a:'Cảm ơn bạn đã nói ra. Buồn và chán nản khi mọi việc không suôn sẻ là chuyện con người, và nó sẽ qua. Lúc buồn, đợi có hứng mới làm thì thường không đến; làm một việc nhỏ trước thì tâm trạng hay nhích lên sau: đi bộ 10 phút ngoài trời, nhắn cho một người bạn, nấu một bữa đơn giản. Tối nay thử ghi 3 điều tốt, dù nhỏ. Nếu buồn kéo dài hơn hai tuần, mất hứng thú với gần như mọi thứ, hoặc có lúc nghĩ tới việc làm hại bản thân, hãy gặp bác sĩ hoặc chuyên gia tâm lý. ' + HOTLINE, act:[A('Tử tế với chính mình','med-start',{k:'kind'}), A('3 điều tốt hôm nay','journal-open',{k:'good3'})]},
  {k:['lo lang','lo au','bat an','hoang loan','hoang so','so hai','lo so','hoi hop lo','con hoang'], a:'Khi lo lắng dâng lên: thở ra dài hơn hít vào là cách nhanh nhất báo cho cơ thể rằng mình an toàn. Thử Thở dài sinh lý 1–2 phút, hoặc Thở hộp nếu sắp vào cuộc họp. Rồi viết điều đang lo ra giấy và hỏi: việc gì trong đó mình làm được ngay hôm nay? Cơn hoảng thường lên đỉnh trong khoảng 10 phút rồi dịu xuống. Nếu kèm đau ngực, khó thở nặng hoặc lần đầu bị như vậy, hãy đi khám để loại trừ vấn đề tim mạch.', act:[A('Thở dài sinh lý 2 phút','breath-start',{k:'sigh',m:2}), A('Thở hộp 3 phút','breath-start',{k:'box',m:3}), A('Xả lo âu','journal-open',{k:'worry'})]},

  {k:['doanh nhan','nguoi thanh cong','ceo','lanh dao','thoi quen tot','nguoi giau'], a:'Những thói quen hay gặp ở người làm việc áp lực cao: vận động gần như mỗi ngày; vài phút thiền hoặc thở (Ray Dalio kể ông thiền đều đặn hàng chục năm); chừa khoảng trống không họp trong lịch để suy nghĩ; viết ra để nghĩ rõ; ngủ đủ và giờ giấc cố định; có người để nói chuyện như huấn luyện viên, chuyên gia tâm lý hay bạn tin cậy; và có lúc ngắt hẳn khỏi màn hình. Chi tiết ở trang Tâm trí.', act:[A('Mở Tâm trí','go',{v:'tam-tri'})]},
  {k:['buc boi','kho chiu','cau gat','nong nay','tuc gian','buc minh','gat gong','de noi nong'], a:'Bực bội, khó chịu thường là dấu hiệu cơ thể đang quá tải: thiếu ngủ, đói, căng thẳng dồn lâu. Khi cơn bực lên: dừng lại, thở dài sinh lý vài hơi, đợi 10 phút trước khi trả lời tin nhắn hay email. Đi bộ hoặc vận động giúp xả nhanh. Rồi hỏi mình: mình có đang đói, mệt hay thiếu ngủ không?', act:[A('Thở dài sinh lý 1 phút','breath-start',{k:'sigh',m:1}), A('Đốt mỡ 10 phút','start-focus',{f:'dot-mo',m:10})]},

const Tutor = {
  answer(q){
    const n = norm(q);
    if(n.trim().length < 2) return {a:'Bạn gõ câu hỏi nhé, ví dụ “tối nay mệt tập gì”.'};
    if(riskText(q)) return {a:'Cảm ơn bạn đã nói ra điều này. Nghe như bạn đang chịu đựng rất nhiều, và bạn không phải gánh một mình.\n- Nếu bạn đang nghĩ tới việc làm hại bản thân, hãy gọi hoặc nhắn ngay cho một người thân, bạn bè ở gần. Có thể nhắn đơn giản: “Mình đang thấy rất tệ, bạn gọi cho mình được không?”\n- Đường dây hỗ trợ tâm lý Ngày Mai: 096 306 1414.\n- Nếu đang gặp nguy hiểm ngay lúc này, gọi cấp cứu 115 hoặc đến bệnh viện gần nhất.\nỞ cạnh một người khác lúc này sẽ an toàn hơn ở một mình.', act:[A('Thở đều 3 phút','breath-start',{k:'reso',m:3})], risk:true};
    let best = null, score = 0;
    for(const r of TUTOR){ let s = 0; for(const k of r.k){ const kk = norm(k).trim(); if(kk && n.includes(' ' + kk + ' ')) s += kk.split(' ').length * 2 + 1; } if(s > score){ score = s; best = r; } }
    if(!best) return {a:'Mình chưa hiểu câu này. Thử hỏi kiểu: “tối nay mệt tập gì”, “đau gối khi chạy”, “ăn gì trước khi chạy”, “làm sao giảm mỡ bụng”, “tạ 5 kg nhẹ quá”.', act:[A('Hôm nay tập gì?','coach-quick',{q:'Hôm nay tập gì?'})]};
    return {a: typeof best.a === 'function' ? best.a(n) : best.a, act: best.act || []};
  }
};

function coachContext(){
  const p = S.profile, P = getPlan(), w = curWeekIdx(), wk = currentWeek(), dk = doneKeys(), t = todayStr(), r = weekRange(t);

  lines.push('Ngày đua: ' + fullDate(raceDay()) + ' (còn ' + diffDays(t, raceDay()) + ' ngày). Lộ trình ' + P.N + ' tuần, đang ở ' + (w < 1 ? 'giai đoạn chuẩn bị' : w > P.N ? 'sau ngày đua' : 'tuần ' + w + ', ' + PHASE[wk.cut ? 'cut' : wk.phase]) + '.');
  lines.push('Buổi chạy tuần này: ' + wk.runs.map(x => SHORT[x.type] + ' "' + x.title + '" ' + num(x.km) + ' km (' + (dk.has(x.key) ? 'đã xong' : 'chưa') + ')').join('; ') + '.');
  lines.push('Sức mạnh tuần này: ' + strengthCount(r) + '. Ngày vận động: ' + activeDays(r) + '/' + p.activeGoal + '. Giữa giờ hôm nay: ' + snacksToday() + '/' + p.snackTarget + '.');
  const recent = S.logs.filter(l => l.d >= addDays(t, -7));
  lines.push('Nhật ký 7 ngày: ' + (recent.length ? recent.map(l => viDate(l.d) + ' ' + l.title + (l.km ? ' ' + num(l.km) + 'km' : '') + (l.min ? ' ' + l.min + 'ph' : '')).join('; ') : 'trống') + '.');
  const mm = S.moods.slice(-7); if(mm.length) lines.push('Check-in tâm trạng gần đây (1 tệ – 5 tốt; căng thẳng 1 thư thái – 5 quá tải): ' + mm.map(m => viDate(m.d) + ' tâm trạng ' + m.mood + (m.stress ? ', căng ' + m.stress : '') + (m.sleep ? ', ngủ ' + m.sleep + 'h' : '') + (m.tags && m.tags.length ? ' (' + m.tags.join(', ') + ')' : '')).join('; ') + '.');
  const fl = S.focusLog.filter(f => f.d >= addDays(t, -7)); lines.push('Phiên tập trung 7 ngày: ' + fl.length + ', tổng ' + fl.reduce((s2, f) => s2 + f.min, 0) + ' phút.');
  const lb = S.body[S.body.length - 1]; if(lb) lines.push('Số đo gần nhất ' + viDate(lb.d) + ': ' + (lb.waist ? 'vòng bụng ' + num(lb.waist) + ' cm ' : '') + (lb.w ? 'cân nặng ' + num(lb.w) + ' kg' : '') + '.');
  return lines.join('\n');
}
function coachRules(){
  return 'Bạn là huấn luyện viên cá nhân về thể hình và chạy bộ trong app “Nhịp 21”. Trả lời bằng tiếng Việt, xưng “mình”, gọi người dùng là “bạn”, giọng ấm áp nhưng thẳng thắn.\n' +
    'Cách trả lời: ngắn gọn (khoảng 150 từ trở xuống), đưa việc cụ thể làm được ngay: tên bài, số phút hoặc số lần, mức cảm giác. Ngày mệt thì đưa phương án tối thiểu. Không dùng tiêu đề markdown; được dùng gạch đầu dòng “- ” và **in đậm** thật ít.\n' +
    'Người dùng: dân văn phòng ngồi nhiều, hay mệt sau giờ làm, khó dậy sớm, giờ giấc thất thường, tự nhận hơi lười. Mục tiêu: giảm mỡ bụng, săn chắc, chạy trọn half marathon 21,1 km.\n' +
    'Dụng cụ ở nhà: 2 tạ đơn 5 kg, xà đơn, dây nhảy. Ở văn phòng: không có dụng cụ. Trong app có: lịch tuần và tháng (3 buổi chạy, 2 buổi tạ, 1 buổi đốt mỡ và core, 1 buổi giãn cơ, kiểm tra thể lực đầu tháng), các nhóm bài: Săn chắc toàn thân, Vai tay và lưng, Mông và đùi, Chân khỏe cho chạy bộ, Lên trình xà đơn, Lưng thẳng vai mở, Đốt mỡ, Bụng và eo, Cardio trong nhà, Giãn cơ; kiểu tập Vòng tròn, Siêu set, EMOM, Tabata; vận động giữa giờ 2–3 phút.\n' +
    'An toàn: đau nhói, đau khớp kéo dài, sưng, đau ngực, khó thở hoặc chóng mặt thì khuyên dừng tập và đi khám; không chẩn đoán bệnh. Về ăn uống chỉ đưa nguyên tắc lành mạnh chung, không khuyên nhịn ăn hay ăn kiêng khắc nghiệt.\n' +
    'Sức khỏe tinh thần: người dùng đang căng thẳng vì công việc và đầu tư khó khăn, hay buồn, khó chịu, mệt mỏi. Khi họ nói về cảm xúc: đồng cảm trước, ngắn gọn, không giảng giải, rồi gợi ý một việc nhỏ có trong app (Thở dài sinh lý, Thở hộp, Thở 4-7-8, Thở đều; thiền 3 phút, Tử tế với chính mình, Quét cơ thể, Nghỉ sâu, Thiền đi bộ; viết Xả lo âu, 3 điều tốt, Nhìn lại suy nghĩ; phiên tập trung ở trang Làm việc). Không chẩn đoán bệnh tâm lý. Nếu buồn kéo dài trên hai tuần hoặc ảnh hưởng nhiều tới cuộc sống, khuyến khích gặp bác sĩ hoặc chuyên gia tâm lý. Nếu có dấu hiệu muốn làm hại bản thân hay tự tử: trả lời ấm áp, khuyên liên hệ ngay người thân ở gần, đường dây hỗ trợ tâm lý Ngày Mai 096 306 1414 hoặc cấp cứu 115. Về đầu tư: không khuyên mua, bán hay giữ; chỉ giúp về cảm xúc và thói quen như giới hạn xem giá, đợi 24 giờ trước quyết định lớn.\n\nDữ liệu hiện tại của người dùng:\n' + coachContext();
}

function refreshCoach(){ const log = $('#coachLog'); if(!log) return; log.innerHTML = coachLogHtml(); log.scrollTop = log.scrollHeight; }
async function coachSend(q){
  q = String(q || '').trim(); if(!q || COACH.busy) return;
  const inp = $('#coachIn'); if(inp) inp.value = '';
  if(!coachOnline()){ const r = Tutor.answer(q); COACH.turns.push({q, a:r.a, act:r.act, risk:!!r.risk || riskText(q)}); refreshCoach(); return; }
  const msgs = [{role:'user', content:coachRules()}];
  COACH.turns.filter(t => t.a && !t.err && !t.act).slice(-5).forEach(t => { msgs.push({role:'user', content:t.q}); msgs.push({role:'assistant', content:t.a}); });
  msgs.push({role:'user', content:q});
  const turn = {q, a:'', risk:riskText(q)}; COACH.turns.push(turn); COACH.busy = true; refreshCoach();
  const btn = $('#coachSend'); if(btn){ btn.textContent = 'Dừng'; btn.dataset.act = 'coach-stop'; }
  const ctl = new AbortController(); COACH.ctl = ctl; const idx = COACH.turns.length - 1;
  try{
    const res = await COACH.sample(msgs, {cache:false, signal:ctl.signal, onText:({text}) => { turn.a = text; const b = document.querySelector('[data-turn="' + idx + '"]'); if(b){ b.innerHTML = fmtAI(text); const log = $('#coachLog'); if(log) log.scrollTop = log.scrollHeight; } }});
    turn.a = res.text;
  }catch(e){
    const code = e && e.code; turn.a = (e && e.text) || turn.a || '';
    if(code === 'cancelled'){ if(!turn.a) turn.err = 'Đã dừng.'; }
    else turn.err = COACH_ERR[code] || 'HLV chưa trả lời được lúc này. Thử gửi lại sau ít phút.';
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){ COACH.off = true; const r = Tutor.answer(q); COACH.turns.push({q:'(offline) ' + q, a:r.a, act:r.act}); }
  }finally{ COACH.busy = false; COACH.ctl = null; refreshCoach(); const b2 = $('#coachSend'); if(b2){ b2.textContent = 'Gửi'; b2.dataset.act = 'coach-send'; } }
}
async function initCoach(){
  if(OFFLINE) return;
  try{ if(window.claude && typeof window.claude.use === 'function'){ const s = await window.claude.use('sample'); if(s) COACH.sample = s; } }catch(e){}
}

async function copyText(t){

function medSteps(key, min){

  const total = (min || 5) * 60, body = total - 50, n = BREATH_CUES.length, each = Math.round(body / n);

}

function riskText(s){
  const raw = ' ' + String(s || '').toLowerCase().normalize('NFC') + ' ';
  if(RISK_VI.some(k => raw.includes(k))) return true;
  return !/[^\x00-\x7f]/.test(String(s || '')) && RISK_ASCII.some(k => norm(s).includes(' ' + k + ' '));
}

function mindSuggest(){
  const c = todayMood(), h = new Date().getHours(), out = [];
  const add = x => { if(!out.some(o => o.k === x.k && o.kind === x.kind)) out.push(x); };
  if(c && c.stress >= 4) add({kind:'breath', k:'sigh', m:2, why:'Căng thẳng đang cao: thở dài sinh lý hạ nhịp nhanh nhất.'});
  if(c && c.tags && c.tags.includes('dau-tu')) add({kind:'journal', k:'worry', why:'Viết hết lo lắng về tiền bạc ra giấy, tách việc mình làm được khỏi việc ngoài tầm tay.'});
  if(c && c.mood <= 2) add({kind:'tip', k:'walk', why:'Ra ngoài đi bộ 10 phút, để điện thoại ở nhà. Vận động nhẹ là cách nhanh nhất để tâm trạng nhích lên.'});
  if(h >= 21 || h < 4) add({kind:'med', k:'scan', why:'Sắp tới giờ ngủ: thả lỏng từng phần cơ thể.'});
  if(h >= 21 || h < 4) add({kind:'breath', k:'b478', m:4, why:'4 nhịp thở 4-7-8 trên giường.'});
  if(c && c.sleep && c.sleep <= 6 && h >= 11 && h < 17) add({kind:'med', k:'nsdr', why:'Đêm qua ngủ ít: 9 phút nghỉ sâu giúp lấy lại sức buổi chiều.'});
  if(c && c.mood <= 3 && h >= 17) add({kind:'journal', k:'good3', why:'Cuối ngày ghi 3 điều tốt, dù nhỏ. Tập thói quen này vài tuần giúp tâm trạng khá lên.'});
  if(h >= 8 && h < 18) add({kind:'breath', k:'box', m:1, why:'Một phút trước cuộc họp hoặc quyết định khó.'});
  add({kind:'med', k:'m3', why:'Ba phút để đầu óc dừng lại trước khi làm tiếp.'});
  add({kind:'breath', k:'reso', m:5, why:'Năm phút thở đều mỗi ngày.'});
  return out.slice(0, 3);
}
function suggestRowHtml(x){

}

function mindChart(){
  const days = []; for(let i = 13; i >= 0; i--) days.push(addDays(todayStr(), -i));

  const line = (k, col) => { let d = '', pen = false; pts.forEach((p, i) => { if(p && p[k]){ d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[k]).toFixed(1) + ' '; pen = true; } else pen = false; });
    return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' + pts.map((p, i) => p && p[k] ? '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p[k]).toFixed(1) + '" r="3.2" fill="' + col + '"/>' : '').join(''); };
  let g = ''; [1,3,5].forEach(v => { g += '<line x1="12" x2="' + (W - 12) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)" stroke-dasharray="3 4"/>'; });
  g += '<text x="' + x(0) + '" y="' + (H - 6) + '">' + viDate(days[0]) + '</text><text x="' + x(13) + '" y="' + (H - 6) + '" text-anchor="end">Hôm nay</text>';
  return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Tâm trạng và căng thẳng 14 ngày">' + g + line('stress', 'var(--gold)') + line('mood', 'var(--cobalt)') + '</svg>' +
    '<div class="legend" style="margin:4px 6px 4px"><span><i class="kd c-run"></i>Tâm trạng (cao là tốt)</span><span><i class="kd c-str"></i>Căng thẳng (cao là căng)</span></div></div>';
}
function mindInsight(){
  const since = addDays(todayStr(), -30), ms = S.moods.filter(m => m.d >= since && m.mood);
  const ex = new Set(S.logs.filter(l => l.kind !== 'snack').map(l => l.d));
  const a = ms.filter(m => ex.has(m.d)), b = ms.filter(m => !ex.has(m.d));
  const avg = arr => arr.reduce((s, m) => s + m.mood, 0) / arr.length;
  const out = [];
  if(a.length >= 3 && b.length >= 3) out.push('Ngày có tập, tâm trạng trung bình của bạn là ' + num(Math.round(avg(a)*10)/10) + ' trên 5; ngày không tập là ' + num(Math.round(avg(b)*10)/10) + '.');
  const s7 = ms.filter(m => m.sleep >= 7), s6 = ms.filter(m => m.sleep && m.sleep < 7);
  if(s7.length >= 3 && s6.length >= 3) out.push('Đêm ngủ từ 7 tiếng, hôm sau tâm trạng ' + num(Math.round(avg(s7)*10)/10) + '; ngủ ít hơn là ' + num(Math.round(avg(s6)*10)/10) + '.');
  return out.length ? '<p class="note small" style="margin-top:10px">' + out.join(' ') + '</p>' : '';
}

/* ================= calm player (breathing, guided meditation, ambient sound) ================= */
const CM = {steps:[], i:0, endAt:0, remain:0, paused:false, iv:null, meta:null, elapsed:0, lastTs:0, done:false, fading:false, dimT:null};
const BREATH_SAY = {in:'Hít vào', in2:'Hít thêm', hold:'Giữ', hold2:'Giữ', out:'Thở ra'};
function softTone(f, d, v){
  if(!S.profile || !S.profile.sound || !AC) return;
  try{ const o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime; o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, n); g.gain.exponentialRampToValueAtTime(v || 0.12, n + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, n + d);
    o.connect(g); g.connect(AC.destination); o.start(n); o.stop(n + d + 0.05); }catch(e){}
}
function bell(){ softTone(528, 2.6, 0.16); setTimeout(() => softTone(792, 2.2, 0.07), 30); }
function startBreath(k, m){
  const B = BREATHS[k], cyc = B.pat.reduce((s, p) => s + p[1], 0);
  const n = B.cycles ? m : Math.max(3, Math.round(m * 60 / cyc));
  const steps = [];
  for(let c = 0; c < n; c++) B.pat.forEach(([ph, sec, label]) => steps.push({ph, sec, label, cyc:c + 1, of:n}));
  startCalm({kind:'breath', key:k, title:B.n, min:Math.max(1, Math.round(n * cyc / 60))}, steps);
}
function startMed(k, m){
  const st = medSteps(k, m).map(([sec, text]) => ({ph:'guide', sec, text}));
  startCalm({kind:'med', key:k, title:MEDS[k].n, min:medMin(k, m)}, st);
}
function startSound(k, m){ startCalm({kind:'sound', key:k, title:SOUNDS[k].n, min:m, sound:k}, [{ph:'sound', sec:m * 60}]); }
function cmSoundPanel(){
  const cur = CM.meta.kind === 'sound' ? CM.meta.sound : S.profile.calmSound;
  return '<div class="cm-snd" id="cmSnd" hidden><div class="chips">' + SOUND_LIST.filter(k => k !== 'own' || OWN.blob).filter(k => CM.meta.kind !== 'sound' || k !== 'off').map(k => '<button class="chip" data-act="cm-snd" data-v="' + k + '" aria-pressed="' + (cur === k) + '">' + SOUNDS[k].n + '</button>').join('') + '</div>' +
    '<label class="cm-vol">Âm lượng <input type="range" id="cmVol" min="0" max="1" step="0.05" value="' + S.profile.calmVol + '"></label>' +
    (CM.meta.kind !== 'sound' ? '<label class="check"><input type="checkbox" id="cmVoice"' + (S.profile.voice ? ' checked' : '') + '> Giọng đọc' + (bestVi() ? '' : ' (máy chưa có giọng tiếng Việt)') + '</label>' : '') + '</div>';
}
function cmDimSoon(){ clearTimeout(CM.dimT); if(!CM.meta || !(CM.meta.kind === 'sound' || CM.meta.key === 'scan')) return; CM.dimT = setTimeout(() => { if(!$('#calm').hidden && !CM.done) $('#calm').classList.add('dim'); }, 15000); }
function startCalm(meta, steps){
  ensureAudio(); closeSheet();
  CM.meta = meta; CM.steps = (meta.kind === 'sound' ? [] : [{ph:'prep', sec:meta.kind === 'breath' ? 4 : 5, label:'Chuẩn bị'}]).concat(steps);
  CM.i = 0; CM.paused = false; CM.elapsed = 0; CM.lastTs = Date.now(); CM.done = false; CM.fading = false;
  const el = $('#calm');
  const main = meta.kind === 'breath'
    ? '<div class="orb-wrap"><div class="orb-ring"></div><div class="orb" id="orb"></div><div class="orb-label"><b id="cmPhase">Chuẩn bị</b><span id="cmSec"></span></div></div><p class="cm-count" id="cmCount"></p><p class="cm-note">' + BREATH_SAFE + '</p>'
    : meta.kind === 'sound'
    ? '<p class="cm-kind">Âm thanh thư giãn</p><h2 class="cm-title">' + esc(meta.title) + '</h2><p class="cm-note">Màn hình sẽ tối dần, chạm để sáng lại. Hai phút cuối âm thanh nhỏ dần rồi tắt.</p><div class="cm-bar"><i id="cmBar"></i></div>'
    : '<p class="cm-step" id="cmStep"></p><div class="cm-bar"><i id="cmBar"></i></div>';
  el.innerHTML = '<div class="cm-top"><span>' + esc(meta.title) + '</span><span id="cmLeft"></span><button class="pl-x" data-act="cm-snd-toggle" aria-label="Âm thanh">' + ICON.note + '</button><button class="pl-x" data-act="cm-close" aria-label="Kết thúc">' + ICON.x + '</button></div>' +
    cmSoundPanel() + '<div class="cm-main" id="cmMain">' + main + '</div>' +
    '<div class="cm-ctrl" id="cmCtrl"><button class="main" data-act="cm-pause" id="cmPause" aria-label="Tạm dừng">' + ICON.pause + '</button></div>';
  el.classList.remove('dim'); el.hidden = false; document.body.style.overflow = 'hidden'; showBanner(null, true);
  ambStart(meta.kind === 'sound' ? meta.sound : S.profile.calmSound);
  cmEnter(); clearInterval(CM.iv); CM.iv = setInterval(cmTick, 200); wake(true);
  if(meta.kind === 'med'){ bell(); speakQueue('Bắt đầu. ' + meta.title + '.'); }
  else if(meta.kind === 'breath' && S.profile.breathVoice) speakQueue('Chuẩn bị.');
  cmDimSoon();
}
function cmEnter(){
  const s = CM.steps[CM.i]; CM.endAt = Date.now() + s.sec * 1000;
  if(CM.meta.kind === 'breath'){
    const orb = $('#orb'), sc = {prep:0.55, in:0.92, in2:1.04, hold:null, hold2:null, out:0.55}[s.ph];
    if(orb){ orb.style.transitionDuration = s.sec + 's'; if(sc != null) orb.style.transform = 'scale(' + sc + ')'; }
    $('#cmPhase').textContent = s.label;
    $('#cmCount').textContent = s.cyc ? 'Nhịp ' + s.cyc + ' trên ' + s.of : '';
    const spoke = s.ph !== 'prep' && S.profile.breathVoice && s.sec >= 2 && speakQueue(BREATH_SAY[s.ph], 1);
    if(!spoke){ if(s.ph === 'in') softTone(392, 0.5); else if(s.ph === 'out') softTone(294, 0.6); }
  } else if(CM.meta.kind === 'med'){
    $('#cmStep').textContent = s.text || 'Ngồi hoặc nằm thoải mái. Bắt đầu nhé.';
    if(s.ph === 'guide') speakQueue(s.text);
  }
  cmPaint();
}
function cmPaint(){
  const rem = CM.paused ? CM.remain/1000 : (CM.endAt - Date.now())/1000;
  let left = Math.max(0, rem); for(let k = CM.i + 1; k < CM.steps.length; k++) left += CM.steps[k].sec;
  const L = Math.ceil(left), l = $('#cmLeft'); if(l) l.textContent = 'còn ' + Math.floor(L/60) + ':' + pad(L%60);
  const sec = $('#cmSec'); if(sec) sec.textContent = Math.max(0, Math.ceil(rem));
  const bar = $('#cmBar'); if(bar){ const tot = CM.steps.reduce((a, x) => a + x.sec, 0); bar.style.width = (100 * (tot - left) / tot) + '%'; }
  return left;
}
function cmTick(){
  const now = Date.now(); if(!CM.paused && !CM.done) CM.elapsed += now - CM.lastTs; CM.lastTs = now;
  if(CM.paused || CM.done) return;
  if(CM.endAt - now <= 0){ CM.i++; if(CM.i >= CM.steps.length) return cmFinish(); cmEnter(); return; }
  const left = cmPaint();
  if(CM.meta.kind === 'sound' && !CM.fading && left <= 120){ CM.fading = true; ambFadeOut(left); }
}
function cmTogglePause(){
  if(CM.paused){ CM.endAt = Date.now() + CM.remain; CM.paused = false; const o = $('#orb'); if(o) o.style.transitionDuration = (CM.remain/1000) + 's'; }
  else { CM.remain = Math.max(0, CM.endAt - Date.now()); CM.paused = true; const o = $('#orb'); if(o){ const cs = getComputedStyle(o).transform; o.style.transitionDuration = '0s'; o.style.transform = cs === 'none' ? '' : cs; } try{ speechSynthesis.cancel(); }catch(e){} }
  ambPause(CM.paused);
  const b = $('#cmPause'); if(b){ b.innerHTML = CM.paused ? ICON.play : ICON.pause; b.setAttribute('aria-label', CM.paused ? 'Tiếp tục' : 'Tạm dừng'); }
  if(!CM.paused) cmEnterResume();
}
function cmEnterResume(){ const s = CM.steps[CM.i]; if(CM.meta.kind === 'breath'){ const orb = $('#orb'), sc = {prep:0.55, in:0.92, in2:1.04, out:0.55}[s.ph]; if(orb && sc) orb.style.transform = 'scale(' + sc + ')'; } }
function cmLog(full){
  const min = Math.max(1, Math.round(CM.elapsed / 60000));
  const e = {id:Date.now().toString(36), d:todayStr(), t:Date.now(), kind:CM.meta.kind, key:CM.meta.key, title:CM.meta.title, min, full};
  S.mindLog.push(e); persist(['mind']); return e;
}
function cmFinish(){
  CM.done = true; clearInterval(CM.iv); clearTimeout(CM.dimT); $('#calm').classList.remove('dim'); wake(false);
  const e = cmLog(true), main = $('#cmMain');
  $('#cmCtrl').hidden = true; $('#cmLeft').textContent = ''; const sp = $('#cmSnd'); if(sp) sp.hidden = true;

    main.innerHTML = '<div class="cm-done"><p class="cm-kind">Đã tắt âm thanh</p><h2>Ngủ ngon nhé.</h2><div class="btn-col" style="margin:22px auto 0"><button class="pl-btn fill" data-act="cm-exit">Đóng</button></div></div>';
    return;
  }

    [['better','Nhẹ hơn'],['same','Như cũ'],['worse','Khó chịu hơn']].map(([k, n]) => '<button class="chip" data-act="cm-feel" data-id="' + e.id + '" data-v="' + k + '">' + n + '</button>').join('') + '</div><p class="cm-note" id="cmFeel"></p>' +
    '<div class="btn-col" style="margin:22px auto 0">' + (CM.meta.key === 'scan' ? '<button class="pl-btn" data-act="sound-start" data-k="' + (S.profile.calmSound === 'off' || S.profile.calmSound === 'brown' ? 'rain' : S.profile.calmSound) + '" data-m="30">Phát tiếp âm thanh ru ngủ 30 phút</button>' : '') + '<button class="pl-btn fill" data-act="cm-exit">Đóng</button></div></div>';
}
function cmClose(){ if(!CM.done && CM.elapsed >= 60000) cmLog(false); cmExit(); }
function cmExit(){
