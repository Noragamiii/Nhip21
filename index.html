  ambStop(1);
  const el = $('#calm'); el.hidden = true; el.innerHTML = ''; el.classList.remove('dim'); document.body.style.overflow = '';
  if(FT.state === 'work' && S.profile.focusSound && S.profile.focusSound !== 'off') ambStart(S.profile.focusSound);
  showBanner(FT.banner); renderAll();
}

/* ================= focus timer (work tab) ================= */
const FMODES = {'25':{w:25,b:5,n:'25 + nghỉ 5'}, '50':{w:50,b:10,n:'50 + nghỉ 10'}, '90':{w:90,b:20,n:'90 + nghỉ 20'}, '45':{w:45,b:3,n:'45 + đứng dậy 3'}};
const FT = {state:'idle', endAt:0, remain:0, startedAt:0, task:'', iv:null, banner:null, worked:0};
function fMode(){ return FMODES[S.profile.focusMode] || FMODES['50']; }
function ftClock(){
  if(FT.state === 'work' || FT.state === 'break') return fmtClock(Math.ceil((FT.endAt - Date.now())/1000));
  if(FT.state === 'pause') return fmtClock(Math.ceil(FT.remain/1000));
  return fMode().w + ':00';
}
function ensureFtTick(){ if(!FT.iv) FT.iv = setInterval(ftTick, 1000); }
function ftTick(){
  if(FT.state !== 'work' && FT.state !== 'break') return;
  const rem = FT.endAt - Date.now(), c = $('#ftClock'); if(c) c.textContent = fmtClock(Math.ceil(rem/1000));
  if(rem > 0) return;
  if(FT.state === 'work'){
    const m = fMode(); logFocus(m.w, true); ambStop(3);
    FT.state = 'break'; FT.endAt = Date.now() + m.b * 60000; chime(); say('Hết phiên tập trung. Nghỉ một chút nhé');
    showBanner('break');
  } else { FT.state = 'ready'; softTone(660, 0.6, 0.2); setTimeout(() => softTone(880, 0.8, 0.2), 300); say('Hết giờ nghỉ'); showBanner('ready'); }
  if(S.profile) renderWork();
}
function logFocus(min, full){ S.focusLog.push({id:Date.now().toString(36), d:todayStr(), t:Date.now(), min:Math.round(min), task:FT.task, full}); persist(['mind']); }
function ftStart(){
  ensureAudio();
  const inp = $('#ftTask'); if(inp) FT.task = inp.value.trim();
  if(FT.state === 'pause'){ FT.endAt = Date.now() + FT.remain; }
  else { FT.endAt = Date.now() + fMode().w * 60000; FT.startedAt = Date.now(); FT.worked = 0; }
  FT.state = 'work'; showBanner(null); ensureFtTick(); renderWork();
  if(S.profile.focusSound && S.profile.focusSound !== 'off') ambStart(S.profile.focusSound);
}
function ftStop(){
  if(FT.state === 'work' || FT.state === 'pause'){
    const left = FT.state === 'pause' ? FT.remain : Math.max(0, FT.endAt - Date.now());

const AMB = {bus:null, srcs:[], timers:[], kind:'off', target:0, ducked:false, paused:false, el:null, url:null};
const NOISE = {};
const OWN = {blob:null, name:''};
function noiseBuf(type){
  if(NOISE[type]) return NOISE[type];
  const sr = AC.sampleRate, len = Math.floor(sr * 8), f = Math.floor(sr * 0.25), buf = AC.createBuffer(2, len, sr);
  for(let ch = 0; ch < 2; ch++){
    const x = new Float32Array(len + f);
    if(type === 'brown'){ let last = 0; for(let i = 0; i < x.length; i++){ const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; x[i] = last * 3.5; } }
    else { let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for(let i = 0; i < x.length; i++){ const w = Math.random() * 2 - 1; b0 = 0.99886*b0 + w*0.0555179; b1 = 0.99332*b1 + w*0.0750759; b2 = 0.969*b2 + w*0.153852; b3 = 0.8665*b3 + w*0.3104856; b4 = 0.55*b4 + w*0.5329522; b5 = -0.7616*b5 - w*0.016898; x[i] = (b0+b1+b2+b3+b4+b5+b6 + w*0.5362) * 0.11; b6 = w*0.115926; } }
    const d = buf.getChannelData(ch);
    for(let i = 0; i < len; i++) d[i] = i < f ? x[i] * (i / f) + x[len + i] * (1 - i / f) : x[i];
  }
  NOISE[type] = buf; return buf;
}
function aGain(v){ const x = AC.createGain(); x.gain.value = v; return x; }
function aFilt(type, freq, q){ const b = AC.createBiquadFilter(); b.type = type; b.frequency.value = freq; if(q != null) b.Q.value = q; return b; }
function aChain(){ const n = arguments; for(let i = 0; i < n.length - 1; i++) n[i].connect(n[i+1]); return n[n.length-1]; }
function aNoise(type){ const s = AC.createBufferSource(); s.buffer = noiseBuf(type); s.loop = true; s.start(); AMB.srcs.push(s); return s; }
function ambLater(bus, fn, ms){ const t = setTimeout(() => { AMB.timers = AMB.timers.filter(x => x !== t); if(AMB.bus === bus) fn(); }, ms); AMB.timers.push(t); }
function ambFactor(k){ return ({pad:0.9, rain:0.55, ocean:0.75, bowl:0.85, brown:0.6, own:1})[k] || 0.6; }
function ambStart(kind, vol){
  ambStop(0.4);
  if(!kind || kind === 'off' || !S.profile) return;
  ensureAudio(); if(!AC) return;
  try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
  if(kind === 'own' && !OWN.blob) kind = 'pad';
  const bus = AC.createGain(), now = AC.currentTime;
  bus.gain.value = 0.0001; bus.connect(AC.destination);
  Object.assign(AMB, {bus, srcs:[], timers:[], kind, ducked:false, paused:false, el:null, url:null});
  AMB.target = (vol != null ? vol : S.profile.calmVol) * ambFactor(kind);
  try{
    if(kind === 'rain'){
      aChain(aNoise('pink'), aFilt('highpass', 600), aFilt('lowpass', 6500), aGain(0.55), bus);
      aChain(aNoise('brown'), aFilt('lowpass', 350), aGain(0.35), bus);
      const drop = () => { const n = AC.currentTime, s = AC.createBufferSource(); s.buffer = noiseBuf('pink');
        const gg = aGain(0.0001); gg.gain.setValueAtTime(0.0001, n); gg.gain.exponentialRampToValueAtTime(0.05 + Math.random() * 0.22, n + 0.005); gg.gain.exponentialRampToValueAtTime(0.0001, n + 0.07);
        aChain(s, aFilt('bandpass', 2000 + Math.random() * 3500, 6), gg, bus); s.start(n, Math.random() * 7, 0.09);
        ambLater(bus, drop, 35 + Math.random() * 170); };
      drop();
    } else if(kind === 'ocean'){
      const lfo = AC.createOscillator(); lfo.frequency.value = 0.085; lfo.start(); AMB.srcs.push(lfo);
      const wave = aGain(0.45), dep = aGain(0.35); lfo.connect(dep); dep.connect(wave.gain);
      aChain(aNoise('brown'), aFilt('lowpass', 650), wave, bus);
      const foam = aGain(0.08), dep2 = aGain(0.07); lfo.connect(dep2); dep2.connect(foam.gain);
      aChain(aNoise('pink'), aFilt('highpass', 1200), aFilt('lowpass', 4000), foam, bus);
    } else if(kind === 'brown'){
      aChain(aNoise('brown'), aFilt('lowpass', 480), aGain(0.9), bus);
    } else if(kind === 'pad'){
      const lp = aFilt('lowpass', 1100, 0.2); lp.connect(bus);
      const dl = AC.createDelay(1.5); dl.delayTime.value = 0.55; const fb = aGain(0.35), wet = aGain(0.35);
      lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(bus);
      const CH = [[130.81,196.0,261.63,329.63],[110.0,164.81,220.0,261.63],[87.31,130.81,174.61,261.63],[98.0,146.83,196.0,293.66]];
      let ci = 0;
      const chord = () => { const t = AC.currentTime, ch = CH[ci++ % CH.length];
        ch.forEach(fr => ['sine','triangle'].forEach((ty, j) => { const o = AC.createOscillator(); o.type = ty; o.frequency.value = fr; o.detune.value = j ? 5 : -4;
          const gg = aGain(0.0001); gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(j ? 0.022 : 0.05, t + 5); gg.gain.setValueAtTime(j ? 0.022 : 0.05, t + 13); gg.gain.exponentialRampToValueAtTime(0.0001, t + 19);
          o.connect(gg); gg.connect(lp); o.start(t); o.stop(t + 19.5); }));
        ambLater(bus, chord, 14000); };
      chord();
      const SC = [523.25,587.33,659.25,783.99,880.0,1046.5,1174.66];
      const chime = () => { const t = AC.currentTime, fr = SC[Math.floor(Math.random() * SC.length)];
        [[1,0.035,4],[2.01,0.008,1.5]].forEach(([m, a, dec]) => { const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = fr * m;
          const gg = aGain(0.0001); gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(a, t + 0.02); gg.gain.exponentialRampToValueAtTime(0.0001, t + dec);
          o.connect(gg); gg.connect(bus); gg.connect(dl); o.start(t); o.stop(t + dec + 0.1); });
        ambLater(bus, chime, 2500 + Math.random() * 6000); };
      ambLater(bus, chime, 3000);
    } else if(kind === 'bowl'){
      const hum = AC.createOscillator(); hum.frequency.value = 87.31; hum.start(); AMB.srcs.push(hum); aChain(hum, aGain(0.04), bus);
      const strike = () => { const t = AC.currentTime, f0 = [146.83,174.61,196.0,220.0][Math.floor(Math.random() * 4)];
        [[1,1,10],[2.76,0.45,7],[5.4,0.22,4.5],[8.93,0.08,2.5]].forEach(([m, a, dec]) => [-0.7, 0.7].forEach(dt => {
          const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = f0 * m + dt;
          const gg = aGain(0.0001); gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(0.12 * a, t + 0.015); gg.gain.exponentialRampToValueAtTime(0.0001, t + dec);
          o.connect(gg); gg.connect(bus); o.start(t); o.stop(t + dec + 0.1); }));
        ambLater(bus, strike, 16000 + Math.random() * 10000); };
      strike();
    } else if(kind === 'own'){
      const url = URL.createObjectURL(OWN.blob), el = new Audio(); el.src = url; el.loop = true; el.preload = 'auto';
      try{ const src = AC.createMediaElementSource(el); src.connect(bus); }catch(e){ el.volume = Math.min(1, AMB.target * 1.6); }
      AMB.el = el; AMB.url = url; const pr = el.play(); if(pr && pr.catch) pr.catch(() => {});
    }
  }catch(e){}
  bus.gain.setValueAtTime(0.0001, now); bus.gain.exponentialRampToValueAtTime(Math.max(0.0002, AMB.target), now + 3);
}
function ambLevel(){ return AMB.paused ? 0.0001 : AMB.ducked ? AMB.target * 0.4 : AMB.target; }
function ambApply(t){ if(!AMB.bus || !AC) return; try{ const g = AMB.bus.gain, n = AC.currentTime; g.cancelScheduledValues(n); g.setValueAtTime(Math.max(0.0001, g.value), n); g.linearRampToValueAtTime(Math.max(0.0001, ambLevel()), n + (t || 0.6)); }catch(e){} }
function ambDuck(on){ if(!AMB.bus) return; AMB.ducked = on; ambApply(0.5); }
function ambPause(on){ AMB.paused = on; ambApply(0.8); if(AMB.el){ try{ if(on) AMB.el.pause(); else { const p = AMB.el.play(); if(p && p.catch) p.catch(() => {}); } }catch(e){} } }
function ambSetVol(v){ if(!AMB.bus) return; AMB.target = v * ambFactor(AMB.kind); ambApply(0.25); }
function ambFadeOut(sec){ if(!AMB.bus || !AC) return; try{ const g = AMB.bus.gain, n = AC.currentTime; g.cancelScheduledValues(n); g.setValueAtTime(Math.max(0.0001, g.value), n); g.linearRampToValueAtTime(0.0001, n + Math.max(1, sec)); }catch(e){} }
function ambStop(fade){
  const bus = AMB.bus, srcs = AMB.srcs, el = AMB.el, url = AMB.url;
  AMB.timers.forEach(t => clearTimeout(t));
  Object.assign(AMB, {bus:null, srcs:[], timers:[], kind:'off', el:null, url:null, ducked:false, paused:false});
  if(!bus) return;
  const f = fade == null ? 2 : fade;
  try{ const n = AC.currentTime; bus.gain.cancelScheduledValues(n); bus.gain.setValueAtTime(Math.max(0.0001, bus.gain.value), n); bus.gain.linearRampToValueAtTime(0.0001, n + Math.max(0.05, f)); }catch(e){}
  setTimeout(() => { srcs.forEach(s => { try{ s.stop(); }catch(e){} }); if(el){ try{ el.pause(); }catch(e){} } if(url) URL.revokeObjectURL(url); try{ bus.disconnect(); }catch(e){} }, Math.max(80, f * 1000 + 150));
}

function viVoices(){ try{ return (window.speechSynthesis && speechSynthesis.getVoices() || []).filter(v => /^vi/i.test(v.lang)); }catch(e){ return []; } }
function bestVi(){
  const vs = viVoices(); if(!vs.length) return null;
  const p = S.profile; if(p && p.voiceName){ const v = vs.find(x => x.name === p.voiceName); if(v) return v; }
  const sc = v => (/natural|neural|premium|enhanced|nâng cao/i.test(v.name) ? 4 : 0) + (/online/i.test(v.name) ? 2 : 0) + (/hoaimy|linh|google/i.test(v.name) ? 1 : 0);
  return vs.slice().sort((a, b) => sc(b) - sc(a))[0];
}
function speakQueue(text, rate){
  if(!S.profile || !S.profile.voice || !text) return false;
  const v = bestVi(); if(!v) return false;
  try{
    speechSynthesis.cancel();
    const parts = (String(text).match(/[^.!?…;:]+[.!?…;:]*/g) || [String(text)]).map(x => x.trim()).filter(Boolean);
    parts.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p); u.voice = v; u.lang = v.lang; u.rate = rate || S.profile.voiceRate || 0.95;
      if(i === 0) u.onstart = () => ambDuck(true);
      if(i === parts.length - 1){ u.onend = () => ambDuck(false); u.onerror = () => ambDuck(false); }
      speechSynthesis.speak(u);
    });
    return true;
  }catch(e){ return false; }
}

    '<div class="ck-row"><span class="pick-k">Nhạc của bạn</span><div>' + (OWN.blob ? '<p class="small"><b>' + esc(OWN.name) + '</b> <button class="linkish small" data-act="own-del">Bỏ file này</button></p>' : '<p class="small muted">Chọn một file nhạc thiền, nhạc không lời hay bản ghi giọng bạn thích có trong máy (mp3, m4a). File chỉ lưu trên máy này.</p>') +
      '<label class="file-btn">' + (OWN.blob ? 'Chọn file khác' : 'Chọn file nhạc') + '<input type="file" id="ownFile" accept="audio/*"></label></div></div>' +
    '<div class="ck-row"><span class="pick-k">Giọng đọc</span><div>' + (vs.length ? '<select id="voiceSel" aria-label="Chọn giọng đọc">' + vs.map(v => '<option value="' + esc(v.name) + '"' + (cur && cur.name === v.name ? ' selected' : '') + '>' + esc(v.name) + '</option>').join('') + '</select><div class="btn-row"><button class="btn small ghost" data-act="voice-test">Nghe thử giọng</button></div>' : '<p class="small">Máy này chưa có giọng tiếng Việt, nên hướng dẫn thiền sẽ hiện bằng chữ. ' + esc(voiceHelp()) + '</p>') + '</div></div>' +
    '<div class="ck-row"><span class="pick-k">Tốc độ đọc</span><div class="chips">' + [[0.8,'Chậm'],[0.95,'Vừa'],[1.1,'Nhanh']].map(([v, n]) => '<button class="chip" data-act="voice-rate" data-v="' + v + '" aria-pressed="' + (Math.abs(p.voiceRate - v) < 0.01) + '">' + n + '</button>').join('') + '</div></div>' +
    '<label class="check"><input type="checkbox" id="voiceOn"' + (p.voice ? ' checked' : '') + '> Đọc hướng dẫn thiền và tên bài tập</label>' +
    '<label class="check"><input type="checkbox" id="breathVoice"' + (p.breathVoice ? ' checked' : '') + '> Đọc “hít vào, thở ra” khi tập thở (tắt thì nghe tiếng chuông nhẹ)</label>' +
    '<p class="small muted" style="margin-top:10px">Âm nền do app tự tạo nên dùng được khi không có mạng. Trên iPhone, khóa màn hình sẽ làm âm thanh dừng; trong lúc tập app tự giữ màn hình sáng. App vẫn phát tiếng khi máy để chế độ im lặng nếu iOS cho phép; không nghe thấy thì gạt nút im lặng lên.</p></div></section>';
}
function focusSoundRow(){
  const p = S.profile, list = ['off','rain','brown','pad','ocean'].concat(OWN.blob ? ['own'] : []);
  return '<div class="pick-row"><span class="pick-k">Âm nền</span><div class="chips">' + list.map(k => '<button class="chip" data-act="focus-sound" data-v="' + k + '" aria-pressed="' + (p.focusSound === k) + '">' + SOUNDS[k].n + '</button>').join('') + '</div></div>';
}
let previewTok = 0;
Object.assign(ACT, {
  'sound-start': b => startSound(b.dataset.k, +b.dataset.m),
  'snd-def': b => { const k = b.dataset.v; S.profile.calmSound = k; persist(['profile']); b.parentNode.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b))); if(k === 'own' && !OWN.blob) toast('Chọn file nhạc ở dòng Nhạc của bạn ngay bên dưới.'); },
  'snd-preview': b => {
    if(AMB.bus && b.dataset.on){ ambStop(0.6); delete b.dataset.on; b.textContent = 'Nghe thử'; return; }
    const tok = ++previewTok; ambStart(S.profile.calmSound); b.dataset.on = '1'; b.textContent = 'Dừng';
    setTimeout(() => { if(tok === previewTok && $('#calm').hidden){ ambStop(1.5); const bb = document.querySelector('[data-act="snd-preview"]'); if(bb){ delete bb.dataset.on; bb.textContent = 'Nghe thử'; } } }, 9000);
  },
  'own-del': () => { MediaDB.del().catch(() => {}); OWN.blob = null; OWN.name = ''; if(S.profile.calmSound === 'own') S.profile.calmSound = 'pad'; if(S.profile.focusSound === 'own') S.profile.focusSound = 'off'; persist(['profile']); renderMind(); renderWork(); toast('Đã bỏ file nhạc.'); },
  'voice-test': () => { if(!speakQueue('Hít vào thật chậm. Thở ra thật dài. Mình đang ở đây, với hơi thở này.')) toast(S.profile.voice ? 'Máy chưa có giọng tiếng Việt.' : 'Bật “Đọc hướng dẫn thiền” trước nhé.'); },
  'voice-rate': b => { S.profile.voiceRate = +b.dataset.v; persist(['profile']); b.parentNode.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b))); speakQueue('Tốc độ đọc như thế này.'); },
  'focus-sound': b => { const k = b.dataset.v; S.profile.focusSound = k; persist(['profile']); b.parentNode.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b))); if(FT.state === 'work'){ if(k === 'off') ambStop(1); else ambStart(k); } if(k === 'own' && !OWN.blob) toast('Chọn file nhạc trong trang Tâm trí, mục Âm thanh và giọng đọc.'); },
  'cm-snd-toggle': () => { const p = $('#cmSnd'); if(p) p.hidden = !p.hidden; },
  'cm-snd': b => {
    const k = b.dataset.v;
    if(CM.meta.kind === 'sound') CM.meta.sound = k; else { S.profile.calmSound = k; persist(['profile']); }
    b.parentNode.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    ambStart(k); if(CM.paused) ambPause(true);
  }
});
document.addEventListener('input', e => {
  const id = e.target && e.target.id;
  if(id === 'calmVol' || id === 'cmVol'){ const v = +e.target.value; S.profile.calmVol = v; ambSetVol(v); }
});
document.addEventListener('change', e => {
  const t = e.target, id = t && t.id; if(!id || !S.profile) return;
  if(id === 'calmVol' || id === 'cmVol') persist(['profile']);
  else if(id === 'voiceSel'){ S.profile.voiceName = t.value; persist(['profile']); speakQueue('Xin chào, mình sẽ đọc hướng dẫn bằng giọng này.'); }
  else if(id === 'voiceOn' || id === 'cmVoice'){ S.profile.voice = t.checked; persist(['profile']); if(!t.checked){ try{ speechSynthesis.cancel(); }catch(err){} ambDuck(false); } }
  else if(id === 'breathVoice'){ S.profile.breathVoice = t.checked; persist(['profile']); }
  else if(id === 'ownFile' && t.files && t.files[0]){
    const f = t.files[0];
    if(f.size > 60 * 1024 * 1024){ toast('File lớn quá (trên 60 MB). Chọn file ngắn hơn nhé.'); return; }
    OWN.blob = f; OWN.name = f.name; S.profile.calmSound = 'own'; persist(['profile']);
    MediaDB.put({blob:f, name:f.name}).then(() => toast('Đã lưu “' + f.name + '” làm âm nền.')).catch(() => toast('Dùng được trong lần mở này; máy không cho lưu file lâu dài.'));
    renderMind(); renderWork();
  }
});
$('#calm').addEventListener('click', e => {
  const el = $('#calm');
  if(el.classList.contains('dim')){ el.classList.remove('dim'); e.stopPropagation(); e.preventDefault(); cmDimSoon(); }
}, true);

/* ================= boot ================= */
(function boot(){
  const local = loadLocal();
  if(local && local.profile) S = normalize(local);
  sync.booting = !OFFLINE && !S.profile && !!(window.claude && typeof window.claude.use === 'function');
  route(); renderAll();
  if(sync.booting) setTimeout(() => { if(sync.booting){ sync.booting = false; renderAll(); } }, 6000);
  connect(); initCoach();
  if(OFFLINE && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  setInterval(() => {
    if(!S.profile || !$('#player').hidden || !$('#sheet').hidden || UI.view !== 'hom-nay') return;
    const ae = document.activeElement; if(ae && /input|textarea|select/i.test(ae.tagName)) return;
    const y = window.scrollY; renderToday(); window.scrollTo(0, y);
  }, 5 * 60000);
})();

</script>
</body>
